# Optional service: use together with docker-compose.yml, always with -p.
services:
  remote-browser:
    image: ${ANALYZER_IMAGE:-short-video-analyzer:latest}
    command: python scripts/remote_browser.py
    init: true
    # Match the existing account browsers: Chrome's namespace sandbox needs this.
    cap_add:
      - SYS_ADMIN
    environment:
      WEB_PORT: ${WEB_PORT:-4002}
      TZ: ${TZ:-Asia/Shanghai}
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ${DATA_DIR:-./data}/remote_browser:/workspace/data/remote_browser
      - ${MIHOMO_CONFIG_DIR:-/etc/mihomo}/config.yaml:/run/mihomo-source.yaml:ro
      - /usr/local/bin/mihomo:/usr/local/bin/mihomo:ro
    network_mode: host
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+str(int(os.environ.get('WEB_PORT','4002'))+12000)+'/vnc.html',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
