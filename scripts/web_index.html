<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Short Video Analyzer</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--line:#d7e0ec;--text:#142033;--muted:#607089;--blue:#2563eb;--soft:#eaf1ff;--red:#b42318;--green:#087443;--dark:#0d1628;--shadow:0 18px 45px rgba(15,23,42,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}.page{display:none;padding:18px;min-height:calc(100vh - 64px)}.page.active{display:block}.grid{display:grid;grid-template-columns:420px 1fr;gap:18px}.detail-grid{display:grid;grid-template-columns:320px 1fr;gap:18px;height:calc(100vh - 100px)}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.stack{display:grid;gap:16px;padding:18px}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:18px}.title{font-weight:800;margin:0 0 8px}label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}textarea{min-height:150px;font:13px/1.5 Consolas,monospace}button{border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#fff;min-height:38px;padding:7px 12px;font-weight:750;cursor:pointer}button.secondary{background:#fff;color:var(--blue)}button.danger{background:#fff;color:var(--red);border-color:#fecaca}button.small{min-height:30px;font-size:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted);font-size:13px}.status{border:1px solid var(--line);border-radius:9px;padding:10px;background:#f8fafc;color:var(--muted);overflow-wrap:anywhere}.status.ok{background:#ecfdf3;color:var(--green)}.status.bad{background:#fff1f2;color:var(--red)}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.prompt{display:none}.prompt.active{display:block}.log{margin:0;height:100%;min-height:420px;overflow:auto;background:var(--dark);color:#e6edf7;padding:16px;font:13px/1.7 Consolas,monospace;white-space:pre-wrap;word-break:break-word}.files{display:grid;gap:8px;max-height:280px;overflow:auto}.detail-files{padding:14px;max-height:none}.file{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.file.selected{border-color:var(--blue);background:var(--soft)}.file-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tabs{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.tab{background:#fff;color:var(--text);border-color:var(--line)}.tab.active{background:var(--soft);color:var(--blue);border-color:var(--blue)}.toolbar{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f8fafc}.out{overflow:auto;padding:20px;height:100%;line-height:1.7;white-space:pre-wrap;word-break:break-word}.out.raw{background:var(--dark);color:#e6edf7;font-family:Consolas,monospace}.report{display:grid;gap:12px;max-width:1100px}.hero,.section,.metric{border:1px solid var(--line);border-radius:10px;background:#fff}.hero{padding:16px;background:linear-gradient(135deg,rgba(37,99,235,.1),transparent),#fff}.hero h2{margin:4px 0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{padding:10px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:4px}.section h3{margin:0;padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:15px}.section div{padding:12px 14px}.drop{position:fixed;inset:14px;display:none;align-items:center;justify-content:center;border:2px dashed var(--blue);border-radius:18px;background:rgba(239,246,255,.85);z-index:9}.drop.active{d </style>
</head>
<body>
<div id="drop" class="drop"><div class="card stack"><b>松手上传视频</b><span class="muted">支持一次拖入多个视频</span></div></div>
<header><h1>Short Video Analyzer</h1><div id="current" class="muted">主页</div></header>
<main id="home" class="page active"><div class="grid"><section class="card stack">
<div><p class="title">TikTok / 抖音链接下载</p><label>公开视频链接</label><input id="url" placeholder="https://www.tiktok.com/@user/video/... 或 https://v.douyin.com/..."></div><div class="row"><button id="download">下载视频</button><button id="network" class="secondary">检测代理出口</button></div>
<div><p class="title">批量上传视频</p><label>上传到 videos/</label><input id="videoFile" type="file" accept="video/*" multiple></div><div class="row"><button id="upload">上传</button><button id="refresh" class="secondary">刷新列表</button></div>
<div><p class="title">已上传视频</p><div id="homeFiles" class="files"></div></div>
<div><p class="title">分析选项</p><label>处理方式</label><select id="mode"><option value="analyzer">关键帧提取模式（video-analyzer）</option><option value="direct_video">直接视频理解模式（Qwen）</option></select></div>
<button id="promptBtn" class="secondary">显示当前提示词</button><div id="promptPanel" class="prompt"><label>分析提示词</label><textarea id="prompt"></textarea></div><label class="check"><input id="autoPost" type="checkbox">自动生成 DeepSeek 分析</label><div class="row"><button id="analyze" disabled>开始分析</button><button id="post" class="secondary" disabled>手动生成分析报告</button></div><div id="status" class="status">等待上传、下载或选择视频。</div>
</section><section class="card" style="display:grid;grid-template-rows:auto 1fr"><div class="head"><div><h2>任务日志</h2><div class="muted">下载、上传、分析和代理检测都会记录在这里。</div></div><button id="clearLog" class="secondary small">清空日志</button></div><pre id="log" class="log">等待任务...</pre></section></div></main>
<main id="detail" class="page"><div class="detail-grid"><section class="card" style="display:grid;grid-template-rows:auto 1fr"><div class="head" style="display:grid"><button id="back" class="secondary">返回主页</button><div><h2>已上传视频</h2><div class="muted">点击切换详情。</div></div></div><div id="detailFiles" class="files detail-files"></div></section><section class="card result" style="display:grid;grid-template-rows:auto auto minmax(0,1fr)"><div class="tabs"><button class="tab active" data-tab="content">提取内容（中文）</button><button class="tab" data-tab="audit">分析结果（中文）</button></div><div class="toolbar"><b id="outTitle">Qwen 输出内容，DeepSeek 翻译</b><div class="row"><button id="source" class="secondary small">显示原文</button><button id="json" class="secondary small">下载原文 JSON</button></div></div><div id="out" class="out">{}</div></section></div></main>
<script>
window.DEFAULT_ANALYSIS_MODE="__DEFAULT_ANALYSIS_MODE__";const S={file:"",files:[],result:null,job:null,tab:"content",raw:false,has:false,logs:[]};const $=id=>document.getElementById(id),home=$('home'),detail=$('detail'),current=$('current'),status=$('status'),log=$('log'),out=$('out');let de=null,je=null,drag=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pretty(v){return v==null?'{}':typeof v==='string'?v:JSON.stringify(v,null,2)}function clean(v){let s=typeof v==='string'?v:(v&&typeof v.response==='string'?v.response:pretty(v));return s.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim()}function bytes(n){return`${Math.round(Number(n||0)/1024/1024*10)/10} MB`}function setStatus(m,k=''){status.className='status '+k;status.textContent=m}function addLog(m){S.logs.push(`[${new Date().toLocaleTimeString()}] ${m}`);log.textContent=S.logs.join('\n')||'等待任务...';log.scrollTop=log.scrollHeight}
function metric(k,v){return v==null||v===''?'':`<div class="metric"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}function sec(t,b){b=clean(b);return b?`<section class="section"><h3>${esc(t)}</h3><div>${esc(b)}</div></section>`:''}function list(t,a,map=x=>x){if(!Array.isArray(a)||!a.length)return'';return`<section class="section"><h3>${esc(t)}</h3><div>${a.map((x,i)=>`- ${esc(clean(map(x,i)))}`).join('\n')}</div></section>`}function has(r){return!!(r&&(r.analysis||r.analysis_zh||r.audit_result||r.audit_result_zh))}
function extraction(v){if(!v||typeof v!=='object')return pretty(v);const md=v.metadata||{},tr=v.transcript||{},u=v.usage||{},tl=Array.isArray(v.timeline)?v.timeline:[],ve=Array.isArray(v.visual_evidence)?v.visual_evidence:[];return`<article class="report"><div class="hero"><small>Qwen Video Extraction</small><h2>提取内容报告</h2><p>${esc(clean(v.summary)||'视频内容、画面证据和音频转写的结构化整理。')}</p></div><div class="metrics">${metric('处理模式',v.processing_mode)}${metric('视觉模型',v.vision_model||md.model)}${metric('音频模式',v.audio_mode)}${metric('处理帧数',md.frames_processed||md.frames_extracted)}${metric('音频语言',tr.language||md.audio_language)}${metric('输入 Tokens',u.input_tokens)}${metric('输出 Tokens',u.output_tokens)}${metric('总 Tokens',u.total_tokens)}${metric('API 调用',u.api_calls)}${metric('总耗时',u.elapsed_seconds==null?'':u.elapsed_seconds+'s')}</div>${sec('模型总结',v.summary)}${sec('视频画面总述',v.video_description)}${list('时间线',tl,x=>typeof x==='string'?x:`${x.time_range||x.timestamp||''}\n${x.visual||''}\n${x.audio||''}`)}${list('视觉证据',ve,x=>typeof x==='string'?x:(x.description||x.visual||pretty(x)))}${sec('转写文本',tr.text||'无转写文本')}</article>`}
function audit(v){if(!v||typeof v!=='object')return pretty(v);return`<article class="report"><div class="hero"><small>DeepSeek Audit</small><h2>分析结果报告</h2><p>${esc(v.summary||'基于提取内容生成的风险和发布建议。')}</p></div><div class="metrics">${metric('风险等级',v.risk_level)}${metric('建议动作',v.recommended_action)}${metric('发布建议',v.publish_suggestion)}</div>${sec('内容摘要',v.summary)}${sec('内容概览',v.content_overview)}${sec('转写要点',v.transcript_notes)}${sec('画面要点',v.visual_notes)}${list('风险原因',v.risk_reasons)}${list('问题点',v.issues)}</article>`}
function renderOut(r){S.result=r;out.className=S.raw?'out raw':'out';let v;if(S.tab==='content'){v=S.raw?r?.analysis:(r?.analysis_zh||r?.analysis);$('json').style.display='inline-flex';$('outTitle').textContent=S.raw?'Qwen 输出内容，原文 JSON':'Qwen 输出内容，DeepSeek 翻译';S.raw?out.textContent=pretty(v):out.innerHTML=extraction(v)}else{v=S.raw?r?.audit_result:(r?.audit_result_zh||r?.audit_result);$('json').style.display='none';$('outTitle').textContent=S.raw?'DeepSeek 分析内容，原文':'DeepSeek 分析内容，中文';S.raw?out.textContent=pretty(v):out.innerHTML=audit(v)}$('source').textContent=S.raw?'显示中文':'显示原文'}function buttons(){$('analyze').textContent=S.has?'重新分析':'开始分析';$('analyze').disabled=!S.file;$('post').disabled=!S.file||!S.has||!!S.job}
function renderFiles(){for(const[id,detailMode]of[['homeFiles',false],['detailFiles',true]]){const box=$(id);box.innerHTML='';if(!S.files.length){box.innerHTML='<div class="muted">videos/ 目录暂无视频</div>';continue}S.files.forEach(f=>{const el=document.createElement('div');el.className='file'+(f.name===S.file?' selected':'');el.innerHTML=`<span style="min-width:0"><span class="file-name">${esc(f.name)}</span><br><span class="muted">${bytes(f.size)}</span></span>${detailMode?'':`<span class="file-actions"><button class="secondary small">播放</button><button class="danger small">删除</button></span>`}`;el.onclick=()=>toDetail(f.name);if(!detailMode){const b=el.querySelectorAll('button');b[0].onclick=e=>{e.stopPropagation();open('/video/'+encodeURIComponent(f.name),'_blank','noopener')};b[1].onclick=e=>{e.stopPropagation();delFile(f.name)}}box.appendChild(el)})}buttons()}function view(v,f=''){home.classList.toggle('active',v==='home');detail.classList.toggle('active',v==='detail');current.textContent=v==='detail'&&f?f:'主页'}function toHome(){location.hash='';view('home')}function toDetail(f){location.hash='detail='+encodeURIComponent(f)}function route(){const h=location.hash.slice(1);if(h.startsWith('detail=')){select(decodeURIComponent(h.slice(7)),false);view('detail',S.file)}else{view('home');renderFiles()}}
async function refresh(){const r=await fetch('/api/files');S.files=await r.json();if(!Array.isArray(S.files))S.files=[];renderFiles()}async function loadResult(name){const r=await fetch('/api/result?filename='+encodeURIComponent(name)),j=await r.json();if(r.ok&&has(j)){S.result=j;S.has=true;const p=j.analysis&&j.analysis.metadata&&j.analysis.metadata.analysis_prompt;if(p)$('prompt').value=p;renderOut(j);setStatus(name+': 已加载已有输出','ok')}else{S.result=null;S.has=false;out.textContent='{}';setStatus(name+': 等待分析')}buttons()}function select(name,openDetail=true){S.file=name;current.textContent=name||'主页';S.has=false;renderFiles();if(name)loadResult(name).catch(e=>setStatus(e.message,'bad'));if(openDetail&&name)toDetail(name)}
async function upload(files=null){const input=$('videoFile'),arr=Array.from(files||input.files||[]);if(!arr.length)return setStatus('请选择至少一个视频文件。','bad');const bad=arr.filter(f=>!f.type.startsWith('video/'));if(bad.length){addLog('上传被拦截，存在非视频文件：'+bad.map(f=>f.name).join(', '));return setStatus('请选择视频文件。','bad')}const form=new FormData();arr.forEach(f=>form.append('video',f));addLog(`开始上传 ${arr.length} 个视频。`);const r=await fetch('/api/upload',{method:'POST',body:form}),p=await r.json(),ok=Array.isArray(p.files)?p.files:[],err=Array.isArray(p.errors)?p.errors:[];ok.forEach(f=>addLog(`上传成功：${f.filename} (${bytes(f.size)})`));err.forEach(e=>addLog(`上传失败：${e.filename||'未知文件'} - ${e.error||'未知错误'}`));if(!r.ok&&!ok.length)return setStatus(p.error||'上传失败','bad');setStatus(`上传完成：成功 ${ok.length} 个，失败 ${err.length} 个`,err.length?'bad':'ok');input.value='';await refresh();if(ok.length)select(ok.at(-1).filename,false)}async function delFile(name){if(!confirm(`删除 ${name} 及其所有分析输出？`))return;const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:name})});if(!r.ok)return setStatus('删除失败','bad');addLog('删除完成：'+name);if(S.file===name){S.file='';S.result=null;S.has=false;toHome()}await refresh()}
function closeD(){if(de){de.close();de=null}}function closeJ(){if(je){je.close();je=null}}function lastLog(j){return j&&Array.isArray(j.log)&&j.log.length?j.log.at(-1):''}async function startDownload(){const url=$('url').value.trim();if(!url)return setStatus('请输入 TikTok 或抖音视频链接。','bad');$('download').disabled=true;addLog('提交视频下载：'+url);const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),j=await r.json();if(!r.ok){$('download').disabled=false;return setStatus(j.error||'下载任务提交失败','bad')}closeD();de=new EventSource('/api/download-events?id='+encodeURIComponent(j.id));de.onmessage=async e=>{const j=JSON.parse(e.data),l=lastLog(j);if(l)addLog('下载：'+l);if(j.status==='running'||j.status==='queued')return setStatus(`视频下载中：${j.status}`);closeD();$('download').disabled=false;if(j.status!=='complete')return setStatus('视频下载失败：'+(j.error||'未知错误'),'bad');setStatus(j.filename+': 下载完成','ok');$('url').value='';await refresh();select(j.filename,false)};de.onerror=()=>{closeD();$('download').disabled=false;setStatus('视频下载连接中断','bad')}}
async function checkNet(){$('network').disabled=true;try{const r=await fetch('/api/network-check'),p=await r.json();const fmt=x=>!x?'未配置':(!x.ok?'失败：'+(x.error||'未知错误'):`${x.ip||'未知 IP'} / ${x.country_name||x.country||'未知地区'} / ${x.is_us?'美国出口':'非美国出口'}`);addLog('直连：'+fmt(p.direct));addLog('代理：'+fmt(p.proxy));setStatus(`直连：${fmt(p.direct)}；代理：${fmt(p.proxy)}`,p.proxy&&p.proxy.ok&&p.proxy.is_us?'ok':'bad')}catch(e){setStatus(e.message,'bad')}finally{$('network').disabled=false}}
async function analyze(){if(!S.file)return;$('analyze').disabled=true;$('post').disabled=true;const reset=S.has;addLog(`${S.file}: ${reset?'清空旧输出并重新分析':'提交分析任务'}`);const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:S.file,analysis_mode:$('mode').value,analysis_prompt:$('prompt').value,postprocess:$('autoPost').checked,reset_output:reset})}),j=await r.json();if(!r.ok){setStatus(j.error||'提交失败','bad');return buttons()}S.job=j.id;openJob(j.id)}async function postprocess(){if(!S.file||!S.has)return;const r=await fetch('/api/postprocess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:S.file})}),j=await r.json();if(!r.ok)return setStatus(j.error||'提交失败','bad');S.tab='audit';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='audit'));S.job=j.id;openJob(j.id)}function openJob(id){closeJ();je=new EventSource('/api/job-events?id='+encodeURIComponent(id));je.onmessage=e=>{const j=JSON.parse(e.data),l=lastLog(j);if(l)addLog(`${j.filename}: ${l}`);S.result=j;if(location.hash.startsWith('#detail='))renderOut(j);if(j.status==='running'||j.status==='queued')return setStatus(`${j.filename}: ${j.status}`);closeJ();S.job=null;S.has=j.status==='complete'||has(j);buttons();setStatus(j.status==='complete'?`${j.filename}: 完成`:`${j.filename}: ${j.error||'失败'}`,j.status==='complete'?'ok':'bad')};je.onerror=()=>{closeJ();buttons();setStatus('分析任务连接中断','bad')}}
function downloadJson(){const a=S.result&&S.result.analysis;if(!a)return setStatus('当前视频还没有 analysis.json。','bad');const name=`${S.file||'video'}.analysis.json`,blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);addLog('下载原文 JSON：'+name)}
$('download').onclick=startDownload;$('network').onclick=checkNet;$('upload').onclick=()=>upload();$('refresh').onclick=()=>refresh().then(()=>addLog('已刷新视频列表。'));$('analyze').onclick=analyze;$('post').onclick=postprocess;$('back').onclick=toHome;$('clearLog').onclick=()=>{S.logs=[];log.textContent='等待任务...'};$('source').onclick=()=>{S.raw=!S.raw;renderOut(S.result)};$('json').onclick=downloadJson;$('mode').value=window.DEFAULT_ANALYSIS_MODE||'analyzer';$('promptBtn').onclick=()=>{$('promptPanel').classList.toggle('active');$('promptBtn').textContent=$('promptPanel').classList.contains('active')?'隐藏当前提示词':'显示当前提示词'};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');S.tab=t.dataset.tab;S.raw=false;renderOut(S.result)});addEventListener('hashchange',route);addEventListener('dragenter',e=>{e.preventDefault();drag++;$('drop').classList.add('active')});addEventListener('dragover',e=>e.preventDefault());addEventListener('dragleave',e=>{e.preventDefault();drag=Math.max(0,drag-1);if(!drag)$('drop').classList.remove('active')});addEventListener('drop',e=>{e.preventDefault();drag=0;$('drop').classList.remove('active');if(e.dataTransfer.files.length)upload(e.dataTransfer.files)});fetch('/api/prompt').then(r=>r.json()).then(p=>$('prompt').value=p.prompt||'').catch(()=>{});refresh().then(route).catch(e=>setStatus(e.message,'bad'));
</script>
