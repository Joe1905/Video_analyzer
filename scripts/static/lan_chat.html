dal{width:min(440px,100%);max-height:min(680px,88dvh);background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.modal-head{padding:20px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.modal-head h2{font-size:18px;margin:0}.modal-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.modal-body{padding:18px 22px;overflow:auto}.field{display:grid;gap:7px;margin-bottom:17px}.field label{font-size:12px;font-weight:800}.field input{height:44px;border:1px solid var(--line);border-radius:13px;padding:0 13px;outline:0;background:#fff}.field-note{font-size:11px;color:var(--subtle);line-height:1.55}.profile-preview{display:flex;align-items:center;gap:13px;padding:13px;background:var(--soft);border-radius:15px;margin-bottom:18px}.profile-preview .avatar{width:52px;height:52px;border-radius:17px}.member-picker{border:1px solid var(--line);border-radius:14px;max-height:230px;overflow:auto}.pick-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.pick-row:last-child{border-bottom:0}.pick-row:hover{background:var(--soft)}.pick-row input{width:17px;height:17px;accent-color:var(--accent)}.modal-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line)}.button{height:40px;border-radius:12px;padding:0 16px;font-weight:800;font-size:13px}.button.secondary{border:1px solid var(--line);background:#fff}.button.secondary:hover{background:var(--soft)}.button.primary{background:var(--accent);color:#fff}.button.primary:hover{background:var(--accent-dark)}.toast{position:fixed;left:50%;bottom:24px;z-index:120;transform:translate(-50%,16px);background:#182537;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%, <style>
html,body{width:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{max-width:100vw}
.section,.room-list,.room-item{min-width:0;max-width:100%}
.room-item{overflow:hidden}
.room-copy{width:0;max-width:100%;overflow:hidden;flex:1 1 0}
.room-name,.room-preview{display:block;max-width:100%}
.bubble.has-image{padding:4px;overflow:hidden}
.message-image{display:block;max-width:min(320px,70vw);padding:0;border-radius:12px;overflow:hidden;background:#eef2f5}
.message-image img{display:block;width:auto;max-width:100%;max-height:420px;object-fit:contain}
.message-text{padding:6px 9px;white-space:pre-wrap;word-break:break-word}
.composer{display:grid;padding:7px 8px;gap:6px}
.composer-row{min-width:0;display:flex;align-items:flex-end;gap:9px}
.attach-button{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:21px;line-height:1}
.attach-button:hover{background:var(--soft);color:var(--accent)}
.attach-button:disabled{opacity:.45;cursor:not-allowed}
.image-draft{display:flex;align-items:center;gap:9px;padding:3px 5px 5px}
.image-draft[hidden]{display:none}
.image-draft img{width:56px;height:56px;border-radius:11px;object-fit:cover;background:var(--soft)}
.image-draft span{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.remove-image{width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--muted);font-size:18px}
.image-viewer{position:fixed;z-index:150;inset:0;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:rgba(10,18,28,.9);backdrop-filter:blur(8px)}
.image-viewer[hidden]{display:none}
.image-viewer img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.34)}
.viewer-close{position:absolute;z-index:1;top:max(14px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:28px;display:grid;place-items:center}
@media(max-width:780px){
  input,textarea{font-size:16px!important}
  .shell,.chat,.app-header{width:100%;max-width:100vw}
  .message-image{max-width:74vw}
  .message-image img{max-height:55dvh}
  .composer textarea{font-size:16px}
  .image-viewer{padding-left:10px;padding-right:10px}
}
</style>

<body>
<header class="app-header">
  <div class="brand"><div class="brand-mark">邻</div><div class="brand-copy"><div class="brand-name">邻聊</div><div class="brand-note">同一网络，随时开聊</div></div></div>
  <div class="header-room"><strong id="headerRoomName">公共频道</strong><span id="headerRoomMeta">所有注册成员都在这里</span></div>
  <nav class="app-nav" aria-label="主导航"></nav>
  <button class="icon-button mobile-only" id="mobileProfile" aria-label="编辑资料">◎</button>
</header>
<div class="shell">
  <aside class="rail left-rail" id="leftRail">
    <div class="profile-card">
      <img class="avatar" id="profileAvatar" alt="我的头像">
      <div class="profile-meta"><strong id="profileName">正在注册…</strong><span><i class="online-dot"></i>本设备在线</span></div>
      <button class="icon-button" id="editProfile" aria-label="编辑资料" title="编辑资料">⋯</button>
    </div>
    <div class="rail-scroll">
      <section class="section"><div class="section-head"><span>公共频道</span></div><div class="room-list" id="publicRooms"></div></section>
      <section class="section"><div class="section-head"><span>私信</span></div><div class="room-list" id="directRooms"></div></section>
      <section class="section"><div class="section-head"><span>群组</span><button id="newGroup">＋ 新建群组</button></div><div class="room-list" id="groupRooms"></div></section>
    </div>
    <div class="rail-foot">公共频道是所有设备的默认群组，始终保留且不能退出。</div>
  </aside>
  <main class="chat">
    <div class="messages" id="messages"><div class="welcome" id="welcome"><div class="welcome-mark">邻</div><h2>公共频道</h2><p>这里的消息对局域网内所有已注册设备可见。打个招呼吧。</p></div></div>
    <div class="composer-wrap"><form class="composer" id="composer"><div class="image-draft" id="imageDraft" hidden><img id="imageDraftPreview" alt="待发送图片预览"><span id="imageDraftName"></span><button class="remove-image" id="removeImage" type="button" aria-label="移除图片">×</button></div><div class="composer-row"><button class="attach-button" id="attachImage" type="button" aria-label="选择图片" title="选择图片">＋</button><input id="imageInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden><textarea id="messageInput" rows="1" maxlength="4000" placeholder="发送消息…" aria-label="消息内容"></textarea><button class="send-button" id="sendButton" type="submit">发送</button></div></form></div>
    <nav class="mobile-tabs" aria-label="聊天视图"><button id="mobileChannels"><b>☰</b>频道</button><button class="active" id="mobileChat"><b>●</b>聊天</button><button id="mobileMembers"><b>◎</b>成员</button></nav>
  </main>
  <aside class="rail right-rail" id="rightRail">
    <div class="right-title"><strong>成员</strong><span id="memberCount">0 人</span></div>
    <div class="member-search"><input id="memberSearch" type="search" placeholder="搜索昵称" aria-label="搜索成员"></div>
    <div class="member-list" id="memberList"></div>
  </aside>
</div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>

<div class="modal-backdrop" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
  <form class="modal" id="profileForm">
    <div class="modal-head"><div><h2 id="profileTitle">设置你的昵称</h2><p id="profileSubtitle">这台设备已经自动注册，昵称随时可以修改。</p></div><button class="icon-button" type="button" data-close-modal aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div class="profile-preview"><img class="avatar" id="profileModalAvatar" alt="默认头像"><div><strong id="profileModalName">新成员</strong><div class="field-note" id="avatarStatusText">默认头像会自动准备</div></div></div>
      <div class="field"><label for="nicknameInput">昵称</label><input id="nicknameInput" name="nickname" maxlength="24" autocomplete="nickname" required placeholder="输入 1-24 个字符"></div>
      <div class="field-note">成员列表和消息中都会显示这个昵称。本地占位头像会立即可用；配置 AI 图片接口后，新注册账号会在后台自动生成专属头像。</div>
    </div>
    <div class="modal-foot"><button class="button secondary" type="button" data-close-modal>稍后设置</button><button class="button primary" type="submit">保存昵称</button></div>
  </form>
</div>

<div class="modal-backdrop" id="groupModal" role="dialog" aria-modal="true" aria-labelledby="groupTitle">
  <form class="modal" id="groupForm">
    <div class="modal-head"><div><h2 id="groupTitle">新建群组</h2><p>选择成员后即可开始小组聊天。</p></div><button class="icon-button" type="button" data-close-modal aria-label="关闭">×</button></div>
    <div class="modal-body"><div class="field"><label for="groupNameInput">群组名称</label><input id="groupNameInput" maxlength="32" required placeholder="例如：项目讨论"></div><div class="field"><label>选择成员</label><div class="member-picker" id="groupMemberPicker"></div></div></div>
    <div class="modal-foot"><button class="button secondary" type="button" data-close-modal>取消</button><button class="button primary" type="submit">创建群组</button></div>
  </form>
</div>
<div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="查看图片" hidden><button class="viewer-close" id="closeImageViewer" type="button" aria-label="关闭大图">×</button><img id="viewerImage" alt="聊天图片大图"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const TOKEN_KEY="videoAnalyzer.lanChat.deviceToken.v1";
const ROOM_KEY="videoAnalyzer.lanChat.activeRoom.v1";
const READ_KEY="videoAnalyzer.lanChat.readRooms.v1";
const $=id=>document.getElementById(id);
const state={token:"",currentUser:null,users:[],rooms:[],activeRoomId:"public",messages:[],lastMessageId:0,readRooms:{},messageTimer:null,bootstrapTimer:null,loadingMessages:false,draftImage:null,preparingImage:false};
function token(){let value=localStorage.getItem(TOKEN_KEY);if(!value){const part=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;value=`${part()}-${part()}`;localStorage.setItem(TOKEN_KEY,value)}return value}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function request(path,options={}){const headers={...(options.headers||{}),"X-Lan-Chat-Token":state.token};if(options.body&&!headers["Content-Type"])headers["Content-Type"]="application/json";const response=await fetch(path,{...options,headers});let payload={};try{payload=await response.json()}catch(e){}if(!response.ok)throw new Error(payload.error||`请求失败 (${response.status})`);return payload}
function toast(message){const el=$("toast");el.textContent=message;el.classList.add("show");clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove("show"),2400)}
function formatTime(seconds){if(!seconds)return"";const date=new Date(seconds*1000),today=new Date();const same=date.toDateString()===today.toDateString();return date.toLocaleString("zh-CN",same?{hour:"2-digit",minute:"2-digit",hour12:false}:{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}
function relativeSeen(seconds){const delta=Math.max(0,Date.now()/1000-seconds);if(delta<90)return"在线";if(delta<3600)return`${Math.floor(delta/60)} 分钟前`;if(delta<86400)return`${Math.floor(delta/3600)} 小时前`;return`${Math.floor(delta/86400)} 天前`}
function roomGlyph(room){return room.kind==="public"?"公":room.kind==="group"?"群":"信"}
function roomPreview(room){const latest=room.latestMessage;if(!latest)return room.kind==="public"?"所有人可见":"还没有消息";return`${latest.nickname}：${latest.hasImage?"[图片] ":""}${latest.content||""}`}
function saveRead(){localStorage.setItem(READ_KEY,JSON.stringify(state.readRooms))}
function readStored(){try{state.readRooms=JSON.parse(localStorage.getItem(READ_KEY)||"{}")||{}}catch(e){state.readRooms={}}state.activeRoomId=localStorage.getItem(ROOM_KEY)||"public"}
function avatar(user,extra=""){return `<img class="avatar ${extra}" src="${esc(user.avatarUrl)}" alt="${esc(user.nickname)}的头像" loading="lazy">`}
async function register(){state.token=token();const response=await fetch("/api/lan-chat/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceToken:state.token})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||"设备注册失败");state.currentUser=payload.user;if(payload.created)openProfile(true)}
async function bootstrap(render=true){const payload=await request("/api/lan-chat/bootstrap");state.currentUser=payload.currentUser;state.users=payload.users||[];state.rooms=payload.rooms||[];if(!state.rooms.some(room=>room.id===state.activeRoomId))state.activeRoomId=payload.publicRoomId||"public";if(render)renderAll();else{renderProfile();renderRooms();renderMembers();renderHeader()}return payload}
function activeRoom(){return state.rooms.find(room=>room.id===state.activeRoomId)||state.rooms[0]}
function renderProfile(){const user=state.currentUser;if(!user)return;$("profileAvatar").src=user.avatarUrl;$("profileModalAvatar").src=user.avatarUrl;$("profileName").textContent=user.nickname;$("profileModalName").textContent=user.nickname;if(!$("profileModal").classList.contains("show"))$("nicknameInput").value=user.nickname;$("avatarStatusText").textContent=user.avatarStatus==="ready"?"AI 默认头像已生成":user.avatarStatus==="pending"?"AI 默认头像正在后台生成":"本地默认头像已启用"}
function renderRoomList(kind,elementId){const list=$(elementId),rooms=state.rooms.filter(room=>room.kind===kind);list.innerHTML=rooms.map(room=>{const unread=(room.latestMessage?.createdAt||0)>(state.readRooms[room.id]||0)&&room.id!==state.activeRoomId;return `<button class="room-item ${room.id===state.activeRoomId?"active":""} ${unread?"unread":""}" data-room-id="${esc(room.id)}"><span class="room-glyph">${roomGlyph(room)}</span><span class="room-copy"><span class="room-name">${esc(room.name)}</span><span class="room-preview">${esc(roomPreview(room))}</span></span><i class="unread-dot"></i></button>`}).join("")||`<div class="room-preview" style="padding:8px 10px">${kind==="direct"?"点击右侧成员发起私信":"暂时没有群组"}</div>`;list.querySelectorAll("[data-room-id]").forEach(button=>button.onclick=()=>selectRoom(button.dataset.roomId))}
function renderRooms(){renderRoomList("public","publicRooms");renderRoomList("direct","directRooms");renderRoomList("group","groupRooms")}
function renderMembers(){const query=$("memberSearch").value.trim().toLowerCase(),users=state.users.filter(user=>!query||user.nickname.toLowerCase().includes(query));$("memberCount").textContent=`${state.users.length} 人`;$("memberList").innerHTML=users.map(user=>`<button class="member-item ${user.isCurrent?"current":""}" data-user-id="${esc(user.id)}" ${user.isCurrent?"disabled":""}>${avatar(user,"small")}<span class="member-copy"><strong>${esc(user.nickname)}${user.isCurrent?"（我）":""}</strong><span>${user.online?'<i class="online-dot"></i> 在线':esc(relativeSeen(user.lastSeen))}</span></span>${user.isCurrent?"":'<span class="member-dm">私信</span>'}</button>`).join("");$("memberList").querySelectorAll("[data-user-id]:not([disabled])").forEach(button=>button.onclick=()=>startDirect(button.dataset.userId))}
function renderHeader(){const room=activeRoom();if(!room)return;$("headerRoomName").textContent=room.name;$("headerRoomMeta").textContent=room.kind==="public"?`${room.memberCount} 位注册成员 · 所有人可见`:room.kind==="group"?`${room.memberCount} 位成员 · 群组聊天`:"仅双方可见"}
function renderAll(){renderProfile();renderRooms();renderMembers();renderHeader()}
function renderMessages(){const box=$("messages");if(!state.messages.length){box.innerHTML=`<div class="welcome"><div class="welcome-mark">${roomGlyph(activeRoom()||{kind:"public"})}</div><h2>${esc(activeRoom()?.name||"公共频道")}</h2><p>${activeRoom()?.kind==="public"?"这里的消息对局域网内所有已注册设备可见。打个招呼吧。":"这里还没有消息，发出第一句吧。"}</p></div>`;return}box.innerHTML=state.messages.map(message=>`<article class="message ${message.isMine?"mine":""}" data-message-id="${message.id}"><img class="avatar tiny" src="${esc(message.senderAvatarUrl)}" alt=""><div class="message-body"><div class="message-head"><span class="message-name">${esc(message.senderName)}</span><time>${formatTime(message.createdAt)}</time></div><div class="bubble ${message.imageUrl?"has-image":""}">${message.imageUrl?`<button class="message-image" type="button" aria-label="查看${esc(message.senderName)}发送的图片"><img src="${esc(message.imageUrl)}" alt="${esc(message.senderName)}发送的图片" loading="lazy"></button>${message.content?'<div class="message-text"></div>':""}`:""}</div></div></article>`).join("");box.querySelectorAll("[data-message-id]").forEach((element,index)=>{const message=state.messages[index],bubble=element.querySelector(".bubble");if(message.imageUrl){const text=element.querySelector(".message-text");if(text)text.textContent=message.content;element.querySelector(".message-image").onclick=()=>openImageViewer(message.imageUrl,`${message.senderName}发送的图片`)}else bubble.textContent=message.content});box.scrollTop=box.scrollHeight}
async function selectRoom(roomId){if(roomId===state.activeRoomId){closeDrawers();return}state.activeRoomId=roomId;localStorage.setItem(ROOM_KEY,roomId);state.messages=[];state.lastMessageId=0;state.readRooms[roomId]=Date.now()/1000;saveRead();renderRooms();renderHeader();renderMessages();closeDrawers();await loadMessages(true)}
async function loadMessages(reset=false){if(state.loadingMessages||!state.activeRoomId)return;state.loadingMessages=true;const roomId=state.activeRoomId;try{const after=reset?0:state.lastMessageId;const payload=await request(`/api/lan-chat/rooms/${encodeURIComponent(roomId)}/messages?after=${after}&limit=200`);if(roomId!==state.activeRoomId)return;if(reset)state.messages=[];const known=new Set(state.messages.map(message=>message.id));(payload.messages||[]).forEach(message=>{if(!known.has(message.id))state.messages.push(message)});state.lastMessageId=payload.lastId||state.lastMessageId;if((payload.messages||[]).length||reset){renderMessages();state.readRooms[roomId]=Date.now()/1000;saveRead()}}catch(error){if(reset)toast(error.message)}finally{state.loadingMessages=false}}
async function sendMessage(event){event.preventDefault();const input=$("messageInput"),content=input.value.trim(),draft=state.draftImage;if((!content&&!draft)||state.preparingImage)return;$("sendButton").disabled=true;$("attachImage").disabled=true;try{const payload=await request(`/api/lan-chat/rooms/${encodeURIComponent(state.activeRoomId)}/messages`,{method:"POST",body:JSON.stringify({content,imageData:draft?.dataUrl||""})});if(!state.messages.some(message=>message.id===payload.message.id))state.messages.push(payload.message);state.lastMessageId=Math.max(state.lastMessageId,payload.message.id);input.value="";setDraftImage(null);resizeInput();renderMessages();state.readRooms[state.activeRoomId]=Date.now()/1000;saveRead();await bootstrap(false)}catch(error){toast(error.message)}finally{$("sendButton").disabled=false;$("attachImage").disabled=false;input.focus()}}
async function startDirect(userId){try{const payload=await request("/api/lan-chat/direct",{method:"POST",body:JSON.stringify({targetUserId:userId})});await bootstrap(false);await selectRoom(payload.room.id)}catch(error){toast(error.message)}}
function openProfile(firstTime=false){renderProfile();$("profileTitle").textContent=firstTime?"欢迎来到邻聊":"编辑资料";$("profileSubtitle").textContent=firstTime?"这台设备已经自动注册，先取一个好记的昵称吧。":"昵称会同步显示给局域网内其他成员。";$("profileModal").classList.add("show");setTimeout(()=>$("nicknameInput").select(),80)}
function openGroup(){const users=state.users.filter(user=>!user.isCurrent);$("groupMemberPicker").innerHTML=users.map(user=>`<label class="pick-row"><input type="checkbox" value="${esc(user.id)}">${avatar(user,"tiny")}<span>${esc(user.nickname)}</span></label>`).join("")||'<div class="field-note" style="padding:14px">还没有其他注册成员，仍可先创建群组。</div>';$("groupNameInput").value="";$("groupModal").classList.add("show");setTimeout(()=>$("groupNameInput").focus(),80)}
function closeModals(){document.querySelectorAll(".modal-backdrop.show").forEach(modal=>modal.classList.remove("show"))}
async function saveProfile(event){event.preventDefault();try{const payload=await request("/api/lan-chat/profile",{method:"POST",body:JSON.stringify({nickname:$("nicknameInput").value})});state.currentUser=payload.user;closeModals();await bootstrap(true);toast("昵称已保存")}catch(error){toast(error.message)}}
async function createGroup(event){event.preventDefault();const memberIds=[...$("groupMemberPicker").querySelectorAll("input:checked")].map(input=>input.value);try{const payload=await request("/api/lan-chat/rooms",{method:"POST",body:JSON.stringify({name:$("groupNameInput").value,memberIds})});closeModals();await bootstrap(false);await selectRoom(payload.room.id);toast("群组已创建")}catch(error){toast(error.message)}}
function openDrawer(side){closeDrawers();$(side==="left"?"leftRail":"rightRail").classList.add("open");$("drawerBackdrop").classList.add("show")}
function closeDrawers(){$("leftRail").classList.remove("open");$("rightRail").classList.remove("open");$("drawerBackdrop").classList.remove("show")}
function resizeInput(){const input=$("messageInput");input.style.height="auto";input.style.height=Math.min(input.scrollHeight,132)+"px"}
function readAsDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||""));reader.onerror=()=>reject(new Error("读取图片失败"));reader.readAsDataURL(blob)})}
async function prepareImage(file){if(!file||!file.type.startsWith("image/"))throw new Error("请选择图片文件");if(file.size>20*1024*1024)throw new Error("原图不能超过 20MB");let uploadBlob=file;if(file.type==="image/gif"){if(file.size>5*1024*1024)throw new Error("GIF 不能超过 5MB")}else{const objectUrl=URL.createObjectURL(file),image=new Image();try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error("无法解析这张图片"));image.src=objectUrl});const scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const context=canvas.getContext("2d");context.fillStyle="#fff";context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);uploadBlob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.84));if(!uploadBlob)throw new Error("图片压缩失败")}finally{URL.revokeObjectURL(objectUrl)}}if(uploadBlob.size>5*1024*1024)throw new Error("压缩后图片仍超过 5MB");return{name:file.name||"聊天图片",dataUrl:await readAsDataUrl(uploadBlob),previewUrl:URL.createObjectURL(uploadBlob)}}
function setDraftImage(image){if(state.draftImage?.previewUrl)URL.revokeObjectURL(state.draftImage.previewUrl);state.draftImage=image;$("imageDraft").hidden=!image;if(image){$("imageDraftPreview").src=image.previewUrl;$("imageDraftName").textContent=image.name}else{$("imageDraftPreview").removeAttribute("src");$("imageDraftName").textContent=""}}
async function chooseImage(event){const file=event.target.files?.[0];event.target.value="";if(!file)return;state.preparingImage=true;$("attachImage").disabled=true;$("sendButton").disabled=true;try{setDraftImage(await prepareImage(file))}catch(error){toast(error.message)}finally{state.preparingImage=false;$("attachImage").disabled=false;$("sendButton").disabled=false}}
function openImageViewer(url,alt){$("viewerImage").src=url;$("viewerImage").alt=alt||"聊天图片大图";$("imageViewer").hidden=false;$("closeImageViewer").focus()}
function closeImageViewer(){$("imageViewer").hidden=true;$("viewerImage").removeAttribute("src")}
function bind(){ $("composer").onsubmit=sendMessage;$("messageInput").addEventListener("input",resizeInput);$("messageInput").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();$("composer").requestSubmit()}});$("attachImage").onclick=()=>$("imageInput").click();$("imageInput").onchange=chooseImage;$("removeImage").onclick=()=>setDraftImage(null);$("closeImageViewer").onclick=closeImageViewer;$("imageViewer").onclick=event=>{if(event.target===$("imageViewer"))closeImageViewer()};$("editProfile").onclick=()=>openProfile(false);$("mobileProfile").onclick=()=>openProfile(false);$("newGroup").onclick=openGroup;$("memberSearch").oninput=renderMembers;$("profileForm").onsubmit=saveProfile;$("groupForm").onsubmit=createGroup;document.querySelectorAll("[data-close-modal]").forEach(button=>button.onclick=closeModals);document.querySelectorAll(".modal-backdrop").forEach(backdrop=>backdrop.onclick=event=>{if(event.target===backdrop)closeModals()});$("mobileChannels").onclick=()=>openDrawer("left");$("mobileMembers").onclick=()=>openDrawer("right");$("mobileChat").onclick=closeDrawers;$("drawerBackdrop").onclick=closeDrawers;document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeImageViewer();closeModals();closeDrawers()}})}
async function init(){readStored();bind();try{await register();await bootstrap(true);await loadMessages(true);state.messageTimer=setInterval(()=>loadMessages(false),2000);state.bootstrapTimer=setInterval(()=>bootstrap(false).catch(()=>{}),10000)}catch(error){toast(error.message);$("messages").innerHTML=`<div class="welcome"><div class="welcome-mark">!</div><h2>暂时无法进入邻聊</h2><p>${esc(error.message)}</p></div>`}}
init();
</script>
</body>
</html>
