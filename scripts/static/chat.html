ce-between;gap:8px;align-items:center;margin-bottom:4px;color:var(--text);font-weight:800}.quote-text{max-height:72px;overflow:auto;white-space:pre-wrap}.empty-chat{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:15px;text-align:center;flex-direction:column;gap:8px}.empty-chat b{color:var(--text);font-size:20px}.load-more{text-align:center;padding:8px;color:var(--sub);font-size:12px;cursor:pointer}.msg-actions{display:flex;align-items:center;gap:6px;margin-top:6px;padding-left:4px}.msg-action-status{font-size:11px;color:var(--sub);min-height:18px}.msg-action-status.ok{color:var(--green)}.msg-action-status.err{color:var(--red)}.quote-toolbar{position:fixed;z-index:60;display:none;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(15,23,42,.16);border-radius:10px;padding:5px}.quote-toolbar.show{display:flex}.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:50;display:none;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal-box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.16);width:640px;max-width:92vw;max-height:82vh;display:grid;grid-template-rows:auto 1fr auto}.modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.modal-body{padding:14px 18px;overflow:auto}.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.tree-node{border-bottom:1px solid #f1f5f9}.tree-row{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px}.tree-row.domain{font-weight:900}.tree-row.category{font-weight:800;color:#334155}.tree-toggle{width:24px;height:24px;min-width:24px;min-height:24px;padding:0;border:0;background:transparent;color:var(--muted);font-weight:900}.tree-toggle::before{content:"-"}.tree-node.collapsed>.tree-row .tree-toggle::before{content:"+"}.tree-inden <style>
@layer legacy {
.mobile-session-toggle,.sidebar-backdrop{display:none}
@media(max-width:800px){
  html,body{width:100%;max-width:100vw;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  header{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;gap:8px}
  .header-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
  header h1{min-width:0;max-width:118px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-session-toggle{display:inline-flex;width:38px;height:38px;min-width:38px;min-height:38px;padding:0;font-size:18px}
  .header-actions{min-width:0;flex:1;overflow:hidden;justify-content:flex-end}
  header .app-nav{width:100%;max-width:100%;overflow-x:auto}
  .chat-shell{display:block;width:100%;height:calc(100dvh - 56px - env(safe-area-inset-top));min-height:0}
  .sidebar{display:grid;position:fixed;z-index:45;top:calc(56px + env(safe-area-inset-top));bottom:0;left:0;width:min(86vw,320px);transform:translateX(-105%);visibility:hidden;pointer-events:none;transition:transform .2s ease,visibility .2s ease;box-shadow:0 18px 48px rgba(15,23,42,.2)}
  .sidebar.open{transform:none;visibility:visible;pointer-events:auto}
  .sidebar-backdrop{display:block;position:fixed;z-index:44;inset:calc(56px + env(safe-area-inset-top)) 0 0;background:rgba(15,23,42,.36);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
  .sidebar-backdrop.show{opacity:1;visibility:visible;pointer-events:auto}
  .session-item .del-btn{display:inline-flex}
  .chat-main{width:100%;height:100%;min-width:0}
  .messages{width:100%;padding:14px 12px 18px;gap:13px}
  .msg{max-width:94%;min-width:0}
  .msg.assistant{max-width:100%}
  .bubble{max-width:100%;min-width:0;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
  .bubble pre{font-size:11px;padding:9px 10px}
  .bubble table{font-size:12px;min-width:480px}
  .tool-card{max-width:100%;padding:9px 10px;overflow-wrap:anywhere}
  .msg-actions{flex-wrap:wrap}
  .input-bar{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px auto;align-items:end;gap:6px;padding:8px 10px max(8px,env(safe-area-inset-bottom))}
  .composer{min-width:0}
  .input-bar textarea{min-height:44px;max-height:36dvh;padding:10px 36px 10px 13px;font-size:16px;line-height:1.45}
  .composer.expanded textarea{min-height:28dvh;max-height:42dvh}
  .tool-button{width:38px;height:38px;min-width:38px;min-height:38px}
  .input-bar>button.primary{height:38px;min-width:56px;min-height:38px;padding:0 12px}
  .pending-preview{grid-column:1/-1}
  .modal-overlay{align-items:flex-end;padding-top:env(safe-area-inset-top)}
  .modal-box{width:100%;max-width:100%;max-height:88dvh;border-radius:16px 16px 0 0}
  .modal-head{padding:14px 16px 11px}.modal-body{padding:12px 14px}.modal-foot{padding:10px 14px max(12px,env(safe-area-inset-bottom));flex-wrap:wrap}
  .tree-indent{padding-left:18px}
  .image-viewer{padding:calc(56px + env(safe-area-inset-top)) 10px max(16px,env(safe-area-inset-bottom))}
  .image-viewer img{max-width:100%;max-height:100%}
}
@media(max-width:420px){
  header h1{max-width:92px}
  .messages{padding-left:10px;padding-right:10px}
  .input-bar{padding-left:8px;padding-right:8px}
  .input-bar>button.primary{min-width:52px;padding:0 10px}
}
}

<script>

(()=>{const bar=document.querySelector(".input-bar");if(!bar)return;let dragDepth=0;const hasFiles=event=>Array.from(event.dataTransfer?.types||[]).includes("Files"),clear=()=>{dragDepth=0;bar.classList.remove("is-dragging")};bar.addEventListener("dragenter",event=>{if(!hasFiles(event))return;event.preventDefault();dragDepth++;bar.classList.add("is-dragging")});bar.addEventListener("dragover",event=>{if(!hasFiles(event))return;event.preventDefault();event.dataTransfer.dropEffect="copy";bar.classList.add("is-dragging")});bar.addEventListener("dragleave",event=>{if(!bar.classList.contains("is-dragging"))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)bar.classList.remove("is-dragging")});bar.addEventListener("drop",event=>{if(!hasFiles(event)){clear();return}event.preventDefault();const files=event.dataTransfer?.files;clear();if(files?.length)addImageFiles(files).catch(error=>alert(error.message))});})();
</script>
<script>
(()=>{const sidebar=document.getElementById("sidebar"),toggle=document.getElementById("mobileSessionToggle"),backdrop=document.getElementById("sidebarBackdrop");if(!sidebar||!toggle||!backdrop)return;const setOpen=open=>{sidebar.classList.toggle("open",open);backdrop.classList.toggle("show",open);toggle.setAttribute("aria-expanded",String(open));toggle.setAttribute("aria-label",open?"关闭会话列表":"打开会话列表")};toggle.addEventListener("click",()=>setOpen(!sidebar.classList.contains("open")));backdrop.addEventListener("click",()=>setOpen(false));sidebar.addEventListener("click",event=>{if(event.target.closest(".session-item")&&!event.target.closest(".del-btn"))setOpen(false);if(event.target.closest("#newSession"))setOpen(false)});document.addEventListener("keydown",event=>{if(event.key==="Escape")setOpen(false)});matchMedia("(min-width:801px)").addEventListener("change",event=>{if(event.matches)setOpen(false)})})();
</script>
</body>
