function inlineMd(v){let s=esc(v);s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);return s}function splitTableRow(line){let t=String(line||'').trim();if(t.startsWith('|'))t=t.slice(1);if(t.endsWith('|'))t=t.slice(0,-1);return t.split('|').map(x=>x.trim())}function isTableSep(line){return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line||'')}function renderTable(lines){const header=splitTableRow(lines[0]);const body=lines.slice(2).filter(x=>/\|/.test(x)).map(splitTableRow);return '<div class="md-table-wrap"><table><thead><tr>'+header.map(x=>'<th>'+inlineMd(x)+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+header.map((_,i)=>'<td>'+inlineMd(row[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function isMdBlockStart(lines,i){const line=lines[i]||'';return /^#{1,3}\s+/.test(line)||/^[-*]\s+/.test(line)||/^---+$/.test(line.trim())||(/\|/.test(line)&&i+1<lines.length&&isTableSep(lines[i+1]))}function md(v){const lines=String(v||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');const out=[];for(let i=0;i<lines.length;){let line=lines[i],trim=line.trim();if(!trim){i++;continue}let m=trim.match(/^(#{1,3})\s+(.+)$/);if(m){out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`);i++;continue}if(/^---+$/.test(trim)){out.push('<hr>');i++;continue}if(/\|/.test(line)&&i+1<lines.length&&isTableSep(lines[i+1])){const table=[line,lines[i+1]];i+=2;while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()){table.push(lines[i]);i++}out.push(renderTable(table));continue}if(/^[-*]\s+/.test(trim)){const items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){items.push('<li>'+inlineMd(lines[i].trim().replace(/^[-*]\s+/,''))+'</li>');i++}out.push('<ul>'+items.join('')+'</ul>');continue}const para=[];while(i<lines.length&&lines[i].trim()&&!isMdBlockStart(lines,i)){para.push(lines[i].trim());i++}out.push('<p>'+inlineMd(para.join('\n')).replace(/\n/g,'<br>')+'</p>')}return out.join('')}function toolArgs(t){try{const raw=t?.function?.arguments;return typeof raw==='string'?JSON.parse(raw||'{}'):(raw||{})}catch(e){return{}}}function splitTool(name){const s=String(name||'');const i=s.indexOf('__');return i>0?[s.slice(0,i),s.slice(i+2)]:['function',s]}function domainLabel(d){return {system:'\u7cfb\u7edf',function:'\u529f\u80fd',sellersprite:'\u5356\u5bb6\u7cbe\u7075',fastmoss:'FastMoss'}[d]||d}function toolLabelMap(){const map={};(S.toolCatalog?.domains||[]).forEach(d=>(d.categories||[]).forEach(c=>(c.tools||[]).forEach(t=>{if(t&&t.id)map[t.id]=t.label||t.name||t.id;if(t&&t.name)map[t.name]=t.label||t.name})));return map}function prettifyToolName(name){return String(name||'').split(/[_-]+/).filter(Boolean).join(' / ')}function toolDisplayName(name){const [domain,base]=splitTool(name);const map=toolLabelMap();return map[name]||map[base]||prettifyToolName(base)}function shortArg(args){for(const k of ['keyword','query','q','url','asin','product_id','category','words']){const v=args&&args[k];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim().slice(0,80)}return''}function toolTitle(name,args){const [domain]=splitTool(name);const target=shortArg(args);return `${domainLabel(domain)} / ${toolDisplayName(name)}${target?' - '+target:''}`}function cacheTag(result){const c=result&&result.cache;if(!c)return'';return`<span class="cache-tag">${c.hit?'\u7f13\u5b58\u547d\u4e2d':'\u5b9e\u65f6\u8c03\u7528'}</span>`}
function renderToolCards(m){const calls=m.tool_calls||[];if(!calls.length)return'';const results=m.tool_results||[];const cards=calls.map((t,i)=>{const name=t?.function?.name||'tool';const args=toolArgs(t);const [domain]=splitTool(name);const display=toolDisplayName(name);const r=results[i];const ok=!!(r&&r.result&&r.result.ok);const status=r?`<div class="tool-status ${ok?'ok':'err'}">${esc(display)}: ${ok?TXT.success:TXT.fail}${cacheTag(r.result)}</div>`:`<div class="tool-status">${TXT.running}</div>`;return`<div class="tool-card"><div class="tool-name"><span class="tool-domain">${esc(domainLabel(domain))}</span>${esc(toolTitle(name,args))}</div>${status}</div>`}).join('');const done=m.status==='done'&&String(m.content||'').trim();return done?`<details class="tool-log"><summary>${TXT.toolLog} (${calls.length})</summary>${cards}</details>`:`<div class="tool-log">${cards}</div>`}function renderMessageAttachments(m){const items=Array.isArray(m.attachments)?m.attachments:[];if(!items.length)return'';return`<div class="attachment-grid">${items.map(a=>{const src=esc(a.url||a.dataUrl||'');return src?`<img src="${src}" alt="${esc(a.name||'image')}" loading="lazy">`:''}).join('')}</div>`}function renderMsg(m,scroll=true){const mid=String(m.id||''),cid=String(m._clientId||'');let el=null;if(mid)el=msgBox.querySelector(`[data-msg-id="${CSS.escape(mid)}"]`);if(!el&&cid)el=msgBox.querySelector(`[data-client-msg-id="${CSS.escape(cid)}"]`);if(!el){el=document.createElement('div');el.className='msg '+m.role;msgBox.appendChild(el)}el.className='msg '+m.role;el.dataset.msgId=mid;el.dataset.clientMsgId=cid;const userBody=renderMessageAttachments(m)+(m.content?`<div>${esc(m.content)}</div>`:'');let html=`<div class="bubble">${m.role==='assistant'?md(m.content||TXT.thinking):userBody}</div>`;if(m.role==='assistant')html=renderToolCards(m)+html+renderActions(m);html+=`<div class="time">${formatTime(m.created_at)}</div>`;el.innerHTML=html;if(scroll)msgBox.scrollTop=msgBox.scrollHeight}function renderActions(m){if(m.role!=='assistant'||m.status!=='done'||!String(m.content||'').trim())return'';const id=esc(m.id);return`<div class="msg-actions"><button class="ghost sm" onclick="copyChatReply('${id}',this,this.parentElement.querySelector('.msg-action-status'))">${TXT.copy}</button><button class="ghost sm" onclick="replyToChatMessage('${id}',this.parentElement.querySelector('.msg-action-status'))">${TXT.reply}</button><button class="ghost sm" onclick="exportChatReplyPdf('${id}',this,this.parentElement.querySelector('.msg-action-status'))">${TXT.exportPdf}</button><span class="msg-action-status"></span></div>`}function renderMessages(scroll=true){if(!S.messages.length){showEmptyChat(true);return}showEmptyChat(false);msgBox.innerHTML='';S.messages.forEach(m=>renderMsg(m,false));if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
function closeSSE(){if(S.sse){S.sse.close();S.sse=null}}function subscribeSSE(sid,am){const es=new EventSource(api('/api/chat/events',{session:sid}));S.sse=es;es.addEventListener('update',e=>{const d=JSON.parse(e.data);if(d.messageId!==am.id)return;if(d.tool_calls)am.tool_calls=d.tool_calls;if(d.tool_results)am.tool_results=d.tool_results;renderMsg(am,false)});es.addEventListener('done',e=>{const d=JSON.parse(e.data);if(d.messageId!==am.id)return;am.content=d.content||'';am.status='done';renderMsg(am,true);closeSSE();loadSessions()});es.onerror=()=>{closeSSE();setTimeout(()=>refreshCurrentMessages(false),1200)}}async function send(){const raw=input.value.trim();if(!raw&&!S.attachments.length)return;await ensureToolCatalog();const text=S.quote?`${TXT.quotePrefix}:\n${S.quote}\n\n${TXT.questionPrefix}:${raw}`:raw;const attachments=S.attachments.splice(0);input.value='';imageInput.value='';renderAttachmentPreview();clearQuote();const clientId='local_'+Date.now();const um={_clientId:clientId,role:'user',content:raw,attachments,status:'done',created_at:Date.now()/1000};const am={id:'pending_'+Date.now(),_clientId:'assistant_'+clientId,role:'assistant',content:'',status:'pending',created_at:Date.now()/1000,tool_calls:[],tool_results:[]};S.messages.push(um,am);renderMsg(um,true);renderMsg(am,true);const title=raw||attachments[0]?.name||TXT.newChat;ensureLocalSession(title.slice(0,40)+(title.length>40?'...':''));renderSessions();try{const r=await fetch('/api/chat/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:CHAT_PROVIDER,sessionId:S.sessionId,message:text,attachments,enabledToolMasks:toolSelectionMasks(S.enabledTools)})});const j=await r.json();if(!r.ok)throw new Error(j.error||TXT.sendFail);if(j.userMessage?.id){um.id=j.userMessage.id;um.content=j.userMessage.content||um.content;um.attachments=j.userMessage.attachments||um.attachments;um.created_at=j.userMessage.created_at||um.created_at;renderMsg(um,false)}am.id=j.message.id;am.content=j.message.content||am.content;am.status=j.message.status||am.status;S.sessionId=j.sessionId;rememberSession(j.sessionId);renderMsg(am,false);loadSessions();if(am.status==='pending')subscribeSSE(j.sessionId,am)}catch(e){am.content=e.message||TXT.sendFail;am.status='error';renderMsg(am,false);loadSessions()}}
function findChatMessage(messageId){return S.messages.find(m=>String(m.id||m._clientId||'')===String(messageId))}function fallbackCopyText(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error(TXT.copyFail)}async function copyChatReply(messageId,button,statusEl){const original=button.textContent;const text=String(findChatMessage(messageId)?.content||'').trim();if(!text)return;button.disabled=true;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else fallbackCopyText(text);statusEl.textContent=TXT.copied;statusEl.className='msg-action-status ok'}catch(e){statusEl.textContent=e.message||TXT.copyFail;statusEl.className='msg-action-status err'}finally{button.disabled=false;button.textContent=original}}function replyToChatMessage(messageId,statusEl){const text=String(findChatMessage(messageId)?.content||'').trim();if(!text)return;setQuote(text);statusEl.textContent=TXT.replyReady;statusEl.className='msg-action-status ok';input.focus()}async function exportChatReplyPdf(messageId,button,statusEl){const original=button.textContent;button.disabled=true;button.textContent=TXT.generating;try{const r=await fetch('/api/chat/export-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:CHAT_PROVIDER,sessionId:S.sessionId,messageId})});if(!r.ok){let p={};try{p=await r.json()}catch(e){}throw new Error(p.error||TXT.pdfFail)}const blob=await r.blob();const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=`chat-reply-${Date.now()}.pdf`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(href);statusEl.textContent=TXT.downloaded;statusEl.className='msg-action-status ok'}catch(e){statusEl.textContent=e.message||TXT.pdfFail;statusEl.className='msg-action-status err'}finally{button.disabled=false;button.textContent=original}}
function currentAssistantSelection(){const sel=window.getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return null;const text=sel.toString().replace(/\s+/g,' ').trim();if(text.length<2)return null;let node=sel.getRangeAt(0).commonAncestorContainer;if(node.nodeType===3)node=node.parentElement;const bubble=node?.closest?.('.msg.assistant .bubble');if(!bubble||!msgBox.contains(bubble))return null;return{text,rect:sel.getRangeAt(0).getBoundingClientRect()}}function showQuoteToolbar(){setTimeout(()=>{const picked=currentAssistantSelection();if(!picked){quoteToolbar.classList.remove('show');return}S.selectionText=picked.text.slice(0,2000);quoteToolbar.style.left=Math.min(innerWidth-130,Math.max(8,picked.rect.left))+'px';quoteToolbar.style.top=Math.max(8,picked.rect.top-42)+'px';quoteToolbar.classList.add('show')},0)}function setQuote(text){S.quote=String(text||'').trim().slice(0,2000);if(!S.quote){clearQuote();return}quotePreviewText.textContent=S.quote;quotePreview.classList.add('show')}function clearQuote(){S.quote=null;quotePreviewText.textContent='';quotePreview.classList.remove('show')}function fileToAttachment(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return resolve(null);if(file.size>6*1024*1024)return reject(new Error(TXT.imageTooLarge));const reader=new FileReader();reader.onload=()=>resolve({name:file.name||'image',type:file.type,size:file.size,dataUrl:reader.result});reader.onerror=()=>reject(new Error(TXT.imageReadFail));reader.readAsDataURL(file)})}async function addImageFiles(files){const items=[];for(const file of Array.from(files||[])){const item=await fileToAttachment(file);if(item)items.push(item)}S.attachments.push(...items);S.attachments.splice(6);renderAttachmentPreview()}function renderAttachmentPreview(){attachmentPreview.innerHTML='';S.attachments.forEach((a,i)=>{const chip=document.createElement('div');chip.className='attachment-chip';chip.innerHTML=`<img src="${esc(a.dataUrl)}" alt=""><button type="button">x</button>`;chip.querySelector('button').onclick=()=>{S.attachments.splice(i,1);renderAttachmentPreview()};attachmentPreview.appendChild(chip)})}
function selectedSet(){return new Set(S.enabledTools||[])}function renderToolTree(){const catalog=S.toolCatalog;if(!catalog)return;const selected=selectedSet(),locked=lockedDomainIds(catalog);let html='';(catalog.domains||[]).filter(domain=>!domain.hidden&&!locked.has(domain.id)).forEach(domain=>{html+=`<div class="tree-node" data-node="domain" data-id="${esc(domain.id)}"><div class="tree-row domain"><button class="tree-toggle" type="button" aria-label="toggle"></button><input class="tree-check" type="checkbox" data-check-domain="${esc(domain.id)}"><span>${esc(domain.label)}</span></div><div class="tree-children tree-indent">`; (domain.categories||[]).forEach(cat=>{const catId=`${domain.id}/${cat.id}`;html+=`<div class="tree-node" data-node="category" data-id="${esc(catId)}"><div class="tree-row category"><button class="tree-toggle" type="button" aria-label="toggle"></button><input class="tree-check" type="checkbox" data-check-category="${esc(catId)}"><span>${esc(cat.label)}</span></div><div class="tree-children tree-indent">`; (cat.tools||[]).forEach(t=>{const checked=selected.has(t.id);html+=`<label class="tool-row"><input type="checkbox" class="tree-check tool-check" value="${esc(t.id)}" data-domain="${esc(domain.id)}" data-category="${esc(catId)}" ${checked?'checked':''} ${t.disabled?'disabled':''}><div><div class="tool-label">${esc(t.label||t.name)}</div><div class="tool-id">${esc(t.id)}</div><div class="tool-desc">${esc(String(t.description||'').slice(0,140))}</div></div></label>`});html+='</div></div>'});html+='</div></div>'});$("toolModalBody").innerHTML=html;bindTree();updateTreeState()}function bindTree(){document.querySelectorAll('.tree-toggle').forEach(btn=>btn.onclick=()=>btn.closest('.tree-node').classList.toggle('collapsed'));document.querySelectorAll('[data-check-domain]').forEach(cb=>cb.onchange=()=>{document.querySelectorAll(`.tool-check[data-domain="${CSS.escape(cb.dataset.checkDomain)}"]`).forEach(t=>{if(!t.disabled)t.checked=cb.checked});updateTreeState()});document.querySelectorAll('[data-check-category]').forEach(cb=>cb.onchange=()=>{document.querySelectorAll(`.tool-check[data-category="${CSS.escape(cb.dataset.checkCategory)}"]`).forEach(t=>{if(!t.disabled)t.checked=cb.checked});updateTreeState()});document.querySelectorAll('.tool-check').forEach(cb=>cb.onchange=updateTreeState)}function checkboxState(parent,children){const usable=[...children].filter(x=>!x.disabled);const checked=usable.filter(x=>x.checked).length;parent.checked=usable.length>0&&checked===usable.length;parent.indeterminate=checked>0&&checked<usable.length}function updateTreeState(){document.querySelectorAll('[data-check-category]').forEach(cb=>checkboxState(cb,document.querySelectorAll(`.tool-check[data-category="${CSS.escape(cb.dataset.checkCategory)}"]`)));document.querySelectorAll('[data-check-domain]').forEach(cb=>checkboxState(cb,document.querySelectorAll(`.tool-check[data-domain="${CSS.escape(cb.dataset.checkDomain)}"]`)))}async function openModal(){await ensureToolCatalog();renderToolTree();$("toolModal").classList.add('show')}function closeModal(){$("toolModal").classList.remove('show')}$("toolSelectAll").onclick=()=>{document.querySelectorAll('.tool-check').forEach(c=>{if(!c.disabled)c.checked=true});updateTreeState()};$("toolDeselectAll").onclick=()=>{document.querySelectorAll('.tool-check').forEach(c=>{if(!c.disabled)c.checked=false});updateTreeState()};$("toolSave").onclick=()=>{S.enabledTools=withHiddenDefaults([...document.querySelectorAll('.tool-check:checked')].map(c=>c.value));saveSelection(S.enabledTools);closeModal()};$("toolBtn").onclick=openModal;$("imageBtn").onclick=()=>imageInput.click();imageInput.onchange=e=>addImageFiles(e.target.files).catch(err=>alert(err.message));input.addEventListener("paste",e=>{const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));if(files.length){e.preventDefault();addImageFiles(files).catch(err=>alert(err.message))}});$("toolModal").onclick=e=>{if(e.target===$("toolModal"))closeModal()};
async function deleteSession(id){if(!confirm(TXT.deleteConfirm))return;const deleting=S.sessionId===id;await fetch(api(`/api/chat/sessions/${encodeURIComponent(id)}/delete`));await loadSessions();if(deleting){closeSSE();resetPaging();if(S.sessions.length){S.sessionId=S.sessions[0].id;rememberSession(S.sessionId);await loadMessages()}else{S.sessionId=Date.now().toString();rememberSession(S.sessionId);showEmptyChat(true)}}renderSessions()}function pendingTooLong(){const now=Date.now()/1000;return S.messages.some(m=>m?.role==='assistant'&&m.status==='pending'&&now-Number(m.created_at||now)>12)}$("newSession").onclick=()=>{S.sessionId=Date.now().toString();rememberSession(S.sessionId);clearMessages(true);renderSessions();closeSSE()};$("quoteAskBtn").onclick=()=>{if(S.selectionText)setQuote(S.selectionText);quoteToolbar.classList.remove('show');window.getSelection()?.removeAllRanges();input.focus()};$("clearQuote").onclick=clearQuote;msgBox.addEventListener('mouseup',showQuoteToolbar);msgBox.addEventListener('keyup',showQuoteToolbar);document.addEventListener('mousedown',e=>{if(!quoteToolbar.contains(e.target))quoteToolbar.classList.remove('show')});initChat();setInterval(()=>{if(pendingTooLong())refreshCurrentMessages(false)},5000);addEventListener('focus',()=>{if(pendingTooLong())refreshCurrentMessages(false)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pendingTooLong())refreshCurrentMessages(false)});
