<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 聊天</title>
<style>
:root{
  --bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;--brand:#2563eb;--brand2:#1d4ed8;
  --brand-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;
  --red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid transparent;border-radius:var(--radius-sm);padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s ease;white-space:nowrap}
button.primary{background:var(--brand);color:#fff}button.primary:hover{background:var(--brand2)}
button.primary:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}button.secondary:hover{background:var(--brand-soft);border-color:var(--brand)}button.ghost{background:transparent;color:var(--text2)}button.ghost:hover{background:var(--border2)}button.sm{min-height:28px;padding:3px 8px;font-size:11px;border-radius:6px}button.danger{color:var(--red)}button.danger:hover{background:var(--red-soft)}
input,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:9px 12px;font-size:13px;outline:none;transition:.15s ease}input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}textarea{resize:none;font:13px/1.5 system-ui,sans-serif}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}header h1{font-size:18px;font-weight:700}.header-actions{display:flex;align-items:center;gap:10px}.credit-pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:5px 11px;color:var(--text2);font-size:12px;font-weight:700}.credit-pill strong{color:var(--text);font-size:13px}.credit-pill.warn{border-color:#fed7aa;background:#fff7ed;color:#c2410c}.credit-pill.ok{border-color:#bbf7d0;background:#f0fdf4;color:#047857}
.nav-links{display:flex;gap:6px;align-items:center}.nav-links a{text-decoration:none;font-size:13px;font-weight:600;color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);transition:.15s ease;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px}.nav-links a:hover{background:var(--border2);color:var(--text)}.nav-links a.active{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.chat-shell{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 60px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.session-list{overflow-y:auto}
.session-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;transition:.1s ease}.session-item:hover{background:var(--border2)}.session-item.active{background:var(--brand-soft);border-left:3px solid var(--brand);padding-left:13px}
.session-item .info{min-width:0;flex:1}.session-item .title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item .meta{font-size:11px;color:var(--text3);margin-top:2px}.session-item .del-btn{display:none;color:var(--text3);min-height:auto;padding:4px 6px;font-size:14px}.session-item:hover .del-btn{display:inline-flex}
.chat-main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.messages{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;max-width:80%}.msg.user{align-self:flex-end;align-items:flex-end}.msg.assistant{align-self:flex-start}
.msg .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.6;font-size:14px;word-break:break-word}.msg .time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.msg.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.assistant .bubble h1,.msg.assistant .bubble h2,.msg.assistant .bubble h3{margin:4px 0 10px;font-size:16px;line-height:1.4}
.msg.assistant .bubble h1{font-size:18px}.msg.assistant .bubble h2{font-size:17px}
.msg.assistant .bubble p{margin:8px 0}.msg.assistant .bubble hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.msg.assistant .bubble a{color:var(--brand);font-weight:600;text-decoration:none;word-break:break-all}.msg.assistant .bubble a:hover{text-decoration:underline}
.msg.assistant .bubble code{background:var(--border2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px}
.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:8px 0;padding-left:22px}
.msg.assistant .bubble li{margin:3px 0}
.md-table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:8px;background:#fff}
.md-table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.md-table th,.md-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.md-table th:last-child,.md-table td:last-child{border-right:0}.md-table tr:last-child td{border-bottom:0}
.md-table th{background:var(--border2);font-weight:800;color:var(--text)}
.msg .time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.tool-log{margin:4px 0}.tool-log summary{cursor:pointer;color:var(--text2);font-size:12px;font-weight:700;margin:4px 0 6px}.tool-card{margin:4px 0;background:var(--border2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px}.tool-card .tool-name{font-weight:700;color:var(--brand);margin-bottom:4px}.tool-card .tool-status{font-size:11px}.tool-card .tool-status.ok{color:var(--green)}.tool-card .tool-status.err{color:var(--red)}.cache-tag{display:inline-flex;align-items:center;margin-left:6px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;background:#fff;color:var(--text2);font-size:10px;font-weight:700}.cache-tag.hit{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.cache-tag.live{border-color:#bbf7d0;background:#f0fdf4;color:#047857}
.input-bar{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);align-items:flex-end}
.composer{flex:1;display:flex;flex-direction:column;gap:6px}
.input-bar textarea{width:100%;min-height:42px;max-height:120px;padding:10px 14px;border-radius:20px}
.quote-preview{display:none;border:1px solid var(--border);border-left:3px solid var(--brand);background:var(--border2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text2)}
.quote-preview.show{display:block}.quote-preview .quote-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;color:var(--text);font-weight:700}.quote-preview .quote-text{max-height:72px;overflow:auto;white-space:pre-wrap;line-height:1.45}
.quote-toolbar{position:fixed;z-index:60;display:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 30px rgba(15,23,42,.16);border-radius:10px;padding:5px}
.quote-toolbar.show{display:flex}
.load-more{text-align:center;padding:8px;color:var(--text3);font-size:12px;cursor:pointer}.load-more:hover{color:var(--brand)}
.empty-chat{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:15px;text-align:center;flex-direction:column;gap:8px}.empty-chat b{color:var(--text);font-size:20px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:none;align-items:center;justify-content:center}.modal-overlay.show{display:flex}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.15);width:600px;max-width:92vw;max-height:80vh;display:grid;grid-template-rows:auto 1fr auto}
.modal-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-body .cat-label{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.3px;margin-bottom:-8px;display:flex;align-items:center;gap:6px}.cat-check{width:auto;accent-color:var(--brand)}.cat-group{padding-left:4px}
.modal-body .tool-row{display:flex;align-items:flex-start;gap:8px;font-size:12px}
.modal-body .tool-row input{width:auto;margin-top:2px;accent-color:var(--brand);flex-shrink:0}
.modal-body .tool-row .tool-desc{color:var(--text2);font-size:11px;margin-top:1px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
@media(max-width:800px){.chat-shell{grid-template-columns:1fr}.sidebar{display:none}.sidebar.mobile-show{display:grid;position:fixed;inset:60px 0 0 0;z-index:30}}
</style>
</head>
<body>
<header><h1>AI 聊天助手</h1><div class="header-actions"><div id="sociavaultCredits" class="credit-pill" title="SociaVault API 剩余额度">SociaVault <strong>未同步</strong></div><nav class="nav-links"><a href="/" class="active" title="AI 聊天">🏠</a><a href="/amazon" title="Amazon">📦</a><a href="/shop" title="Shop">🛍️</a><a href="/metrics" title="数据">🎵</a><a href="/extract" title="视频分析">🎬</a></nav></div></header>
<div class="chat-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><button class="primary" style="width:100%" id="newSession">+ 新建对话</button></div>
    <div class="session-list" id="sessionList"></div>
  </aside>
  <main class="chat-main">
    <div class="messages" id="messages"><div class="empty-chat" id="emptyChat"><b>👋 AI 短视频分析助手</b><span>选择一个工具或直接输入问题</span></div></div>
    <div class="input-bar">
      <div class="composer">
        <div class="quote-preview" id="quotePreview">
          <div class="quote-head"><span>引用内容</span><button class="ghost sm" id="clearQuote" title="取消引用">×</button></div>
          <div class="quote-text" id="quotePreviewText"></div>
        </div>
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      </div>
      <button id="toolBtn" class="secondary sm" title="工具选择">🎯</button>
      <button id="sendBtn" class="primary" onclick="send()">发送</button>
    </div>
  </main>
</div>
<div class="quote-toolbar" id="quoteToolbar"><button class="secondary sm" id="quoteAskBtn">引用提问</button></div>
<div class="modal-overlay" id="toolModal">
  <div class="modal-box">
    <div class="modal-head"><span>🔧 工具选择</span><button class="ghost sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="toolModalBody"></div>
    <div class="modal-foot">
      <button class="secondary sm" id="toolSelectAll">全选</button>
      <button class="secondary sm" id="toolDeselectAll">全不选</button>
      <button class="primary" id="toolSave">保存</button>
    </div>
  </div>
</div>
<script>
const S={sessionId:"default",sessions:[],messages:[],enabledTools:null,nextBefore:null,hasMore:false,loading:false,sse:null,quote:null,selectionText:""};
const $=id=>document.getElementById(id),msgBox=$("messages"),input=$("input"),emptyChat=$("emptyChat");
const quoteToolbar=$("quoteToolbar"),quotePreview=$("quotePreview"),quotePreviewText=$("quotePreviewText");
const SESSION_KEY="videoAnalyzer.chat.sessionId";

function formatTime(ts){if(!ts)return"未同步";return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
async function loadSociaVaultCredits(){try{const r=await fetch("/api/sociavault-usage");const d=await r.json();const el=$("sociavaultCredits");const v=d.remaining_credits;if(v===null||v===undefined){el.className="credit-pill warn";const label=d.observed?"未返回余额":"未同步";el.innerHTML=`SociaVault <strong>${label}</strong>`;const body=d.body_credit_fields&&Object.keys(d.body_credit_fields).length?`；响应体字段：${JSON.stringify(d.body_credit_fields)}`:"";el.title=d.observed?`已收到 SociaVault 响应，但没有可识别的剩余额度 header，更新时间：${formatTime(d.updated_at)}${body}`:"还没有收到 SociaVault API 响应";return}el.className="credit-pill "+(Number(v)>0?"ok":"warn");el.innerHTML=`SociaVault <strong>${esc(v)} credits</strong>`;el.title=`SociaVault API 剩余额度，更新时间：${formatTime(d.updated_at)}`}catch(e){}}
async function loadSessions(){const r=await fetch("/api/chat/sessions");S.sessions=await r.json();renderSessions()}
function renderSessions(){const list=$("sessionList");list.innerHTML="";S.sessions.forEach(s=>{const el=document.createElement("div");el.className="session-item"+(s.id===S.sessionId?" active":"");el.innerHTML=`<div class="info"><div class="title">${esc(s.title||"新对话")}</div><div class="meta">${s.message_count||0} 条消息</div></div><button class="ghost del-btn" title="删除">🗑</button>`;el.onclick=e=>{if(e.target.closest("button"))return;switchSession(s.id)};el.querySelector(".del-btn").onclick=e=>{e.stopPropagation();deleteSession(s.id)};list.appendChild(el)})}
function rememberSession(id){try{localStorage.setItem(SESSION_KEY,id)}catch(e){}}
function showEmptyChat(show){if(show&&!emptyChat.parentNode)msgBox.appendChild(emptyChat);emptyChat.style.display=show?"flex":"none"}
function clearMessages(showEmpty=false){S.messages=[];S.nextBefore=null;S.hasMore=false;msgBox.innerHTML="";showEmptyChat(showEmpty)}
function ensureLocalSession(title){
  const existing=S.sessions.find(s=>s.id===S.sessionId);
  if(existing){
    existing.title=existing.title||title;
    existing.message_count=Math.max(Number(existing.message_count||0),S.messages.length);
    return;
  }
  S.sessions.unshift({id:S.sessionId,title:title||"新对话",message_count:S.messages.length,updated_at:Date.now()/1000});
}
async function initChat(){await loadSessions();const saved=(()=>{try{return localStorage.getItem(SESSION_KEY)||""}catch(e){return""}})();const ids=new Set(S.sessions.map(s=>s.id));if(saved&&ids.has(saved))S.sessionId=saved;else if(!ids.has(S.sessionId)&&S.sessions.length)S.sessionId=S.sessions[0].id;renderSessions();if(ids.has(S.sessionId))await loadMessages();else showEmptyChat(true)}
async function switchSession(id){S.sessionId=id;rememberSession(id);clearMessages(false);await loadMessages();renderSessions();closeSSE()}
function renderMessages(scroll=true){if(!S.messages.length){showEmptyChat(true);return}showEmptyChat(false);const top=msgBox.scrollTop;msgBox.innerHTML="";S.messages.forEach(m=>renderMsg(m,false));if(scroll)msgBox.scrollTop=msgBox.scrollHeight;else msgBox.scrollTop=top}
function pruneRenderedMessages(){const keys=new Set();S.messages.forEach(m=>{if(m.id)keys.add(String(m.id));if(m._clientId)keys.add(String(m._clientId))});msgBox.querySelectorAll(".msg").forEach(el=>{const id=el.dataset.msgId||"";const cid=el.dataset.clientMsgId||"";if((id||cid)&&!keys.has(id)&&!keys.has(cid))el.remove()})}
function cacheTag(result){const c=result&&result.cache;if(!c)return"";return `<span class="cache-tag ${c.hit?'hit':'live'}">${c.hit?'缓存命中':'实时调用'}</span>`}
function closeSSE(){if(S.sse){S.sse.close();S.sse=null}}
function hideQuoteToolbar(){quoteToolbar.classList.remove("show")}
function currentAssistantSelection(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return null;
  const text=sel.toString().replace(/\s+/g," ").trim();
  if(text.length<2)return null;
  const range=sel.getRangeAt(0);
  let node=range.commonAncestorContainer;
  if(node.nodeType===3)node=node.parentElement;
  const bubble=node&&node.closest?node.closest(".msg.assistant .bubble"):null;
  if(!bubble||!msgBox.contains(bubble))return null;
  return {text,rect:range.getBoundingClientRect()};
}
function showQuoteToolbar(){
  setTimeout(()=>{
    const picked=currentAssistantSelection();
    if(!picked){hideQuoteToolbar();return}
    S.selectionText=picked.text.slice(0,2000);
    const left=Math.min(window.innerWidth-130,Math.max(8,picked.rect.left));
    const top=Math.max(8,picked.rect.top-42);
    quoteToolbar.style.left=left+"px";
    quoteToolbar.style.top=top+"px";
    quoteToolbar.classList.add("show");
  },0);
}
function setQuote(text){
  S.quote=String(text||"").trim().slice(0,2000);
  if(!S.quote){clearQuote();return}
  quotePreviewText.textContent=S.quote;
  quotePreview.classList.add("show");
}
function clearQuote(){
  S.quote=null;
  quotePreviewText.textContent="";
  quotePreview.classList.remove("show");
}
function toolArgs(t){try{const raw=t&&t.function&&t.function.arguments;if(!raw)return{};return typeof raw==="string"?JSON.parse(raw):(raw||{})}catch(e){return{}}}
function firstArg(args,names){for(const n of names){const v=args&&args[n];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim()}return""}
function shortValue(v){v=String(v||"").trim();if(!v)return"";if(v.length>80)v=v.slice(0,77)+"...";return v}
function toolDisplayName(name,args,running=false){
  const keyword=shortValue(firstArg(args,["keyword","query","q","search_query","term"]));
  const url=shortValue(firstArg(args,["url","video_url","product_url","shop_url","canonical_url"]));
  const id=shortValue(firstArg(args,["product_id","video_id","music_id","user_id","sec_uid","asin","shop_id"]));
  const target=keyword||id||url;
  const doing=running?"正在":"";
  const map={
    tiktok_shop_search: target?`${doing}对 ${target} 进行 TikTok Shop 产品检索`:"TikTok Shop 产品检索",
    tiktok_shop_product: target?`${doing}获取 TikTok Shop 商品详情：${target}`:"TikTok Shop 商品详情获取",
    tiktok_shop_details: target?`${doing}获取 TikTok Shop 商品详情：${target}`:"TikTok Shop 商品详情获取",
    tiktok_shop_reviews: target?`${doing}获取 TikTok Shop 商品评论：${target}`:"TikTok Shop 商品评论获取",
    tiktok_search_keyword: target?`${doing}检索 TikTok 关键词：${target}`:"TikTok 关键词检索",
    tiktok_search_users: target?`${doing}搜索 TikTok 用户：${target}`:"TikTok 用户搜索",
    tiktok_search_hashtag: target?`${doing}检索 TikTok 话题：${target}`:"TikTok 话题检索",
    tiktok_search_music: target?`${doing}检索 TikTok 音乐：${target}`:"TikTok 音乐检索",
    tiktok_search_top: target?`${doing}查询 TikTok 热门内容：${target}`:"TikTok 热门内容查询",
    tiktok_transcript: target?`${doing}获取 TikTok 视频文本：${target}`:"TikTok 视频文本获取",
    video_download: target?`${doing}下载视频：${target}`:"视频下载",
    amazon_search_keyword: target?`${doing}对 ${target} 进行 Amazon 商品检索`:"Amazon 商品检索",
    amazon_scrape_asin: target?`${doing}抓取 Amazon ASIN：${target}`:"Amazon ASIN 抓取",
  };
  return map[name]||`${doing}${name}${target?`：${target}`:""}`;
}
function renderToolCards(m){const calls=m.tool_calls||[];if(!calls.length)return"";const results=m.tool_results||[];const cards=calls.map(function(t,i){const name=(t&&t.function&&t.function.name)||"tool";const args=toolArgs(t);const r=results[i];const title=toolDisplayName(name,args,!r);let status;if(r){const ok=!!(r.result&&r.result.ok);const resultName=toolDisplayName(r.tool_name||name,args,false);status=`<div class="tool-status ${ok?'ok':'err'}">${ok?'✓':'✗'} ${esc(resultName)}: ${ok?'成功':'失败'}${cacheTag(r.result)}</div>`}else{status='<div class="tool-status">执行中...</div>'}return `<div class="tool-card"><div class="tool-name">🔧 ${esc(title)}</div>${status}</div>`}).join("");const done=m.status==="done"&&String(m.content||"").trim();return done?`<details class="tool-log"><summary>工具调用记录 (${calls.length})</summary>${cards}</details>`:`<div class="tool-log">${cards}</div>`}
function pendingTooLong(){const now=Date.now()/1000;return S.messages.some(m=>m&&m.role==="assistant"&&m.status==="pending"&&now-Number(m.created_at||m._startedAt||now)>12)}
function subscribeSSE(sid,am){
  const es=new EventSource(`/api/chat/events?session=${encodeURIComponent(sid)}`);
  S.sse=es;
  es.addEventListener("update",e=>{
    const d=JSON.parse(e.data);
    if(d.messageId!==am.id)return;
    if(d.tool_calls)am.tool_calls=d.tool_calls;
    if(d.tool_results)am.tool_results=d.tool_results;
    renderMsg(am,false);
    pruneRenderedMessages();
    loadSociaVaultCredits();
  });
  es.addEventListener("done",e=>{
    const d=JSON.parse(e.data);
    if(d.messageId!==am.id)return;
    am.content=d.content;
    am.status="done";
    renderMsg(am,false);
    pruneRenderedMessages();
    closeSSE();
    loadSessions();
    loadSociaVaultCredits();
  });
  es.onerror=()=>{
    closeSSE();
    if(am.status==="pending"){
      am.content="服务器中断，稍后再试";
      am.status="error";
      renderMsg(am,false);
      pruneRenderedMessages();
    }
    loadSessions();
  };
}
function renderMsg(m,scroll=true){var id=String(m.id||"");var clientId=String(m._clientId||id);var div=null;if(id)div=msgBox.querySelector(`[data-msg-id="${CSS.escape(id)}"]`);if(!div&&clientId)div=msgBox.querySelector(`[data-client-msg-id="${CSS.escape(clientId)}"]`);if(!div){div=document.createElement("div");msgBox.appendChild(div)}if(id)div.dataset.msgId=id;if(clientId)div.dataset.clientMsgId=clientId;div.className="msg "+m.role;var body="";if(m.role==="user"){body='<div class="bubble">'+esc(m.content)+'</div>'}else if(m.role==="assistant"){var c=m.content||"";if(m.status==="pending")c="思考中...";else c=md(c);body=renderToolCards(m)+'<div class="bubble">'+c+'</div>'}var ts='';if(m.created_at){var d=new Date(m.created_at*1000);ts='<div class="time">'+d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+'</div>'}body+=ts;div.innerHTML=body;if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
async function send(){
  const rawText=input.value.trim();
  if(!rawText||S.loading)return;
  const quoteText=S.quote?String(S.quote).trim():"";
  const text=quoteText?`引用内容：\n> ${quoteText.replace(/\n/g,"\n> ")}\n\n我的问题：${rawText}`:rawText;
  input.value="";
  clearQuote();
  closeSSE();
  if(!S.messages.length)showEmptyChat(false);
  const started=Date.now()/1000;
  const userCid="user-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
  const um={id:userCid,_clientId:userCid,role:"user",content:text,status:"done",created_at:started};
  S.messages.push(um);
  ensureLocalSession(rawText.slice(0,40)+(rawText.length>40?"...":""));
  renderMsg(um);
  renderSessions();
  const cid="pending-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
  const am={id:cid,_clientId:cid,role:"assistant",content:"思考中...",status:"pending",created_at:started,_startedAt:started};
  S.messages.push(am);
  renderMsg(am);
  pruneRenderedMessages();
  try{
    const r=await fetch("/api/chat/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:S.sessionId,message:text})});
    let j={};
    try{j=await r.json()}catch(e){}
    if(!r.ok){
      am.content=j.error||"请求失败";
      am.status="error";
      ensureLocalSession(rawText.slice(0,40)+(rawText.length>40?"...":""));
      renderMsg(am,false);
      pruneRenderedMessages();
      return;
    }
    if(j.userMessage&&j.userMessage.id){
      um.id=j.userMessage.id;
      um.created_at=j.userMessage.created_at||um.created_at;
      renderMsg(um,false);
    }
    am.id=j.message.id;
    S.sessionId=j.sessionId;
    rememberSession(j.sessionId);
    ensureLocalSession(rawText.slice(0,40)+(rawText.length>40?"...":""));
    renderMsg(am,false);
    pruneRenderedMessages();
    loadSessions();
    subscribeSSE(j.sessionId,am);
  }catch(e){
    am.content="服务器中断，稍后再试";
    am.status="error";
    renderMsg(am,false);
    pruneRenderedMessages();
    loadSessions();
  }
}
async function openModal(){var r=await fetch("/api/chat/tools");var cats=await r.json();var html="";cats.forEach(function(c){var allChecked=true;c.tools.forEach(function(t){if(S.enabledTools!==null&&!S.enabledTools.includes(t.name))allChecked=false});html+='<label class="cat-label" style="cursor:pointer"><input type="checkbox" class="cat-check" '+(allChecked?'checked':'')+' onchange="var v=this.checked;var g=this.parentElement.nextElementSibling;if(g)g.querySelectorAll(\'input[type=checkbox]\').forEach(function(cb){cb.checked=v})"> '+esc(c.category)+'</label>';html+='<div class="cat-group">';c.tools.forEach(function(t){var checked=S.enabledTools===null||S.enabledTools.includes(t.name);html+='<label class="tool-row"><input type="checkbox" value="'+esc(t.name)+'" '+(checked?'checked':'')+' onchange="var g=this.closest(\'.cat-group\');if(g){var catCheck=g.previousElementSibling.querySelector(\'.cat-check\');if(catCheck)catCheck.checked=g.querySelectorAll(\'input[type=checkbox]:checked\').length===g.querySelectorAll(\'input[type=checkbox]\').length}"><div><div>'+esc(t.name)+'</div><div class="tool-desc">'+esc(t.description.substring(0,80))+'</div></div></label>'});html+='</div>'});$("toolModalBody").innerHTML=html;$("toolModal").classList.add("show")}
function closeModal(){$("toolModal").classList.remove("show")}
$("toolSelectAll").onclick=function(){document.querySelectorAll("#toolModalBody input[type=checkbox]").forEach(function(c){c.checked=true})};$("toolDeselectAll").onclick=function(){document.querySelectorAll("#toolModalBody input[type=checkbox]").forEach(function(c){c.checked=false})}
$("toolSave").onclick=async()=>{const checks=document.querySelectorAll("#toolModalBody input[type=checkbox]");const all=Array.from(checks).filter(c=>c.checked).map(c=>c.value);if(all.length===checks.length)S.enabledTools=null;else S.enabledTools=all;await fetch("/api/chat/tool-config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:S.enabledTools})});closeModal()}
$("toolBtn").onclick=openModal;
$("toolModal").onclick=e=>{if(e.target===$("toolModal"))closeModal()}
msgBox.addEventListener("mouseup",showQuoteToolbar);
msgBox.addEventListener("keyup",showQuoteToolbar);
$("quoteAskBtn").onclick=()=>{if(S.selectionText)setQuote(S.selectionText);hideQuoteToolbar();window.getSelection()?.removeAllRanges();input.focus()};
$("clearQuote").onclick=clearQuote;
document.addEventListener("mousedown",e=>{if(!quoteToolbar.contains(e.target))hideQuoteToolbar()});
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function inlineMd(v){let s=esc(v);s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(_,text,url){const safe=esc(url);return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${text}</a>`});s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');s=s.replace(/(^|[^\*])\*([^\*]+)\*/g,'$1<i>$2</i>');return s}
function splitTableRow(line){let t=String(line||"").trim();if(t.startsWith("|"))t=t.slice(1);if(t.endsWith("|"))t=t.slice(0,-1);return t.split("|").map(c=>c.trim())}
function isTableSeparator(line){const cells=splitTableRow(line);return cells.length>1&&cells.every(c=>/^:?-{3,}:?$/.test(c))}
function renderTable(lines,start){const headers=splitTableRow(lines[start]);let i=start+2;const rows=[];while(i<lines.length&&lines[i].includes("|")&&String(lines[i]).trim()){rows.push(splitTableRow(lines[i]));i++}let html='<div class="md-table-wrap"><table class="md-table"><thead><tr>'+headers.map(h=>'<th>'+inlineMd(h)+'</th>').join("")+'</tr></thead><tbody>';rows.forEach(r=>{html+='<tr>'+headers.map((_,idx)=>'<td>'+inlineMd(r[idx]||"")+'</td>').join("")+'</tr>'});html+='</tbody></table></div>';return {html,next:i}}
function md(v){const lines=String(v||"").replace(/\r\n/g,"\n").split("\n");let out=[],i=0;while(i<lines.length){let line=lines[i],trim=line.trim();if(!trim){i++;continue}if(i+1<lines.length&&line.includes("|")&&isTableSeparator(lines[i+1])){const t=renderTable(lines,i);out.push(t.html);i=t.next;continue}let m=trim.match(/^(#{1,3})\s+(.+)$/);if(m){out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`);i++;continue}if(/^---+$/.test(trim)){out.push("<hr>");i++;continue}if(/^[-*]\s+/.test(trim)){let items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^[-*]\s+/,""))+"</li>");i++}out.push("<ul>"+items.join("")+"</ul>");continue}if(/^\d+[.)]\s+/.test(trim)){let items=[];while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^\d+[.)]\s+/,""))+"</li>");i++}out.push("<ol>"+items.join("")+"</ol>");continue}let para=[trim];i++;while(i<lines.length&&lines[i].trim()&&!lines[i].match(/^(#{1,3})\s+/)&&!(i+1<lines.length&&lines[i].includes("|")&&isTableSeparator(lines[i+1]))&&!/^[-*]\s+/.test(lines[i].trim())&&!/^\d+[.)]\s+/.test(lines[i].trim())){para.push(lines[i].trim());i++}out.push("<p>"+inlineMd(para.join("<br>"))+"</p>")}return out.join("")}
function resetPaging(){S.messages=[];S.nextBefore=null;S.hasMore=false;msgBox.innerHTML=""}
function addLoadMoreButton(){document.getElementById("loadMore")?.remove();if(!S.hasMore)return;const btn=document.createElement("div");btn.className="load-more";btn.id="loadMore";btn.textContent="加载更多...";btn.onclick=loadMessages;msgBox.insertBefore(btn,msgBox.firstChild)}
function mergeUniqueMessages(prefix,current){const seen=new Set();const merged=[];[...(prefix||[]),...(current||[])].forEach(m=>{const key=String(m.id||"");if(key&&seen.has(key))return;if(key)seen.add(key);merged.push(m)});return merged}
async function loadMessages(){if(S.loading)return;S.loading=true;const loadingOlder=!!(S.messages.length&&S.nextBefore);const oldHeight=msgBox.scrollHeight;try{const params=new URLSearchParams({max_bytes:"120000"});if(loadingOlder)params.set("before",S.nextBefore);const r=await fetch(`/api/chat/sessions/${encodeURIComponent(S.sessionId)}/messages?${params.toString()}`);const d=await r.json();if(d.messages){const incoming=d.messages||[];if(loadingOlder){S.messages=mergeUniqueMessages(incoming,S.messages)}else{S.messages=incoming}S.nextBefore=d.next_before||null;S.hasMore=!!d.has_more;renderMessages(!loadingOlder);if(loadingOlder)msgBox.scrollTop=msgBox.scrollHeight-oldHeight;addLoadMoreButton()}}finally{S.loading=false}}
async function refreshCurrentMessages(scroll=false){if(S.loading)return;S.loading=true;try{const r=await fetch(`/api/chat/sessions/${encodeURIComponent(S.sessionId)}/messages?max_bytes=120000`);const d=await r.json();if(d.messages){const latest=d.messages||[];const firstLatest=latest.length?Number(latest[0].created_at||0):0;const latestIds=new Set(latest.map(m=>String(m.id||"")));const older=S.messages.filter(m=>Number(m.created_at||0)<firstLatest&&!latestIds.has(String(m.id||"")));S.messages=mergeUniqueMessages(older,latest);if(!older.length){S.nextBefore=d.next_before||null;S.hasMore=!!d.has_more}renderMessages(scroll);renderSessions();pruneRenderedMessages();addLoadMoreButton()}}finally{S.loading=false}}
async function deleteSession(id){if(!confirm("删除此对话？"))return;const deletingCurrent=S.sessionId===id;await fetch("/api/chat/sessions/"+encodeURIComponent(id)+"/delete");await loadSessions();if(deletingCurrent){closeSSE();resetPaging();if(S.sessions.length){S.sessionId=S.sessions[0].id;rememberSession(S.sessionId);await loadMessages()}else{S.sessionId=Date.now().toString();rememberSession(S.sessionId);showEmptyChat(true)}}renderSessions()}
$("newSession").onclick=()=>{S.sessionId=Date.now().toString();rememberSession(S.sessionId);resetPaging();showEmptyChat(true);renderSessions();closeSSE()};
initChat();loadSociaVaultCredits();setInterval(loadSociaVaultCredits,60000);setInterval(()=>{if(pendingTooLong())refreshCurrentMessages(false)},5000);addEventListener("focus",()=>{if(pendingTooLong())refreshCurrentMessages(false)});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pendingTooLong())refreshCurrentMessages(false)});
