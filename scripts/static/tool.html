<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片标签工具</title>
<style>
@layer legacy {
:root{--bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--border2:#f1f5f9;--brand:#2563eb;--brand2:#1d4ed8;--brand-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);--radius:14px;--radius-sm:9px}*{box-sizing:border-box;margin:0}body{min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}header{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;background:rgba(255,255,255,.84);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}header h1{font-size:18px;letter-spacing:-.3px}.page{max-width:1040px;margin:0 auto;padding:28px 24px 40px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.eyebrow{color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.intro h2{margin-top:4px;font-size:27px;letter-spacing:-.7px}.intro p{margin-top:6px;color:var(--text2)}.flow{display:flex;gap:8px;color:var(--text3);font-size:12px;white-space:nowrap}.flow span{display:inline-flex;align-items:center;gap:6px}.flow b{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand)}.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px}.upload-pane{padding:18px;border-right:1px solid var(--border)}.settings{padding:18px;background:linear-gradient(180deg,#fbfdff,#f7faff);display:flex;flex-direction:column;gap:16px}.dropzone{display:grid;place-items:center;min-height:222px;border:1.5px dashed #93c5fd;border-radius:12px;background:linear-gradient(135deg,#f8fbff,#eff6ff);cursor:pointer;transition:.16s ease;text-align:center;padding:24px}.dropzone:hover,.dropzone.drag{border-color:var(--brand);background:#eaf3ff;transform:translateY(-1px)}.drop-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#fff;color:var(--brand);box-shadow:0 4px 12px rgba(37,99,235,.12);margin-bottom:10px}.dropzone strong{font-size:15px}.dropzone small{display:block;margin-top:5px;color:var(--text2)}.filebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 10px}.filebar b{font-size:13px}.muted{color:var(--text2);font-size:12px}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;min-height:98px}.empty{display:grid;place-items:center;min-height:98px;border:1px dashed var(--border);border-radius:10px;color:var(--text3);font-size:12px}.file{position:relative;min-width:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}.file img{display:block;width:100%;aspect-ratio:1.35;object-fit:cover;background:var(--border2)}.file-name{display:block;padding:7px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.remove{position:absolute;top:5px;right:5px;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;cursor:pointer;opacity:0;transition:.15s}.file:hover .remove,.remove:focus-visible{opacity:1}.settings h3{font-size:14px}.settings label{display:grid;gap:6px;color:var(--text2);font-size:12px;font-weight:700}.settings input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;padding:10px 11px;color:var(--text);outline:none}.settings input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.11)}.hint{border-left:3px solid #93c5fd;padding:9px 10px;background:#f8fbff;color:var(--text2);font-size:12px}.primary,.secondary{min-height:40px;border-radius:var(--radius-sm);padding:9px 13px;font-weight:700;cursor:pointer;transition:.15s}.primary{border:1px solid var(--brand);background:var(--brand);color:#fff;box-shadow:0 5px 12px rgba(37,99,235,.2)}.primary:hover:not(:disabled){background:var(--brand2);transform:translateY(-1px)}.primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.secondary{border:1px solid var(--border);background:#fff;color:var(--text2)}.secondary:hover{border-color:#bfdbfe;background:var(--brand-soft);color:var(--brand)}.status{min-height:50px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;background:#fff;color:var(--text2);font-size:12px}.status.ok{border-color:#a7f3d0;background:var(--green-soft);color:var(--green)}.status.bad{border-color:#fecaca;background:var(--red-soft);color:var(--red)}.foot{margin-top:14px;color:var(--text3);font-size:12px;text-align:center}@media(max-width:840px){header{padding:0 16px}.page{padding:22px 16px}.intro{align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr}.upload-pane{border-right:0;border-bottom:1px solid var(--border)}.settings{background:#fff}.flow{white-space:normal;flex-wrap:wrap}}@media(max-width:540px){header h1{display:none}.page{padding:16px 12px}.intro h2{font-size:23px}.dropzone{min-height:180px}.file-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
}
</style>
</head>
<body>
<div class="ui-app">
<!-- UI_APP_NAV -->
<div class="ui-frame">
<header class="ui-header">
  <div class="ui-page-heading"><span class="ui-page-heading__icon" aria-hidden="true"></span><span class="ui-page-heading__copy"><strong>图片工具</strong><small>图片标签、预览与批量处理</small></span></div>
</header>
<div class="ui-main">
<main class="page">
  <section class="intro"><div><div class="eyebrow">IMAGE DELIVERY</div><h2>批量处理，标签随文件交付</h2><p>上传图片即可统一交付 JPG；已满足条件的 JPG 原样下载。</p></div><div class="flow"><span><b>1</b>选择图片</span><span>→</span><span><b>2</b>确认标签</span><span>→</span><span><b>3</b>下载 ZIP</span></div></section>
  <section class="card workspace">
    <div class="upload-pane">
      <input id="files" type="file" accept="image/*" multiple hidden>
      <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="选择图片">
        <div><div class="drop-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg></div><strong>拖入图片，或点击选择</strong><small>可处理的图片会统一输出为 JPG；单批最多 100 张</small></div>
      </div>
      <div class="filebar"><b id="fileCount">待处理图片</b><button id="clear" class="secondary" type="button" hidden>清空</button></div>
      <div id="fileGrid" class="file-grid"><div class="empty">尚未选择图片</div></div>
    </div>
    <aside class="settings">
      <div><h3>转换设置</h3><p class="muted ui-subtle-gap">JPG 质量固定为 95，透明区域使用白底。</p></div>
      <label>写入标签<input id="tag" maxlength="200" value="contains-synthetic-performer" autocomplete="off"></label>
      <label>压缩包名称<input id="archiveName" maxlength="120" autocomplete="off" aria-describedby="archiveNameHint"></label>
      <p id="archiveNameHint" class="muted">默认使用当前时间戳，自动补全 .zip。</p>
      <div class="hint">标签将写入最终 JPG 的 <code>XMP dc:subject</code> 字段。已满足当前标签的 JPG 会原样放入 ZIP。</div>
      <button id="convert" class="primary" type="button" disabled>转换并下载 ZIP</button>
      <div id="status" class="status" role="status">选择图片后即可开始。</div>
    </aside>
  </section>
  <p class="foot">无效图片会被跳过，下载包内会附上失败清单。</p>
</main>
</div>
</div>
</div>
<script>
// Multi-file FormData and Blob download flow adapted from Sanskargupta0/Remove-bg (MIT notice in upstream README, a46c06c).
const input=document.querySelector('#files'),dropzone=document.querySelector('#dropzone'),grid=document.querySelector('#fileGrid'),count=document.querySelector('#fileCount'),clearBtn=document.querySelector('#clear'),convertBtn=document.querySelector('#convert'),tagInput=document.querySelector('#tag'),archiveInput=document.querySelector('#archiveName'),statusBox=document.querySelector('#status');
let selected=[];
function setStatus(text,kind=''){statusBox.className='status '+kind;statusBox.textContent=text}
function key(file){return `${file.name}:${file.size}:${file.lastModified}`}
function bytes(size){return size<1024*1024?`${Math.ceil(size/1024)} KB`:`${(size/1024/1024).toFixed(1)} MB`}
function timestampName(){const now=new Date(),pad=value=>String(value).padStart(2,'0');return `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`}
function downloadName(response){const header=response.headers.get('Content-Disposition')||'',match=header.match(/filename\*=UTF-8''([^;]+)/i);if(match){try{return decodeURIComponent(match[1])}catch(_){}}return `${archiveInput.value.trim()||timestampName()}`.replace(/\.zip$/i,'')+'.zip'}
function refresh(){const total=selected.reduce((sum,file)=>sum+file.size,0);count.textContent=selected.length?`已选 ${selected.length} 张 · ${bytes(total)}`:'待处理图片';clearBtn.hidden=!selected.length;convertBtn.disabled=!selected.length||!tagInput.value.trim();grid.innerHTML='';if(!selected.length){grid.innerHTML='<div class="empty">尚未选择图片</div>';return}selected.forEach((file,index)=>{const item=document.createElement('article');item.className='file';const image=document.createElement('img');const url=URL.createObjectURL(file);image.src=url;image.alt=file.name;image.onload=image.onerror=()=>URL.revokeObjectURL(url);const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.setAttribute('aria-label',`移除 ${file.name}`);remove.textContent='×';remove.onclick=()=>{selected.splice(index,1);refresh()};const name=document.createElement('span');name.className='file-name';name.title=`${file.name} · ${bytes(file.size)}`;name.textContent=file.name;item.append(image,remove,name);grid.append(item)})}
function addFiles(files){const incoming=Array.from(files||[]),known=new Set(selected.map(key));let ignored=0;for(const file of incoming){if(selected.length>=100){ignored++;continue}if(!known.has(key(file))){selected.push(file);known.add(key(file))}}refresh();if(ignored)setStatus(`已加入 ${selected.length} 个文件；忽略 ${ignored} 个重复或超出上限的文件。无法识别的文件会列入 ZIP 失败清单。`,'bad')}
dropzone.onclick=()=>input.click();dropzone.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();input.click()}};input.onchange=()=>{addFiles(input.files);input.value=''};['dragenter','dragover'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.add('drag')}));['dragleave','drop'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.remove('drag')}));dropzone.addEventListener('drop',event=>addFiles(event.dataTransfer.files));clearBtn.onclick=()=>{selected=[];refresh();setStatus('已清空待处理图片。')};tagInput.oninput=refresh;
convertBtn.onclick=async()=>{const tag=tagInput.value.trim();if(!selected.length||!tag)return;convertBtn.disabled=true;setStatus(`正在处理 ${selected.length} 张图片…`);const form=new FormData();selected.forEach(file=>form.append('images',file));form.append('tag',tag);form.append('archive_name',archiveInput.value.trim());try{const response=await fetch('/api/tool/convert',{method:'POST',body:form});if(!response.ok){const payload=await response.json().catch(()=>({}));throw new Error(payload.error||'处理失败')}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=downloadName(response);document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);const converted=Number(response.headers.get('X-Tool-Converted')||0),tagged=Number(response.headers.get('X-Tool-Tagged')||0),reused=Number(response.headers.get('X-Tool-Reused')||0),failed=Number(response.headers.get('X-Tool-Failed')||0);const details=[converted?`转换 ${converted} 张`:'',tagged?`补标 ${tagged} 张`:'',reused?`已满足 ${reused} 张`:''].filter(Boolean).join('，');setStatus(`处理完成：${details||'成功'}${failed?`；跳过 ${failed} 张（详情见 ZIP 内失败清单）`:''}。`,'ok');selected=[];refresh()}catch(error){setStatus(error.message||'处理失败，请稍后重试。','bad')}finally{convertBtn.disabled=!selected.length||!tagInput.value.trim()}};
archiveInput.value=timestampName();
refresh();
</script>
</body>
</html>
