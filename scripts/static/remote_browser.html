<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程浏览器</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#f8fafc;color:#1e293b;font:14px system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid #e2e8f0}h1{font-size:18px;margin:0}p{margin:0;color:#64748b}.actions{display:flex;gap:8px;margin-left:auto}button,a.action{font:inherit;color:#334155;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:7px 12px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}main{flex:1;min-height:0}iframe{display:block;width:100%;height:100%;border:0}@media(max-width:700px){header{padding:10px;gap:10px}.actions{margin-left:0}p{font-size:12px}}
</style>
</head>
<body>
<header><h1>远程浏览器</h1><p>Hysteria2 固定线路 · 登录状态自动保留</p><div class="actions"><button id="reconnect" type="button">重新连接</button><a class="action" id="standalone" target="_blank" rel="noopener">独立窗口</a></div></header>
<nav class="app-nav"></nav>
<main><iframe id="browser" title="服务器上的独立浏览器" allow="clipboard-read; clipboard-write; fullscreen"></iframe></main>
<script>
const channel = '__REMOTE_BROWSER_CHANNEL__';
const frame = document.getElementById('browser');
frame.src = channel;
document.getElementById('standalone').href = channel;
document.getElementById('reconnect').onclick = () => { frame.src = channel; };
</script>
</body>
</html>
