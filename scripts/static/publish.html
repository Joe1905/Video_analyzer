<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>发布 · Buffer</title>
<link rel="stylesheet" href="/assets/buffer-publish.css?v=__UI_ASSET_VERSION__">
</head>
<body>
<header class="top"><nav class="app-nav" aria-label="主导航"></nav></header>
<main>
  <div class="page-heading"><div><p class="eyebrow">PUBLISH / BUFFER</p><h1>视频发布</h1></div><button id="connect" class="quiet"><span id="connectionDot" class="dot"></span><span id="connectionLabel">连接设置</span><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></div>
  <div class="workspace">
    <section class="composer" aria-labelledby="composeTitle">
      <div class="section-title"><h2 id="composeTitle">新建发布</h2><span class="tiny">TikTok</span></div>
      <form id="compose">
        <label class="upload" id="uploadBox" for="videoFile"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><strong id="fileName">选择视频</strong><span id="fileMeta">MP4 · 3 秒–10 分钟 · 最大 1 GB</span><input id="videoFile" type="file" accept="video/mp4,.mp4"></label>
        <progress id="uploadProgress" max="100" value="0" hidden aria-label="上传进度"></progress>
        <label for="caption">发布文案 <span id="count">0 / 2200</span></label><textarea id="caption" maxlength="2200" rows="5" placeholder="写下这条视频的文案和标签…" required></textarea>
        <label for="channel">发布频道 <button type="button" id="reloadChannels" class="text-button">刷新</button></label><select id="channel" required><option value="">请先连接 Buffer</option></select>
        <div class="mode" role="group" aria-label="发布方式"><button type="button" data-mode="now">立即发布</button><button type="button" data-mode="schedule" class="selected">定时发布</button><button type="button" data-mode="draft">Buffer 草稿</button></div>
        <div id="scheduleField"><label for="publishTime"><strong id="publishTimeLabel">发布时间（洛杉矶时间）</strong><span id="timezone"></span></label><input id="publishTime" type="datetime-local" aria-describedby="beijingTime serverTime"><p class="time-note" id="beijingTime" aria-live="polite">北京时间：选择发布时间后显示</p><p class="time-note" id="serverTime"></p></div>
        <label class="check"><input id="aiGenerated" type="checkbox">声明包含 AI 生成内容</label>
        <p id="composeError" class="error" role="alert"></p><button type="submit" id="submit" class="primary" disabled>创建定时任务 <svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
      </form>
    </section>
    <section class="task-panel" aria-labelledby="jobsTitle"><div class="section-title"><h2 id="jobsTitle">发布记录 <span id="jobCount">0</span></h2><button id="refreshJobs" class="quiet small"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></svg>刷新</button></div><div class="filters" role="group" aria-label="筛选任务"><button class="active" data-filter="all">全部</button><button data-filter="active">待发布</button><button data-filter="sent">已发布</button><button data-filter="failed">需处理</button></div><div id="jobs" aria-live="polite"><div class="empty">加载发布记录…</div></div><div id="listError" class="error" role="alert"></div></section>
  </div>
</main>
<dialog id="settings" aria-labelledby="settingsTitle"><form id="settingsForm"><div class="dialog-heading"><h2 id="settingsTitle">连接 Buffer</h2><button type="button" class="icon-button" id="closeSettings" aria-label="关闭">×</button></div><p class="muted">在 Buffer 连接 TikTok 账号，再填写个人 API Key。</p><label for="bufferKey">个人 API Key</label><input id="bufferKey" type="password" autocomplete="new-password" placeholder="仅保存到服务器" required><div class="storage-line"><span class="dot" id="storageDot"></span><div><strong>Ubuntu 视频存储</strong><small id="storageState">检查中</small></div></div><a href="https://publish.buffer.com/settings/api" target="_blank" rel="noopener noreferrer">打开 Buffer API 设置 ↗</a><p class="error" id="settingsError" role="alert"></p><button class="primary" id="saveKey">保存连接</button></form></dialog>
<dialog id="report" aria-labelledby="reportTitle"><div class="dialog-heading"><div><p class="eyebrow">TASK REPORT</p><h2 id="reportTitle">任务日志</h2></div><button class="icon-button" id="closeReport" aria-label="关闭">×</button></div><div id="reportBody"></div></dialog>
<script src="/assets/buffer-publish.js?v=__UI_ASSET_VERSION__"></script>
</body></html>
