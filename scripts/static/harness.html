<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness 安全访问</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; font: 16px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    main { width: min(560px, calc(100% - 40px)); padding: 32px; box-sizing: border-box; background: #fff; border: 1px solid #e3e8f2; border-radius: 16px; box-shadow: 0 18px 48px rgb(20 36 64 / 10%); }
    h1 { margin: 0 0 8px; font-size: 24px; } p { margin: 10px 0; color: #536176; } .muted { font-size: 14px; color: #6b778b; }
    #setup { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e8edf5; } ol { padding-left: 22px; } a, button { border-radius: 8px; font: inherit; font-weight: 600; } a.primary, button { display: inline-block; padding: 10px 15px; border: 1px solid #2463eb; background: #2463eb; color: #fff; text-decoration: none; cursor: pointer; } button.secondary { margin-left: 8px; border-color: #cbd5e1; background: #fff; color: #263449; }
  </style>
</head>
<body>
  <main>
    <h1>正在打开 DeepSeek Harness</h1>
    <p id="status">正在检查此设备是否已信任内网证书…</p>
    <section id="setup">
      <p>未能建立安全连接。请先安装一次内网根证书，然后重试。</p>
      <a class="primary" href="/harness-ca.crt" download>下载根证书</a>
      <ol>
        <li>双击下载的 <code>harness-internal-ca.crt</code>。</li>
        <li>选择“安装证书” → “当前用户”。</li>
        <li>选择“将所有的证书都放入下列存储” → “受信任的根证书颁发机构”。</li>
        <li>完成安装后，点击“重新检测”。</li>
      </ol>
      <p class="muted">若仍失败，请确认设备在 192.168.0.0/23 局域网内。</p>
      <button class="secondary" type="button" id="retry">重新检测</button>
    </section>
  </main>
  <script>
    const harnessUrl = "https://192.168.1.254:4005/";
    const status = document.querySelector("#status");
    const setup = document.querySelector("#setup");
    async function openHarness() {
      setup.style.display = "none";
      status.textContent = "正在检查此设备是否已信任内网证书…";
      try {
        await fetch(`${harnessUrl}favicon.svg?probe=${Date.now()}`, { mode: "no-cors", cache: "no-store" });
        window.location.replace(harnessUrl);
      } catch (_) {
        status.textContent = "此设备尚未信任内网证书，或无法连接到 Harness。";
        setup.style.display = "block";
      }
    }
    document.querySelector("#retry").addEventListener("click", openHarness);
    openHarness();
  </script>
</body>
</html>
