  <script>

    const cancelDrawerClosing=()=>{drawerLifecycleVersion++;if(drawerCloseTimer){clearTimeout(drawerCloseTimer);drawerCloseTimer=0}const overlay=el('overlay'),drawer=el('drawer'),wasClosing=drawer.classList.contains('is-closing');overlay.classList.remove('is-closing');drawer.classList.remove('is-closing');if(wasClosing){drawer.style.removeProperty('--panel-transform');drawer.style.removeProperty('--panel-opacity')}return wasClosing};

result ? escapePoolText(result.text || '') : ''}</p></div>`;

        event.stopPropagation();
        void openPoolDetail(detail.dataset.proxyPoolDetail).catch(err => openLeftDrawer({
          root: 'proxyPoolDetail', title: 'IP 出口详情', desc: '该出口信息暂时无法读取。',
          body: `<p class="pool-detail-empty">${escapePoolText(err?.message || '请稍后重试。')}</p>`, foot: ''
        }));
      }, true);
      document.addEventListener('click', event => {
        const create = event.target.closest('[data-proxy-pool-create]');
        if (create) { event.preventDefault(); openPoolCreate(); return; }
        const copy = event.target.closest('[data-proxy-pool-copy]');
        if (copy) { event.preventDefault(); copyUri(copy.dataset.proxyPoolCopy); return; }
        const edit = event.target.closest('[data-proxy-pool-edit]');
        if (edit) { event.preventDefault(); openPoolEditor(edit.dataset.proxyPoolEdit); return; }
        const check = event.target.closest('[data-proxy-pool-check]');
        if (check) { event.preventDefault(); checkPool(check.dataset.proxyPoolCheck); return; }
        const toggle = event.target.closest('[data-proxy-pool-toggle]');
        if (toggle) { event.preventDefault(); togglePool(toggle.dataset.proxyPoolToggle); return; }
        const remove = event.target.closest('[data-proxy-pool-delete]');
        if (remove) { event.preventDefault(); deletePool(remove.dataset.proxyPoolDelete); return; }
      });
      document.addEventListener('submit', async event => {
        const form = event.target.closest('[data-proxy-pool-form], [data-proxy-pool-edit-form]');
        if (!form) return;
        event.preventDefault();
        const error = form.querySelector('[data-proxy-pool-error]');
        const submit = form.querySelector('[type="submit"]') || document.querySelector(`[form="${form.id}"]`);
        if (error) error.textContent = '';
        if (submit) submit.disabled = true;
        try {
          const payload = Object.fromEntries(new FormData(form).entries());
          const response = await fetch('/api/proxy/pools', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '保存失败');
          window.dispatchEvent(new Event('proxy:refresh'));
          if (form.matches('[data-proxy-pool-edit-form]')) openPoolDetail(result.pool?.id || payload.id, { kind: 'success', text: '出口配置已保存。' });
          else closeDrawer();
        } catch (err) {
          if (error) error.textContent = err?.message || '保存失败，请检查 IP 与连接 URI。';
          if (submit) submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
