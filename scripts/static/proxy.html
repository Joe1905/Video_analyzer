<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号 IP 池</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--line:#e2e8f0;--line2:#f1f5f9;--text:#0f172a;--muted:#64748b;--brand:#2563eb;--brand2:#1d4ed8;--ok:#059669;--bad:#dc2626;--warn:#d97706;--soft:#eff6ff;--shadow:0 1px 2px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;line-height:1.5;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.primary:hover{background:var(--brand2)}button.danger{border-color:#fecaca;color:var(--bad)}button.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}button.ghost{border-color:transparent;background:transparent;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;font-size:13px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}input[readonly]{background:#f8fafc;color:#475569}textarea{min-height:96px;resize:vertical;font:12px/1.55 ui-monospace,Consolas,monospace}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}header h1{font-size:18px}main{height:calc(100vh - 60px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:14px}.runtime{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;box-shadow:var(--shadow);min-width:0}.tile span{display:block;color:var(--muted);font-size:12px;font-weight:700}.tile b{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile.ok b{color:var(--ok)}.tile.bad b{color:var(--bad)}.work{display:grid;grid-template-columns:310px 400px minmax(0,1fr);gap:12px;min-height:0}.panel{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:0;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--line2)}.head h2{font-size:14px}.body{padding:12px;overflow:auto}.stack{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool-row{display:flex;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}.icon-btn{width:36px;height:36px;min-height:36px;padding:0;display:inline-grid;place-items:center;border-radius:8px}.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pool-list{align-content:start}.pool{height:92px;display:grid;grid-template-rows:22px 22px 22px;gap:5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}.pool:hover{border-color:#bfdbfe;box-shadow:0 2px 8px rgba(15,23,42,.06)}.pool.active{border-color:var(--brand);background:var(--soft)}.pool-line{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.pool-main,.pool-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pool-sub{color:var(--muted);font-size:12px}.empty-state{height:100%;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:#f8fafc;padding:20px}.empty-state b{display:block;color:var(--text);margin-bottom:6px}.muted{color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--muted)}.badge.ok{background:#ecfdf5;color:var(--ok)}.badge.bad{background:#fef2f2;color:var(--bad)}.badge.warn{background:#fffbeb;color:var(--warn)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fff;color:var(--muted);font-size:12px;z-index:1}tr.selected{background:var(--soft)}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--line2);padding:8px 10px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.status.ok{background:#ecfdf5;color:var(--ok);border-color:#a7f3d0}.status.bad{background:#fef2f2;color:var(--bad);border-color:#fecaca}pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,Consolas,monospace;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px;max-height:220px;overflow:auto}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.42);z-index:20;padding:22px}.modal.open{display:flex}.dialog{width:min(620px,96vw);max-height:92vh;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 18px 48px rgba(15,23,42,.2);overflow:hidden}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--line2)}.dialog-body{padding:14px;overflow:auto}.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--brand);transition:width .25s}.link-btn{display:none;align-items:center;min-height:34px;border-radius:8px;padding:7px 12px;text-decoration:none;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--brand)}.link-btn.show{display:inline-flex}@media(max-width:1100px){body{overflow:auto}.runtime{grid-template-columns:1fr 1fr}.work{grid-template-columns:1fr;height:auto}.panel{min-height:360px}main{height:auto}}
</style>
</head>
<body>
<header><h1>账号 IP 池</h1><nav class="app-nav" aria-label="主导航"></nav></header>
<main>
  <section class="runtime" id="runtime"></section>
  <section class="work">
    <aside class="panel"><div class="head"><h2>代理/IP池</h2><button class="primary" onclick="newPool()">新增代理</button></div><div class="body"><div class="tool-row"><button class="icon-btn" onclick="loadAll()" title="刷新代理和账号列表" aria-label="刷新代理和账号列表"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.2 6.5"/><path d="M3 12A9 9 0 0 1 18.2 5.5"/><path d="M18 3v4h-4"/><path d="M6 21v-4h4"/></svg></button><button class="icon-btn" onclick="exportMihomo()" title="导出 mihomo 配置片段" aria-label="导出 mihomo 配置片段"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/><path d="M5 17v4"/><path d="M19 17v4"/></svg></button></div><div id="poolList" class="stack pool-list"></div></div></aside>
    <aside class="panel"><div class="head"><h2 id="editorTitle">代理详情</h2><button class="ghost" onclick="clearEditor()">清空</button></div><div class="body stack"><div id="editor"></div><div id="status" class="status">等待操作。</div><pre id="detail">{}</pre></div></aside>
    <section class="panel"><div class="head"><h2>账号管理</h2><div class="row"><input id="search" placeholder="搜索账号/昵称" oninput="renderAccounts()" style="width:180px"><select id="filterStatus" onchange="renderAccounts()" style="width:120px"><option value="">全部状态</option><option value="休眠中">休眠中</option><option value="唤醒中">唤醒中</option><option value="采集中">采集中</option><option value="IP不可用">IP不可用</option></select><button class="primary" onclick="newAccount()">新增账号</button></div></div><div class="body"><table><thead><tr><th>账号</th><th>绑定代理</th><th>状态</th><th>最近校验</th><th>操作</th></tr></thead><tbody id="accountRows"></tbody></table></div></section>
  </section>
</main>
<div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-label="新增账号登录观测">
  <div class="dialog">
    <div class="dialog-head"><h2>新增账号</h2><button class="ghost" onclick="closeLoginModal()">关闭</button></div>
    <div class="dialog-body stack">
      <label>选择未绑定代理<select id="loginProxySelect" onchange="syncLoginButton()"></select></label>
      <div class="progress" aria-label="登录准备进度"><i id="loginProgress"></i></div>
      <div id="loginHint" class="status">请选择代理后点击登录。</div>
      <div class="actions"><button id="loginStartBtn" class="primary" onclick="startLoginObservation()">登录</button><a id="loginOpenLink" class="link-btn" href="#" target="_blank" rel="noopener">打开 noVNC 观测入口</a><button id="loginCancelBtn" class="danger" style="display:none" onclick="cancelPendingLogin()">取消并释放</button></div>
    </div>
  </div>
</div>

<script>
const state={pools:[],accounts:[],sessions:[],selectedPool:0,selectedAccount:0,editing:"",portRange:"18900-18999",novncUrl:"http://192.168.1.254:6080",loginSession:null,loginPollTimer:0,browserMaxSlots:2,pendingLoginTtlMinutes:15,browserLocale:"en-US"};
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setStatus(msg,kind=""){const box=$("status");box.className="status "+kind;box.textContent=msg}
function apiError(e){return e instanceof TypeError?"请求失败：当前页面没有连上服务器开发版，请确认 4003 开发版已重启并包含 /api/proxy 接口。":(e.message||"请求失败")}
async function api(path,body){const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};let r;try{r=await fetch(path,opt)}catch(e){throw new Error(apiError(e))}let p={};try{p=await r.json()}catch(_e){}if(!r.ok)throw new Error(p.error||`HTTP ${r.status}`);return p}
function poolName(id){const p=state.pools.find(x=>x.id===Number(id));return p?p.name:"未绑定"}
function badge(text,kind=""){return `<span class="badge ${kind}">${esc(text||"-")}</span>`}
function statusKind(v){return v==="已绑定"||v==="启用"||v==="可用"||v==="通过"||v==="唤醒中"||v==="采集中"?"ok":(v==="IP不可用"||v==="不可用"||v==="禁用"||v==="异常"||v==="阻断"?"bad":"warn")}
function poolDisplayStatus(p){if(p.status==="不可用"||p.status==="异常")return "不可用";if(p.status==="禁用")return "禁用";return Number(p.account_count||0)>0?"已绑定":"未绑定"}
function accountLine(p){const names=(p.account_names||[]).filter(Boolean);return `<div class="pool-line pool-sub"><span>${names.length?`绑定账号：${esc(names.map(x=>`@${x}`).join("、"))}`:"&nbsp;"}</span></div>`}
function activeSessionForAccount(id){return state.sessions.find(s=>Number(s.account_id)===Number(id)&&["starting","running","observing"].includes(s.status))}
function accountRuntimeStatus(a){const p=state.pools.find(x=>x.id===Number(a.proxy_profile_id));if(!p||p.status==="禁用"||p.status==="不可用"||p.status==="异常")return "IP不可用";if(a.last_check_status==="阻断"||a.last_check_status==="blocked")return "IP不可用";if(p.expected_exit_ip&&a.last_checked_ip&&a.last_checked_ip!==p.expected_exit_ip)return "IP不可用";if(a.status==="异常")return "IP不可用";const s=activeSessionForAccount(a.id);if(s&&s.status==="running")return "采集中";if(s)return "唤醒中";return "休眠中"}
function nextPoolName(){return `代理${state.pools.length+1}`}
async function loadAll(silent=false){const p=await api("/api/proxy/pools");state.pools=p.pools||[];state.accounts=p.accounts||[];state.sessions=p.sessions||[];renderPools();renderAccounts();if(!silent)setStatus("已刷新。","ok")}
async function loadRuntime(){try{const r=await api("/api/proxy/runtime");const c=r.checks||{};state.portRange=r.port_range||state.portRange;state.novncUrl=r.novnc_url||state.novncUrl;state.browserMaxSlots=(r.novnc_ports||{}).max_slots||state.browserMaxSlots;state.pendingLoginTtlMinutes=Math.max(1,Math.round(Number(r.pending_login_ttl_seconds||900)/60));state.browserLocale=r.browser_locale||state.browserLocale;$("runtime").innerHTML=[tile("noVNC",`${(r.novnc_ports||{}).allowed_range||r.novnc_local_port} · 按账号登录创建`,c.novnc_local?"ok":"bad"),tile("VNC 端口",c.vnc_local?`监听 ${r.vnc_port}`:`未监听 ${r.vnc_port}`,c.vnc_local?"ok":"bad"),tile("mihomo 代理",c.mihomo_proxy_local?`监听 ${r.mihomo_proxy_port}`:`未监听 ${r.mihomo_proxy_port}`,c.mihomo_proxy_local?"ok":"bad"),tile("mihomo 控制端",c.mihomo_api_local?`可用 ${r.mihomo_version||""}`:(r.mihomo_error||"不可用"),c.mihomo_api_local?"ok":"bad"),tile("浏览器环境",`${state.browserLocale} · 临时通道 ${state.pendingLoginTtlMinutes} 分钟`,"ok"),`<div class="tile"><span>账号观测通道</span><b>未选择账号/代理时不打开</b><div class="muted">点击“新增账号”选择代理并登录后，系统才会创建 6081/6082 独立 noVNC。</div></div>`].join("")}catch(e){$("runtime").innerHTML=tile("运行态",apiError(e),"bad")}}
function tile(k,v,cls){return `<div class="tile ${cls||""}"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}
function renderPools(){const box=$("poolList");box.innerHTML=state.pools.map(p=>`<div class="pool ${p.id===state.selectedPool?"active":""}" onclick="selectPool(${p.id})" title="查看代理详情"><div class="pool-line"><b class="pool-main">${esc(p.name)} · ${esc(p.local_port||"待分配")}</b>${badge(poolDisplayStatus(p),statusKind(poolDisplayStatus(p)))}</div>${accountLine(p)}<div class="pool-line pool-sub"><span>${esc(p.expected_exit_ip||"未绑定 IP")} · ${esc(p.detected_address||p.region||"未检测地区")}</span><span>${esc(p.account_count||0)} 账号</span></div></div>`).join("")||'<div class="empty-state"><div><b>暂无代理</b><span>点击“新增代理”导入 VLESS。</span></div></div>'}
function renderAccounts(){const q=$("search").value.trim().toLowerCase(),fs=$("filterStatus").value;let rows=state.accounts.filter(a=>(!state.selectedPool||a.proxy_profile_id===state.selectedPool)&&(!fs||accountRuntimeStatus(a)===fs)&&(!q||a.username.toLowerCase().includes(q)||(a.display_name||"").toLowerCase().includes(q)));$("accountRows").innerHTML=rows.map(a=>{const rs=accountRuntimeStatus(a),s=activeSessionForAccount(a.id);const runtimeButtons=s?`<button onclick="openAccountSession(${a.id})">打开观测</button><button class="danger" onclick="sleepAccount(${a.id})">休眠</button>`:`<button class="primary" onclick="wakeAccount(${a.id})">唤醒</button>`;return `<tr class="${a.id===state.selectedAccount?"selected":""}"><td><b>@${esc(a.username)}</b><div class="muted">${esc(a.display_name||"")}</div></td><td>${esc(poolName(a.proxy_profile_id))}</td><td>${badge(rs,statusKind(rs))}</td><td>${badge(a.last_check_status||"未校验",statusKind(a.last_check_status))}<div class="muted">${esc(a.last_checked_ip||"")} ${esc(a.last_check_at||"")}</div>${a.last_error?`<div class="muted">${esc(a.last_error)}</div>`:""}</td><td><div class="actions">${runtimeButtons}<button onclick="editAccount(${a.id})">详情</button><button onclick="preflight(${a.id})">登录前自动校验</button><button class="danger" onclick="deleteAccount(${a.id})">删除</button></div></td></tr>`}).join("")||'<tr><td colspan="5" class="muted">暂无账号。</td></tr>'}
function selectPool(id){if(state.selectedPool===id){state.selectedPool=0;state.selectedAccount=0;renderPools();renderAccounts();clearEditor();return}state.selectedPool=id;state.selectedAccount=0;renderPools();renderAccounts();const p=state.pools.find(x=>x.id===id);if(p){state.editing="pool";$("editorTitle").textContent="代理详情";$("detail").textContent=JSON.stringify(p,null,2);renderPoolForm(p)}}
function emptyEditor(){return '<div class="empty-state"><div><b>未选择代理</b><span>从左侧代理列表选择一项查看详情，或点击新增代理。</span></div></div>'}
function clearEditor(){state.editing="";state.selectedAccount=0;$("editorTitle").textContent="代理详情";$("editor").innerHTML=emptyEditor();$("detail").textContent="{}";renderAccounts()}
function newPool(){state.selectedPool=0;state.editing="pool";$("editorTitle").textContent="新增代理";$("detail").textContent="{}";renderPoolForm({name:nextPoolName(),status:"启用",source_type:"vless",local_port:"保存后自动分配"})}
function renderPoolForm(p){const disabled=p.status==="禁用";$("editor").innerHTML=`<div class="stack"><label>名称<input id="pName" value="${esc(p.name||nextPoolName())}"></label><label>VLESS URI<textarea id="pUri" placeholder="vless://...">${esc(p.source_uri||"")}</textarea></label><div class="split"><label>专用本地端口<input readonly value="${esc(p.local_port||"保存后自动分配")}"></label><label>当前状态<input readonly value="${esc(poolDisplayStatus(p))}"></label></div><div class="split"><label>绑定出口 IP<input readonly value="${esc(p.expected_exit_ip||"校验后绑定")}"></label><label>代理地区<input readonly value="${esc(p.detected_address||p.region||"校验后显示")}"></label></div><label>备注<input id="pNotes" value="${esc(p.notes||"")}" placeholder="可选，后续可编辑地址或说明"></label><div class="actions"><button class="primary" onclick="savePool(${p.id||0})">保存代理</button>${p.id?`<button onclick="checkPool(${p.id})">自动校验并绑定 IP</button><button class="${disabled?"primary":"danger solid"}" onclick="togglePool(${p.id},'${disabled?"启用":"禁用"}')">${disabled?"启用":"禁用"}</button><button class="danger" onclick="deletePool(${p.id})">删除代理</button>`:""}</div></div>`}
async function savePool(id){try{const current=state.pools.find(x=>x.id===id)||{};const p=await api("/api/proxy/pools",{id,name:$("pName").value||nextPoolName(),source_uri:$("pUri").value,status:current.status||"启用",expected_exit_ip:current.expected_exit_ip||"",region:current.region||"",notes:$("pNotes").value});state.pools=p.pools;state.accounts=p.accounts;state.selectedPool=p.pool.id;renderPools();renderAccounts();renderPoolForm(p.pool);$("detail").textContent=JSON.stringify(p.pool,null,2);setStatus("代理已保存。","ok")}catch(e){setStatus(apiError(e),"bad")}}
async function togglePool(id,status){try{const current=state.pools.find(x=>x.id===id);if(!current)return;const p=await api("/api/proxy/pools",{id,name:current.name,source_uri:current.source_uri,status,expected_exit_ip:current.expected_exit_ip||"",region:current.region||"",notes:current.notes||""});state.pools=p.pools;state.accounts=p.accounts;state.selectedPool=p.pool.id;renderPools();renderAccounts();renderPoolForm(p.pool);$("detail").textContent=JSON.stringify(p.pool,null,2);setStatus(status==="禁用"?"代理已禁用。":"代理已启用。","ok")}catch(e){setStatus(apiError(e),"bad")}}
async function checkPool(id){try{setStatus("正在通过服务器 mihomo 查询出口 IP...");const p=await api("/api/proxy/check",{proxy_profile_id:id,bind:true});await loadAll();const updated=state.pools.find(x=>x.id===id);if(updated)renderPoolForm(updated);$("detail").textContent=JSON.stringify(p,null,2);setStatus(p.allowed?"出口 IP 已绑定。":"已记录出口 IP，但当前状态不允许登录/采集："+p.reason,p.allowed?"ok":"bad")}catch(e){setStatus(apiError(e),"bad")}}
async function deletePool(id){if(!confirm("删除这个未绑定账号的代理？"))return;try{const p=await api("/api/proxy/pools/delete",{id});state.pools=p.pools;state.accounts=p.accounts;state.selectedPool=0;renderPools();renderAccounts();clearEditor();setStatus("代理已删除。","ok")}catch(e){setStatus(apiError(e),"bad")}}
function selectedPool(){return state.pools.find(x=>x.id===state.selectedPool)}
function availableLoginPools(){return state.pools.filter(p=>p.status==="启用"&&Number(p.account_count||0)===0)}
function newAccount(){state.loginSession=null;const modal=$("loginModal");const select=$("loginProxySelect");const pools=availableLoginPools();select.innerHTML=pools.map(p=>`<option value="${p.id}">${esc(p.name)} / ${esc(p.expected_exit_ip||"未绑定 IP")} / ${esc(p.detected_address||p.region||"未检测地区")}</option>`).join("");if(state.selectedPool&&pools.some(p=>p.id===state.selectedPool))select.value=state.selectedPool;$("loginProgress").style.width="0";const link=$("loginOpenLink");link.href="#";link.className="link-btn";$("loginCancelBtn").style.display="none";$("loginStartBtn").disabled=false;modal.classList.add("open");syncLoginButton()}
function syncLoginButton(){const has=Boolean($("loginProxySelect").value);$("loginStartBtn").disabled=!has;$("loginHint").className="status "+(has?"":"bad");$("loginHint").textContent=has?`选择代理后点击登录。未完成账号登记时，通道会在 ${state.pendingLoginTtlMinutes} 分钟后自动释放。`:"没有可用的未绑定代理，请先新增或修复代理。"}
async function closeLoginModal(){if(state.loginSession){await cancelPendingLogin();return}$("loginModal").classList.remove("open")}
function stopLoginPoll(){if(state.loginPollTimer){clearTimeout(state.loginPollTimer);state.loginPollTimer=0}}
function scheduleLoginPoll(){stopLoginPoll();if(state.loginSession)state.loginPollTimer=setTimeout(pollLoginBinding,2000)}
async function pollLoginBinding(){const s=state.loginSession;if(!s)return;try{const r=await api("/api/proxy/login-session/status",{session_id:s.id});if(r.bound){stopLoginPoll();state.pools=r.pools||state.pools;state.accounts=r.accounts||state.accounts;state.sessions=r.sessions||state.sessions;state.loginSession=null;$("loginModal").classList.remove("open");renderPools();renderAccounts();setStatus(`账号 @${(r.account||{}).username||"已登录账号"} 已自动绑定，Profile 已持久化。`,"ok");return}if(!r.active){stopLoginPoll();state.loginSession=null;$("loginHint").className="status bad";$("loginHint").textContent=r.reason||"登录通道已结束。";$("loginCancelBtn").style.display="none";return}if(r.status==="login_detected"){$("loginHint").className="status ok";$("loginHint").textContent="已检测到 TikTok 登录，正在读取账号身份并完成绑定..."}else if(r.status==="duplicate_account"){$("loginHint").className="status bad";$("loginHint").textContent=r.reason||"账号已经存在。"}}catch(e){$("loginHint").className="status bad";$("loginHint").textContent=`登录状态检测暂时失败：${apiError(e)}`}finally{if(state.loginSession)scheduleLoginPoll()}}
async function startLoginObservation(){const proxyId=Number($("loginProxySelect").value);if(!proxyId)return;try{$("loginStartBtn").disabled=true;$("loginProgress").style.width="35%";$("loginHint").className="status";$("loginHint").textContent="正在校验代理出口 IP...";const r=await api("/api/proxy/login-session/start",{proxy_profile_id:proxyId});state.pools=r.pools||state.pools;state.accounts=r.accounts||state.accounts;state.sessions=r.sessions||state.sessions;state.loginSession=r.session;const url=r.session.channel_url||state.novncUrl;$("loginProgress").style.width="100%";const link=$("loginOpenLink");link.href=url;link.className="link-btn show";$("loginCancelBtn").style.display="inline-flex";const opened=window.open(url,"_blank","noopener");$("loginHint").className="status ok";$("loginHint").textContent=opened?`观测通道已启动，正在等待 TikTok 登录成功信号；${state.pendingLoginTtlMinutes} 分钟未绑定将自动释放。`:`观测通道已启动，请点击 noVNC 入口；${state.pendingLoginTtlMinutes} 分钟未绑定将自动释放。`;scheduleLoginPoll();renderPools();renderAccounts()}catch(e){stopLoginPoll();$("loginProgress").style.width="100%";$("loginHint").className="status bad";$("loginHint").textContent=apiError(e);$("loginStartBtn").disabled=false;await loadAll().catch(()=>{})}}
async function cancelPendingLogin(){const s=state.loginSession;if(!s){$("loginModal").classList.remove("open");return}stopLoginPoll();$("loginHint").className="status";$("loginHint").textContent="正在关闭浏览器并释放观测通道...";try{await api("/api/proxy/login-session/stop",{session_id:s.id,failed:false,reason:"关闭未绑定账号弹窗，释放临时通道"});state.loginSession=null;$("loginOpenLink").className="link-btn";$("loginCancelBtn").style.display="none";$("loginStartBtn").disabled=false;$("loginModal").classList.remove("open");await loadAll(true);setStatus("未绑定登录通道已关闭，相关实例已释放。","ok")}catch(e){state.loginSession=s;$("loginHint").className="status bad";$("loginHint").textContent=`释放失败：${apiError(e)}`;scheduleLoginPoll()}}

function editAccount(id){const a=state.accounts.find(x=>x.id===id);if(!a)return;state.selectedAccount=id;state.editing="account";$("editorTitle").textContent="账号详情";$("detail").textContent=JSON.stringify(a,null,2);renderAccounts();renderAccountDetail(a)}
function renderManualLogin(p){$("editor").innerHTML=`<div class="stack"><div class="status"><b>已选择代理：</b>${esc(p.name)} / ${esc(p.expected_exit_ip||"未绑定 IP")} / ${esc(p.detected_address||p.region||"未检测地区")}</div><div class="status ok">请在 noVNC 里的浏览器访问 TikTok 官方登录页，完成手动登录后，再在下面登记账号名。</div><div class="actions"><a class="primary" href="${esc(state.novncUrl)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;min-height:34px;border-radius:8px;padding:7px 12px;text-decoration:none;font-size:13px;font-weight:700;background:var(--brand);border:1px solid var(--brand);color:#fff">打开 noVNC</a><button onclick="checkPool(${p.id})">重新校验代理 IP</button></div><div class="split"><label>TikTok 账号<input id="aUser" placeholder="登录完成后填写，不带 @"></label><label>展示名<input id="aName" placeholder="可选"></label></div><label>备注<input id="aNotes" placeholder="可选，例如登录方式、手机号归属等"></label><div class="actions"><button class="primary" onclick="saveLoggedAccount(${p.id})">登记已登录账号</button></div></div>`}
function renderAccountDetail(a){const s=activeSessionForAccount(a.id);$("editor").innerHTML=`<div class="stack"><div class="status"><b>@${esc(a.username)}</b><div class="muted">绑定代理：${esc(poolName(a.proxy_profile_id))}</div><div class="muted">首次登录 Profile 已持久化；再次唤醒复用同一 user-data-dir。</div></div><div class="split"><label>展示名<input id="aName" value="${esc(a.display_name||"")}" placeholder="可选"></label><label>状态<input readonly value="${esc(accountRuntimeStatus(a))}"></label></div><label>备注<input id="aNotes" value="${esc(a.notes||"")}" placeholder="可选"></label><div class="actions">${s?`<button onclick="openAccountSession(${a.id})">打开观测</button><button class="danger" onclick="sleepAccount(${a.id})">休眠</button>`:`<button class="primary" onclick="wakeAccount(${a.id})">唤醒账号</button>`}<button onclick="saveLoggedAccount(${a.proxy_profile_id},${a.id},'${esc(a.username)}')">保存账号备注</button><button onclick="preflight(${a.id})">登录前自动校验</button><button class="danger" onclick="deleteAccount(${a.id})">删除账号</button></div></div>`}
function profileKey(username){return String(username||"").replace(/^@/,"").toLowerCase().replace(/[^a-z0-9._-]+/g,"_").replace(/^[._-]+|[._-]+$/g,"")||"account"}
function accountProfile(proxyId,username,id=0){const p=state.pools.find(x=>x.id===Number(proxyId))||{};const existing=id?(state.accounts.find(x=>x.id===Number(id))||{}):{};const profile={...(existing.profile||{})};const key=profileKey(username);profile.manual_login={...(profile.manual_login||{}),surface:"novnc",official_site:"https://www.tiktok.com/",updated_at:new Date().toISOString()};profile.proxy_binding={proxy_profile_id:Number(proxyId),proxy_name:p.name||"",local_port:p.local_port||0,expected_exit_ip:p.expected_exit_ip||"",detected_address:p.detected_address||p.region||""};profile.isolation={...(profile.isolation||{}),browser_profile_key:`tiktok-${key}`,user_data_dir:`data/tiktok_browser_profiles/${key}/user-data`,cookie_store_dir:`data/tiktok_browser_profiles/${key}/cookies`,session_dir:`data/tiktok_sessions/${key}`,cache_dir:`data/tiktok_browser_profiles/${key}/cache`,download_dir:`data/tiktok_browser_profiles/${key}/downloads`,browser_context:"per_account_required",storage_state:"per_account_required",cookie_jar:"per_account_required",local_storage:"per_account_required",indexed_db:"per_account_required",service_workers:"per_account_required",web_rtc_policy:"disable_non_proxied_udp_required",runner_must_preflight_proxy_ip:true};profile.browser_settings={...(profile.browser_settings||{}),locale:"en-US",timezone:"America/Los_Angeles",accept_language:"en-US,en",geolocation:"deny_or_match_proxy_region",permissions:"per_account_profile_only",proxy_server:`127.0.0.1:${p.local_port||0}`,disable_background_networking:true,disable_default_apps:true,disable_sync:true,disable_translate:true,disable_non_proxied_udp:true};profile.system_settings={...(profile.system_settings||{}),preferred_desktop_mode:"per_slot_novnc_or_container",clipboard_isolation:"avoid_cross_account_copy_paste",downloads_isolation:"per_account_download_dir"};profile.worker={...(profile.worker||{}),mode:"slot_pool",max_parallel_slots:state.browserMaxSlots,one_account_per_browser_context:true,one_account_per_browser_process:true,novnc_observation:"per_slot_or_selected_account"};return profile}
async function saveLoggedAccount(proxyId,id=0,lockedUsername=""){try{const userInput=$("aUser"),nameInput=$("aName"),notesInput=$("aNotes");const username=lockedUsername||(userInput?userInput.value:"");const profile=accountProfile(proxyId,username,id);const sessionId=state.loginSession&&Number(proxyId)===Number((state.loginSession||{}).proxy_profile_id)?state.loginSession.id:0;const p=await api("/api/proxy/accounts",{id,username,display_name:nameInput?nameInput.value:"",proxy_profile_id:Number(proxyId),status:"可用",profile,notes:notesInput?notesInput.value:"",session_id:sessionId});state.pools=p.pools;state.accounts=p.accounts;state.sessions=p.sessions||state.sessions;state.selectedAccount=p.account.id;renderPools();renderAccounts();$("detail").textContent=JSON.stringify(p.account,null,2);setStatus("账号已登记，Profile 已后台保存。","ok")}catch(e){setStatus(apiError(e),"bad");throw e}}

async function deleteAccount(id){if(!confirm("删除这个 TikTok 账号？"))return;try{const p=await api("/api/proxy/accounts/delete",{id});state.pools=p.pools;state.accounts=p.accounts;state.selectedAccount=0;renderPools();renderAccounts();clearEditor();setStatus("账号已删除。","ok")}catch(e){setStatus(apiError(e),"bad")}}
async function preflight(id){try{setStatus("正在通过服务器 mihomo 做登录前 IP 校验...");const p=await api("/api/proxy/accounts/preflight",{account_id:id});await loadAll();$("detail").textContent=JSON.stringify(p,null,2);setStatus(p.allowed?"IP 匹配，允许登录/采集。":"IP 不匹配，禁止登录/采集："+p.reason,p.allowed?"ok":"bad")}catch(e){setStatus(apiError(e),"bad")}}
async function wakeAccount(id){const a=state.accounts.find(x=>x.id===Number(id));if(!a)return;try{setStatus("正在校验绑定代理并唤醒账号...");const r=await api("/api/proxy/login-session/start",{account_id:id,proxy_profile_id:a.proxy_profile_id});state.pools=r.pools||state.pools;state.accounts=r.accounts||state.accounts;state.sessions=r.sessions||state.sessions;state.loginSession=r.session;renderAccounts();const opened=window.open(r.session.channel_url,"_blank","noopener");setStatus(opened?"账号已使用持久化 Profile 唤醒。":"账号已唤醒，请点击“打开观测”。","ok")}catch(e){setStatus(apiError(e),"bad");await loadAll(true).catch(()=>{})}}
function openAccountSession(id){const s=activeSessionForAccount(id);if(!s){setStatus("账号当前处于休眠状态。","bad");return}window.open(s.channel_url,"_blank","noopener")}
async function sleepAccount(id){const s=activeSessionForAccount(id);if(!s)return;try{const p=await api("/api/proxy/login-session/stop",{session_id:s.id,failed:false,reason:"手动休眠账号"});state.pools=p.pools||state.pools;state.accounts=p.accounts||state.accounts;state.sessions=p.sessions||state.sessions;renderAccounts();const a=state.accounts.find(x=>x.id===Number(id));if(a&&state.selectedAccount===id)renderAccountDetail(a);setStatus("账号已休眠，浏览器和 noVNC 通道已释放。","ok")}catch(e){setStatus(apiError(e),"bad")}}
async function exportMihomo(){try{const p=await api("/api/proxy/mihomo-export");$("editorTitle").textContent="mihomo 导出";$("editor").innerHTML='<div class="muted">包含 proxies 和 listeners。端口段专用于 TikTok 账号代理池。</div>';$("detail").textContent=p.yaml||"";setStatus("已生成 mihomo 配置片段。","ok")}catch(e){setStatus(apiError(e),"bad")}}
window.addEventListener("pagehide",()=>{const s=state.loginSession;if(!s)return;stopLoginPoll();const body=new Blob([JSON.stringify({session_id:s.id,failed:false,reason:"账号池页面关闭，释放未绑定登录通道"})],{type:"application/json"});navigator.sendBeacon("/api/proxy/login-session/stop",body)});
clearEditor();loadRuntime();loadAll().catch(e=>setStatus(apiError(e),"bad"));setInterval(()=>loadAll(true).catch(()=>{}),10000);
</script>
</body>
