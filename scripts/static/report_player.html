<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆款视频播放分析</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#0f172a;--muted:#64748b;--soft:#f8fafc;--line:#e5e7eb;--blue:#2563eb;--blueSoft:#eff6ff;--green:#059669;--shadow:0 1px 2px rgba(15,23,42,.04),0 18px 42px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}button{font:inherit;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#fff;color:var(--text);cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
header{height:60px;max-height:60px;display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:center;gap:18px;padding:0 24px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);overflow:hidden}.brand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-width:0;overflow:hidden}.brand a{color:var(--muted);font-size:13px;white-space:nowrap}.brand h1{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.video-pager{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}.video-pager button{width:30px;height:30px;padding:0;border-radius:7px;font-size:17px;line-height:1}.video-pager button:disabled{cursor:default;opacity:.35}.video-position{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}.meta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;color:var(--muted);font-size:12px;width:300px;min-width:300px;overflow:hidden}.meta button{flex:0 0 88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta a{flex:0 0 72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:var(--blueSoft);color:var(--blue);font-weight:750;white-space:nowrap}
.layout{height:calc(100vh - 60px);padding:16px;display:grid;grid-template-columns:minmax(340px,540px) minmax(520px,1fr);gap:16px;overflow:hidden}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.player{display:grid;grid-template-rows:minmax(0,1fr) 104px;align-self:stretch;justify-self:stretch;width:100%;max-width:540px;height:100%;min-height:0}.video-wrap{min-height:0;display:grid;place-items:center;background:#0b1220;padding:18px;overflow:hidden}.video-stage{position:relative;display:block;max-width:100%;max-height:100%;overflow:hidden;border-radius:12px;background:#000}.video-stage video{display:block;width:100%;height:100%;object-fit:fill;background:#000}.video-controls{position:absolute;left:10px;right:10px;bottom:10px;height:38px;display:grid;grid-template-columns:32px minmax(0,1fr) 86px;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;background:linear-gradient(180deg,rgba(15,23,42,.30),rgba(15,23,42,.76));color:#fff;opacity:.94;transition:opacity .15s ease}.video-stage:not(:hover) .video-controls{opacity:.72}.video-controls button{height:24px;width:24px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#0f172a;font-size:12px;line-height:1}.video-controls input{width:100%;accent-color:#fff}.video-controls span{font-size:12px;font-variant-numeric:tabular-nums;text-align:right}.video-meta{height:104px;padding:13px 16px;border-top:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) 24px;gap:8px;overflow:hidden}.video-meta h2{font-size:16px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.stats{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;color:var(--muted);font-size:12px}.stats span{height:24px;display:inline-flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap}
.analysis{display:grid;grid-template-rows:minmax(270px,42%) minmax(0,1fr);gap:16px;overflow:hidden}.section{display:grid;grid-template-rows:auto minmax(0,1fr)}.section-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff}.section-head h2{font-size:14px}.timecode{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.content{padding:16px 18px;overflow:auto;color:#263244;font-size:14px;white-space:pre-wrap}.content strong{font-weight:850;color:#0f172a}.segment-title{font-size:15px;font-weight:850;margin-bottom:10px}.current-card{border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:12px;background:linear-gradient(180deg,#eff6ff,#fff);padding:14px 15px;box-shadow:0 10px 24px rgba(37,99,235,.08)}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:28px}.timeline-list{display:grid;gap:10px}.timeline-item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;transition:.15s ease}.timeline-item.active{border-color:#93c5fd;background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.10) inset}.timeline-item b{display:block;margin-bottom:5px;font-size:12px;color:var(--blue)}
@media(max-width:980px){header{height:84px;max-height:84px;grid-template-columns:1fr;padding:8px 14px;align-content:center}.meta{width:100%;min-width:0;justify-content:flex-start}.layout{height:auto;overflow:visible;grid-template-columns:1fr}.player{justify-self:center;width:100%;max-width:540px;height:min(78vh,720px)}.analysis{grid-template-rows:auto auto}.section{min-height:320px}}
</style>
</head>
<body>
<header>
  <div class="brand"><a id="backLink" href="/report">返回日报</a><h1 id="pageTitle">爆款视频播放分析</h1><div class="video-pager" aria-label="视频翻页"><button id="prevVideoBtn" type="button" aria-label="上一个视频" title="上一个视频">←</button><span id="videoPosition" class="video-position">- / -</span><button id="nextVideoBtn" type="button" aria-label="下一个视频" title="下一个视频">→</button></div></div>
  <div class="meta"><button id="translateBtn">翻译解析</button><span id="datePill" class="pill">-</span><a id="originLink" target="_blank" rel="noopener noreferrer"></a></div>
</header>
<main class="layout">
  <section class="panel player">
    <div id="videoWrap" class="video-wrap"><div id="videoStage" class="video-stage"><video id="video" playsinline></video><div class="video-controls"><button id="playBtn" type="button">▶</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="videoClock">00:00</span></div></div></div>
    <div class="video-meta">
      <h2 id="videoTitle">加载中...</h2>
      <div id="stats" class="stats"></div>
    </div>
  </section>
  <aside class="analysis">
    <section class="panel section">
      <div class="section-head"><h2>当前时间段解析</h2><span id="timecode" class="timecode">00:00</span></div>
      <div id="currentSegment" class="content"><div class="empty">等待视频加载。</div></div>
    </section>
    <section class="panel section">
      <div class="section-head"><h2>总体爆款拆解</h2><span id="rankPill" class="timecode"></span></div>
      <div id="deepDive" class="content"><div class="empty">暂无拆解内容。</div></div>
    </section>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);let currentReport=null,currentVideo=null,currentTimeline=[];
function setTextTitle(id,value){const el=$(id),text=String(value||"");el.textContent=text;el.title=text}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtMd(v){return esc(v).replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")}
function fmtNum(n){n=Number(n||0);if(n>=1e8)return (n/1e8).toFixed(1)+"亿";if(n>=1e4)return (n/1e4).toFixed(1)+"万";return String(n||0)}
function fmtClock(s){s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=Math.floor(s%60);return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`}
function fitVideoStage(){const wrap=$("videoWrap"),stage=$("videoStage"),vid=$("video");if(!wrap||!stage||!vid)return;const w=wrap.clientWidth,h=wrap.clientHeight,vw=vid.videoWidth||9,vh=vid.videoHeight||16;if(!w||!h)return;const boxRatio=w/h,videoRatio=vw/vh;let sw=w,sh=h;if(videoRatio>boxRatio){sh=w/videoRatio}else{sw=h*videoRatio}stage.style.width=Math.max(1,Math.floor(sw))+"px";stage.style.height=Math.max(1,Math.floor(sh))+"px"}
function syncVideoControls(){const vid=$("video"),seek=$("seek"),btn=$("playBtn"),clock=$("videoClock");if(!vid||!seek||!btn||!clock)return;const duration=Number(vid.duration||0),current=Number(vid.currentTime||0);seek.value=duration?String(Math.round(current/duration*1000)):"0";btn.textContent=vid.paused?"▶":"Ⅱ";clock.textContent=duration?`${fmtClock(current)} / ${fmtClock(duration)}`:fmtClock(current)}
function setupVideoControls(){const vid=$("video"),seek=$("seek"),btn=$("playBtn"),stage=$("videoStage");if(!vid||!seek||!btn||!stage)return;const toggle=()=>{if(vid.paused)vid.play().catch(()=>{});else vid.pause()};btn.onclick=toggle;vid.onclick=toggle;seek.oninput=()=>{if(Number(vid.duration||0))vid.currentTime=Number(seek.value)/1000*vid.duration};["play","pause","timeupdate","durationchange","loadedmetadata"].forEach(name=>vid.addEventListener(name,syncVideoControls));vid.addEventListener("loadedmetadata",()=>{fitVideoStage();syncVideoControls()});window.addEventListener("resize",fitVideoStage)}
const KEY_LABELS={index:"序号",time_range:"时间段",timeRange:"时间段",timestamp:"时间点",time:"时间",visual:"画面解析",audio:"声音/台词",transcript:"字幕/转写",summary:"摘要",video_description:"视频描述",description:"描述",scene:"场景",title:"标题"};
const LINE_LABELS={"Frame":"帧","Setting/Scene":"场景/环境","Action/Movement":"动作/运动","New Information":"新增信息","Continuity Points":"连贯信息","Key continuation points":"后续关注点","Visual":"画面","Audio":"声音","Text":"画面文字","Objects":"关键物体","People":"人物","Camera":"镜头","Mood":"情绪氛围"};
function labelOf(k){return KEY_LABELS[k]||k}
function localizeText(v){let s=String(v||"").replace(/^```[a-zA-Z]*\s*/,"").replace(/\s*```$/,"").trim();for(const [en,zh] of Object.entries(LINE_LABELS)){s=s.replace(new RegExp(`(^|\\n)${en}:`,"g"),`$1${zh}：`)}return s.replace(/(^|\n)Frame\s+(\d+)\s+\(([^)]+)\)/g,"$1帧 $2（$3）").replace(/\bseconds?\b/g,"秒")}
function parseTime(v){const s=String(v||"").trim();let m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m){const a=Number(m[1]),b=Number(m[2]),c=m[3]==null?null:Number(m[3]);return c==null?a*60+b:a*3600+b*60+c}m=s.match(/(\d+(?:\.\d+)?)\s*s/i);if(m)return Number(m[1]);m=s.match(/^\d+(?:\.\d+)?$/);return m?Number(m[0]):null}
function rangeOf(item,index,body=""){const raw=item?.time_range||item?.timeRange||item?.timestamp||item?.time||"";const parts=String(raw).split(/\s*(?:-|–|—|~|至|到)\s*/);let start=parseTime(parts[0]),end=parseTime(parts[1]);if(start==null){const m=String(body).match(/(?:Frame|帧)\s*\d+[^\d]{0,20}(\d+(?:\.\d+)?)\s*(?:s|seconds?|秒)/i)||String(body).match(/(?:at|在)\s*(\d+(?:\.\d+)?)\s*(?:s|seconds?|秒)/i);if(m)start=Number(m[1])}if(start==null)start=index;if(end==null||end<=start)end=start+1;return {start,end,label:raw||fmtClock(start)}}
function textOf(value){if(value==null)return "";if(typeof value==="string")return localizeText(value);if(Array.isArray(value))return value.map(textOf).filter(Boolean).join("\n");if(typeof value==="object"){return Object.entries(value).filter(([k,v])=>!["start","end"].includes(k)&&v!=null&&v!==""&&k!=="time_range").map(([k,v])=>`${labelOf(k)}：${textOf(v)}`).join("\n")}return String(value)}
function timelineFromAnalysis(analysis){const items=[];const raw=analysis?.timeline||analysis?.segments||analysis?.frame_analyses||[];if(Array.isArray(raw)){raw.forEach((item,i)=>{const body=textOf(item),r=rangeOf(item,i,body);items.push({...r,title:item?.title||item?.scene||item?.time_range||item?.timestamp||`片段 ${i+1}`,body})})}return items.filter(x=>x.body)}
function deepDiveFor(report,video,index){const dives=report?.video_deep_dives||[];if(!dives.length)return "";const rank=Number(video?.daily_rank||video?.report_rank||index+1);const title=String(video?.title||"").slice(0,24);const exact=rx=>dives.find(x=>{const t=typeof x==="string"?x:(x&&typeof x==="object"?(x.text||x.content||""):"");return rx.test(String(t))});let hit=exact(new RegExp(`^\\*\\*\\s*视频\\s*${rank}\\s*\\*\\*`))||exact(new RegExp(`\\*\\*\\s*视频\\s*${rank}\\s*\\*\\*`));if(hit)return hit;if(title){const t=exact(new RegExp(escRe(title)));if(t)return t}const byRankField=dives.find(x=>x&&typeof x==="object"&&Number(x.rank)===rank);if(byRankField)return byRankField;return dives[index]||dives[0]||""}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function renderSegment(segment,all,currentTime){$("timecode").textContent=fmtClock(currentTime);if(!all.length){$("currentSegment").innerHTML='<div class="empty">暂无时间轴解析，展示解析摘要。</div>';return}const html=`<div class="current-card"><div class="segment-title">${esc(segment.label||segment.title)}</div>${fmtMd(segment.body)}</div><div class="timeline-list" style="margin-top:16px">${all.map((x,i)=>`<div class="timeline-item ${x===segment?'active':''}" data-i="${i}"><b>${esc(x.label)}</b>${fmtMd(String(x.body))}</div>`).join("")}</div>`;$("currentSegment").innerHTML=html;document.querySelectorAll(".timeline-item").forEach(el=>el.onclick=()=>{const item=all[Number(el.dataset.i)];if(item){$("video").currentTime=item.start;$("video").play().catch(()=>{});renderSegment(item,all,item.start)}});document.querySelector(".timeline-item.active")?.scrollIntoView({block:"nearest"})}
function isCachedRebuiltReport(){const summary=String(currentReport?.report?.summary||currentReport?.report_markdown||"");return summary.includes("未沿用旧的逐条画面解析文本")||summary.includes("缓存重建")}
function hasTrustedTimeline(video){const ids=currentReport?.report?.timeline_trusted_video_ids;return Array.isArray(ids)&&ids.map(String).includes(String(video?.video_id||""))}
function cachedTimelineFallback(video){const m=video?.metrics||{};const rows=[`视频 ID：${video?.video_id||""}`,`标题：${video?.title||""}`,`来源：${video?.source_label||""}`,`播放：${fmtNum(m.play_count)}，点赞：${fmtNum(m.like_count)}，评论：${fmtNum(m.comment_count)}，分享：${fmtNum(m.share_count)}，热度：${fmtNum(video?.hot_score)}`,"旧时间轴画面解析疑似错配，已隐藏；这里保留已确认绑定的视频身份和互动数据。"];return [{start:0,end:999999,label:"缓存重建摘要",title:"缓存重建摘要",body:rows.filter(Boolean).join("\n")}]}
function buildTimeline(video){if(isCachedRebuiltReport()&&!hasTrustedTimeline(video))return cachedTimelineFallback(video);const analysis=video.analysis_zh||video.analysis;const timeline=timelineFromAnalysis(analysis);const fallback=textOf(analysis?.summary||analysis?.video_description||analysis?.transcript?.text);if(!timeline.length&&fallback)timeline.push({start:0,end:999999,label:"解析摘要",title:"解析摘要",body:fallback});return timeline}
function refreshTimeline(){currentTimeline=buildTimeline(currentVideo||{});const t=$("video").currentTime||0;const seg=currentTimeline.find(x=>t>=x.start&&t<x.end)||currentTimeline[0];renderSegment(seg,currentTimeline,t)}
function playerUrl(video){const query=new URLSearchParams({date:currentReport?.report_date||params.get("date")||"",platform:String(video?.platform||""),video_id:String(video?.video_id||"")});return `/report/player?${query}`}
function setupPager(videos,index){const prev=$("prevVideoBtn"),next=$("nextVideoBtn");$("videoPosition").textContent=`${index+1} / ${videos.length}`;prev.disabled=index<=0;next.disabled=index<0||index>=videos.length-1;prev.onclick=()=>{if(index>0)location.assign(playerUrl(videos[index-1]))};next.onclick=()=>{if(index+1<videos.length)location.assign(playerUrl(videos[index+1]))}}
async function translateCurrent(){if(!currentReport||!currentVideo)return;const btn=$("translateBtn"),force=Boolean(currentVideo.analysis_zh);btn.disabled=true;btn.textContent="翻译中...";try{const r=await fetch("/api/report/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:currentReport.report_date,platform:currentVideo.platform,video_id:currentVideo.video_id,force})});const payload=await r.json();if(!r.ok)throw new Error(payload.error||"翻译失败");currentVideo.analysis_zh=payload.analysis_zh;btn.textContent=payload.status==="cached"?"已加载中文":"已翻译";refreshTimeline()}catch(e){btn.textContent=e.message||"翻译失败"}finally{setTimeout(()=>{btn.disabled=false;if(currentVideo?.analysis_zh)btn.textContent="重新加载中文";},1600)}}
async function main(){const date=params.get("date")||"",platform=params.get("platform")||"",videoId=params.get("video_id")||"";const url=`/api/report?raw=1${date?`&date=${encodeURIComponent(date)}`:""}`;const data=await (await fetch(url)).json();currentReport=data;const videos=(Array.isArray(data.videos)?data.videos:[]).map((video,index)=>({video,index})).sort((a,b)=>Number(a.video?.report_rank||a.index+1)-Number(b.video?.report_rank||b.index+1)).map(row=>row.video);const video=videos.find(v=>String(v.platform)===platform&&String(v.video_id)===videoId)||videos[0];currentVideo=video;if(!video){setTextTitle("videoTitle","未找到视频");return}const idx=videos.indexOf(video),m=video.metrics||{};setupPager(videos,idx);setTextTitle("pageTitle",video.title||"爆款视频播放分析");setTextTitle("videoTitle",video.title||"无标题");$("datePill").textContent=data.report_date||date||"-";$("backLink").href=`/report${data.report_date?`?date=${encodeURIComponent(data.report_date)}`:""}`;$("rankPill").textContent=`排名 ${video.report_rank||idx+1}`;$("stats").innerHTML=[["播放",m.play_count],["点赞",m.like_count],["评论",m.comment_count],["分享",m.share_count],["热度",video.hot_score]].map(x=>`<span>${x[0]} ${fmtNum(x[1])}</span>`).join("");if(video.source_url){$("originLink").textContent="原视频链接";$("originLink").title=video.source_url;$("originLink").href=video.source_url}else $("originLink").style.display="none";if(video.local_filename)$("video").src=`/video/${encodeURIComponent(video.local_filename)}`;const deep=deepDiveFor(data.report,video,idx);$("deepDive").innerHTML=deep?fmtMd(deep):'<div class="empty">暂无该视频总体拆解。</div>';const vid=$("video");setupVideoControls();currentTimeline=buildTimeline(video);function update(){const t=vid.currentTime||0;const seg=currentTimeline.find(x=>t>=x.start&&t<x.end)||currentTimeline[0];renderSegment(seg,currentTimeline,t)}vid.addEventListener("timeupdate",update);vid.addEventListener("loadedmetadata",()=>{fitVideoStage();update()});$("translateBtn").onclick=translateCurrent;if(video.analysis_zh)$("translateBtn").textContent="已加载中文";fitVideoStage();syncVideoControls();update()}
main().catch(err=>{$("videoTitle").textContent=err.message;$("currentSegment").innerHTML=`<div class="empty">${esc(err.message)}</div>`});
</script>
</body>
</html>
