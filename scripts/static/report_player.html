<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆款视频播放复盘</title>
<style>
:root{
  --bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:#e2e8f0;--border2:#f1f5f9;
  --accent:#0f172a;--accent2:#334155;--accent-soft:#f1f5f9;
  --brand:#2563eb;--brand-soft:#eff6ff;
  --green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;
  --radius-sm:8px;--radius:12px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 20px 60px rgba(15,23,42,.18);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.55;height:100vh;overflow:hidden}

.ui-header{position:relative!important}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn-ghost{height:32px!important;min-height:32px!important;padding:0 12px!important;background:var(--surface)!important;color:var(--text2)!important;border:1px solid var(--border)!important;border-radius:var(--radius-sm)!important;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none!important;white-space:nowrap;box-shadow:none!important}
.btn-ghost:hover{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#cbd5e1!important}

.pl-pager{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:9px;padding:2px;background:var(--surface)}
.pl-pager button{width:26px!important;height:26px!important;min-height:26px!important;border:0!important;background:transparent!important;border-radius:6px!important;font-size:13px;color:var(--text2)!important;padding:0!important;display:grid;place-items:center;box-shadow:none!important}
.pl-pager button:hover{background:var(--border2)!important;color:var(--text)!important}
.pl-pager button:disabled{opacity:.3!important;cursor:default!important}
.pl-pager span{font-size:11.5px;color:var(--text2);min-width:36px;text-align:center;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 12px;background:var(--surface);font-size:12px;font-weight:600;color:var(--text2)}

.pl-shell{height:100%;min-height:0;display:grid;grid-template-columns:420px minmax(0,1fr);overflow:hidden}
.pl-rail{background:var(--surface);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}

.pl-stage{position:relative;width:100%;aspect-ratio:9/16;max-height:480px;border-radius:12px;background:#0b1220;display:grid;place-items:center;overflow:hidden;flex:none;margin:0 auto;box-shadow:0 4px 16px rgba(15,23,42,.12)}
.pl-stage video{width:100%;height:100%;object-fit:contain}
.pl-controls{position:absolute;left:10px;right:10px;bottom:10px;height:36px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(15,23,42,.76);color:#fff;backdrop-filter:blur(8px)}
.pl-controls button{width:24px!important;height:24px!important;min-height:24px!important;border:0!important;border-radius:50%!important;background:#fff!important;color:#0f172a!important;font-size:11px;padding:0!important;flex:none;line-height:1;display:grid;place-items:center;box-shadow:none!important}
.pl-controls input[type="range"]{flex:1;accent-color:#fff;cursor:pointer}
.pl-controls span{font-size:11px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}

.pl-title{font-size:14px;font-weight:750;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pl-stats span{height:24px;display:inline-flex;align-items:center;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--text2);background:var(--surface)}
.pl-stats .hot{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

.pl-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl-facts div{border:1px solid var(--border2);border-radius:9px;padding:7px 9px;min-width:0}
.pl-facts span{display:block;font-size:10.5px;color:var(--text3);font-weight:700}
.pl-facts b{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Right Main 50/50 vertical split */
.pl-main{background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:14px;height:100%;min-height:0;overflow:hidden}
.pl-main .card{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pl-main .card .sect-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.pl-main .card .sect-head b{font-size:13.5px;font-weight:750}
.card-body-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;font-size:12.5px;color:#263244;line-height:1.6}
.timecode{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}

.seg-current{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:11px 13px;margin-bottom:10px}
.seg-current b{display:block;font-size:12px;color:var(--accent2);margin-bottom:5px}
.seg-current p{font-size:12.5px;color:#263244;line-height:1.6}

/* Timeline Chips */
.tl-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tl-chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--text2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;transition:.15s ease}
.tl-chip:hover{border-color:#cbd5e1;background:var(--border2)}
.tl-chip.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:700}

.empty{text-align:center;padding:24px 14px;color:var(--text3);font-size:12px}

@media(max-width:980px){
  body{height:auto;overflow:auto}
  .pl-shell{display:flex;flex-direction:column;height:auto;min-height:100%}
  .pl-rail{height:auto;flex:none;display:flex;flex-direction:column;overflow:visible}
  .pl-stage{max-height:360px}
  .pl-main{flex:none;height:auto;overflow:visible;padding:12px}
  .pl-main .card{height:auto;min-height:300px;flex:none}
  .header-actions{justify-content:flex-end}
  .header-actions .btn-ghost{padding:0 8px!important;font-size:11px!important}
}
</style>
</head>
<body>
<div class="ui-app">
<!-- UI_APP_NAV -->
<div class="ui-frame">
<header class="ui-header">
  <div class="source-page-heading">
    <span class="source-page-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 9l5 3-5 3z"/></svg>
    </span>
    <span class="source-page-copy">
      <strong id="pageTitle">爆款视频播放复盘</strong>
      <small id="reportDateSub">视频复盘</small>
    </span>
  </div>
  <div class="header-actions">
    <a id="backLink" class="btn-ghost" href="/report">← 返回日报</a>
    <div class="pl-pager">
      <button id="prevVideoBtn" type="button" title="上一个">←</button>
      <span id="videoPosition">- / -</span>
      <button id="nextVideoBtn" type="button" title="下一个">→</button>
    </div>
    <button id="translateBtn" type="button" class="btn-ghost">翻译解析</button>
    <span class="pill" id="datePill">-</span>
    <a id="originLink" target="_blank" class="btn-ghost" rel="noopener noreferrer">原视频链接</a>
  </div>
</header>
<div class="ui-main">
  <div class="pl-shell">
    <aside class="pl-rail">
      <div class="pl-stage">
        <video id="video" playsinline></video>
        <div class="pl-controls">
          <button id="playBtn" type="button">▶</button>
          <input id="seek" type="range" min="0" max="1000" value="0">
          <span id="videoClock">00:00</span>
        </div>
      </div>
      <div>
        <div class="pl-title" id="videoTitleSide">加载中...</div>
        <div class="pl-stats" id="stats"></div>
      </div>
      <div class="pl-facts">
        <div><span>作者</span><b id="factAuthor">-</b></div>
        <div><span>平台</span><b id="factPlatform">-</b></div>
        <div><span>发布</span><b id="factPublish">-</b></div>
      </div>
    </aside>

    <main class="pl-main">
      <div class="card">
        <div class="sect-head"><b>当前时间段解析</b><span id="timecode" class="timecode">00:00</span></div>
        <div class="card-body-scroll" id="currentSegment"><div class="empty">等待视频加载。</div></div>
      </div>
      <div class="card">
        <div class="sect-head"><b>总体爆款拆解</b><span id="rankPill" class="timecode"></span></div>
        <div class="card-body-scroll" id="deepDive"><div class="empty">暂无拆解内容。</div></div>
      </div>
    </main>
  </div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
let currentReport=null,currentVideo=null,currentTimeline=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function safeAuthor(v){
  if(!v)return "未知";
  if(typeof v==="object")return esc(v.nickname||v.name||v.unique_id||v.uniqueId||"未知");
  return esc(String(v));
}
function fmtMd(v){return esc(v).replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")}
function fmtNum(n){n=Number(n||0);if(n>=1e8)return (n/1e8).toFixed(1)+"亿";if(n>=1e4)return (n/1e4).toFixed(1)+"万";return String(n||0)}
function fmtClock(s){s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=Math.floor(s%60);return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`}

function syncVideoControls(){
  const vid=$("video"),seek=$("seek"),btn=$("playBtn"),clock=$("videoClock");
  if(!vid||!seek||!btn||!clock)return;
  const duration=Number(vid.duration||0),cur=Number(vid.currentTime||0);
  seek.value=duration?String(Math.round(cur/duration*1000)):"0";
  btn.textContent=vid.paused?"▶":"Ⅱ";
  clock.textContent=duration?`${fmtClock(cur)} / ${fmtClock(duration)}`:fmtClock(cur);
}

function setupVideoControls(){
  const vid=$("video"),seek=$("seek"),btn=$("playBtn");
  if(!vid||!seek||!btn)return;
  const toggle=()=>{if(vid.paused)vid.play().catch(()=>{});else vid.pause()};
  btn.onclick=toggle;
  vid.onclick=toggle;
  seek.oninput=()=>{if(Number(vid.duration||0))vid.currentTime=Number(seek.value)/1000*vid.duration};
  ["play","pause","timeupdate","durationchange","loadedmetadata"].forEach(name=>vid.addEventListener(name,syncVideoControls));
}

const KEY_LABELS={index:"序号",time_range:"时间段",timeRange:"时间段",timestamp:"时间点",time:"时间",visual:"画面解析",audio:"声音/台词",transcript:"字幕/转写",summary:"摘要",video_description:"视频描述",description:"描述",scene:"场景",title:"标题"};
const LINE_LABELS={"Frame":"帧","Setting/Scene":"场景/环境","Action/Movement":"动作/运动","New Information":"新增信息","Continuity Points":"连贯信息","Key continuation points":"后续关注点","Visual":"画面","Audio":"声音","Text":"画面文字","Objects":"关键物体","People":"人物","Camera":"镜头","Mood":"情绪氛围"};
function labelOf(k){return KEY_LABELS[k]||k}
function localizeText(v){let s=String(v||"").replace(/^```[a-zA-Z]*\s*/,"").replace(/\s*```$/,"").trim();for(const [en,zh] of Object.entries(LINE_LABELS)){s=s.replace(new RegExp(`(^|\\n)${en}:`,"g"),`$1${zh}：`)}return s.replace(/(^|\n)Frame\s+(\d+)\s+\(([^)]+)\)/g,"$1帧 $2（$3）").replace(/\bseconds?\b/g,"秒")}
function parseTime(v){const s=String(v||"").trim();let m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m){const a=Number(m[1]),b=Number(m[2]),c=m[3]==null?null:Number(m[3]);return c==null?a*60+b:a*3600+b*60+c}m=s.match(/(\d+(?:\.\d+)?)\s*s/i);if(m)return Number(m[1]);m=s.match(/^\d+(?:\.\d+)?$/);return m?Number(m[0]):null}
function rangeOf(item,index,body=""){const raw=item?.time_range||item?.timeRange||item?.timestamp||item?.time||"";const parts=String(raw).split(/\s*(?:-|–|—|~|至|到)\s*/);let start=parseTime(parts[0]),end=parseTime(parts[1]);if(start==null){const m=String(body).match(/(?:Frame|帧)\s*\d+[^\d]{0,20}(\d+(?:\.\d+)?)\s*(?:s|seconds?|秒)/i)||String(body).match(/(?:at|在)\s*(\d+(?:\.\d+)?)\s*(?:s|seconds?|秒)/i);if(m)start=Number(m[1])}if(start==null)start=index;if(end==null||end<=start)end=start+1;return {start,end,label:raw||fmtClock(start)}}
function textOf(value){if(value==null)return "";if(typeof value==="string")return localizeText(value);if(Array.isArray(value))return value.map(textOf).filter(Boolean).join("\n");if(typeof value==="object"){return Object.entries(value).filter(([k,v])=>!["start","end"].includes(k)&&v!=null&&v!==""&&k!=="time_range").map(([k,v])=>`${labelOf(k)}：${textOf(v)}`).join("\n")}return String(value)}
function timelineFromAnalysis(analysis){const items=[];const raw=analysis?.timeline||analysis?.segments||analysis?.frame_analyses||[];if(Array.isArray(raw)){raw.forEach((item,i)=>{const body=textOf(item),r=rangeOf(item,i,body);items.push({...r,title:item?.title||item?.scene||item?.time_range||item?.timestamp||`片段 ${i+1}`,body})})}return items.filter(x=>x.body)}

function deepDiveFor(report,video,index){
  if(video?.audit_result){
    if(typeof video.audit_result==="string")return video.audit_result;
    if(typeof video.audit_result==="object"){
      return Object.entries(video.audit_result)
        .map(([k,v])=>`- **${k}**: ${typeof v==="object"?JSON.stringify(v):v}`)
        .join("\n\n");
    }
  }
  const dives = report?.video_deep_dives || [];
  if (Array.isArray(dives) && dives.length) {
    const rank = Number(video?.report_rank || index + 1);
    const title = String(video?.title || "").slice(0, 24);
    const match = dives.find(x => String(x).includes(`视频 ${rank}`)) ||
                  dives.find(x => title && String(x).includes(title)) ||
                  dives[index] || dives[0];
    if (match) return typeof match === "object" ? JSON.stringify(match, null, 2) : String(match);
  }
  if (typeof report?.video_deep_dives === "string") return report.video_deep_dives;
  const analysis = video?.analysis_zh || video?.analysis;
  if (analysis?.summary) return analysis.summary;
  return "";
}

// Timeline Chip Rendering: Chips show ONLY timecode label
function renderSegment(segment,all,currentTime){
  $("timecode").textContent=fmtClock(currentTime);
  if(!all.length){$("currentSegment").innerHTML='<div class="empty">暂无时间轴解析，展示解析摘要。</div>';return}
  const html=`
    <div class="seg-current">
      <b>${esc(segment.label||segment.title)}</b>
      <p>${fmtMd(segment.body)}</p>
    </div>
    <div class="tl-list">
      ${all.map((x,i)=>`<span class="tl-chip ${x===segment?'active':''}" data-i="${i}">${esc(x.label)}</span>`).join("")}
    </div>
  `;
  $("currentSegment").innerHTML=html;
  document.querySelectorAll(".tl-chip").forEach(el=>el.onclick=()=>{
    const item=all[Number(el.dataset.i)];
    if(item){$("video").currentTime=item.start;$("video").play().catch(()=>{});renderSegment(item,all,item.start)}
  });
}

function isCachedRebuiltReport(){
  const summary=String(currentReport?.report?.summary||currentReport?.report_markdown||"");
  return summary.includes("未沿用旧的逐条画面解析文本")||summary.includes("缓存重建");
}
function hasTrustedTimeline(video){
  const ids=currentReport?.report?.timeline_trusted_video_ids;
  return Array.isArray(ids)&&ids.map(String).includes(String(video?.video_id||""));
}
function cachedTimelineFallback(video){
  const m=video?.metrics||{};
  const rows=[`视频 ID：${video?.video_id||""}`,`标题：${video?.title||""}`,`来源：${video?.source_label||""}`,`播放：${fmtNum(m.play_count)}，点赞：${fmtNum(m.like_count)}，评论：${fmtNum(m.comment_count)}，分享：${fmtNum(m.share_count)}，热度：${fmtNum(video?.hot_score)}`,"旧时间轴画面解析疑似错配，已隐藏；这里保留已确认绑定的视频身份和互动数据。"];
  return [{start:0,end:999999,label:"缓存重建摘要",title:"缓存重建摘要",body:rows.filter(Boolean).join("\n")}];
}
function buildTimeline(video){
  if(isCachedRebuiltReport()&&!hasTrustedTimeline(video))return cachedTimelineFallback(video);
  const analysis=video.analysis_zh||video.analysis;
  const timeline=timelineFromAnalysis(analysis);
  const fallback=textOf(analysis?.summary||analysis?.video_description||analysis?.transcript?.text);
  if(!timeline.length&&fallback)timeline.push({start:0,end:999999,label:"解析摘要",title:"解析摘要",body:fallback});
  return timeline;
}

function refreshTimeline(){
  currentTimeline=buildTimeline(currentVideo||{});
  const t=$("video").currentTime||0;
  const seg=currentTimeline.find(x=>t>=x.start&&t<x.end)||currentTimeline[0];
  renderSegment(seg,currentTimeline,t);
}

function playerUrl(video){
  const query=new URLSearchParams({date:currentReport?.report_date||params.get("date")||"",platform:String(video?.platform||""),video_id:String(video?.video_id||"")});
  return `/report/player?${query}`;
}

function setupPager(videos,index){
  const prev=$("prevVideoBtn"),next=$("nextVideoBtn");
  $("videoPosition").textContent=`${index+1} / ${videos.length}`;
  prev.disabled=index<=0;
  next.disabled=index<0||index>=videos.length-1;
  prev.onclick=()=>{if(index>0)location.assign(playerUrl(videos[index-1]))};
  next.onclick=()=>{if(index+1<videos.length)location.assign(playerUrl(videos[index+1]))};
}

async function translateCurrent(){
  if(!currentReport||!currentVideo)return;
  const btn=$("translateBtn"),force=Boolean(currentVideo.analysis_zh);
  btn.disabled=true;
  btn.textContent="翻译中...";
  try{
    const r=await fetch("/api/report/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:currentReport.report_date,platform:currentVideo.platform,video_id:currentVideo.video_id,force})});
    const payload=await r.json();
    if(!r.ok)throw new Error(payload.error||"翻译失败");
    currentVideo.analysis_zh=payload.analysis_zh;
    btn.textContent=payload.status==="cached"?"已加载中文":"已翻译";
    refreshTimeline();
  }catch(e){
    btn.textContent=e.message||"翻译失败";
  }finally{
    setTimeout(()=>{btn.disabled=false;if(currentVideo?.analysis_zh)btn.textContent="重新加载中文";},1600);
  }
}

async function main(){
  const date=params.get("date")||"",platform=params.get("platform")||"",videoId=params.get("video_id")||"";
  const url=`/api/report?raw=1${date?`&date=${encodeURIComponent(date)}`:""}`;
  const data=await (await fetch(url)).json();
  currentReport=data;
  const videos=(Array.isArray(data.videos)?data.videos:[]).map((video,index)=>({video,index})).sort((a,b)=>Number(a.video?.report_rank||a.index+1)-Number(b.video?.report_rank||b.index+1)).map(row=>row.video);
  const video=videos.find(v=>String(v.platform)===platform&&String(v.video_id)===videoId)||videos[0];
  currentVideo=video;
  if(!video){$("pageTitle").textContent="未找到视频";return}
  const idx=videos.indexOf(video),m=video.metrics||{};
  setupPager(videos,idx);

  const authorName=safeAuthor(video.author);
  $("pageTitle").textContent=video.title||"爆款视频播放复盘";
  if($("videoTitleSide"))$("videoTitleSide").textContent=video.title||"无标题";
  $("reportDateSub").textContent=`视频复盘 · ${data.report_date||date||"-"}`;
  $("datePill").textContent=data.report_date||date||"-";
  $("backLink").href=`/report${data.report_date?`?date=${encodeURIComponent(data.report_date)}`:""}`;
  $("rankPill").textContent=`排名 ${video.report_rank||idx+1}`;

  $("factAuthor").textContent=authorName;
  $("factPlatform").textContent=video.platform||"-";
  $("factPublish").textContent=m.published_at?new Date(m.published_at*1000).toLocaleDateString("zh-CN"):"-";

  $("stats").innerHTML=[["播放",m.play_count],["点赞",m.like_count],["评论",m.comment_count],["分享",m.share_count],["热度",video.hot_score]].map(x=>`<span class="${x[0]==='热度'?'hot':''}">${x[0]} ${fmtNum(x[1])}</span>`).join("");
  if(video.source_url){
    $("originLink").textContent="原视频链接";
    $("originLink").href=video.source_url;
  }else $("originLink").style.display="none";

  if(video.local_filename)$("video").src=`/video/${encodeURIComponent(video.local_filename)}`;
  const deep=deepDiveFor(data.report,video,idx);
  $("deepDive").innerHTML=deep?fmtMd(deep):'<div class="empty">暂无该视频总体拆解。</div>';

  setupVideoControls();
  currentTimeline=buildTimeline(video);
  function update(){
    const t=$("video").currentTime||0;
    const seg=currentTimeline.find(x=>t>=x.start&&t<x.end)||currentTimeline[0];
    renderSegment(seg,currentTimeline,t);
  }
  $("video").addEventListener("timeupdate",update);
  $("video").addEventListener("loadedmetadata",update);
  $("translateBtn").onclick=translateCurrent;
  if(video.analysis_zh)$("translateBtn").textContent="已加载中文";
  syncVideoControls();
  update();
}

main().catch(err=>{$("pageTitle").textContent=err.message;$("currentSegment").innerHTML=`<div class="empty">${esc(err.message)}</div>`});
</script>
</body>
</html>
