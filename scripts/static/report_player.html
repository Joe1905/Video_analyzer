<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆款视频播放分析</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#0f172a;--muted:#64748b;--soft:#f8fafc;--line:#e5e7eb;--blue:#2563eb;--blueSoft:#eff6ff;--green:#059669;--shadow:0 1px 2px rgba(15,23,42,.04),0 18px 42px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}button{font:inherit;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#fff;color:var(--text);cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
header{height:60px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand a{color:var(--muted);font-size:13px}.brand h1{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:var(--blueSoft);color:var(--blue);font-weight:750}
.layout{height:calc(100vh - 60px);padding:16px;display:grid;grid-template-columns:minmax(340px,540px) minmax(520px,1fr);gap:16px;overflow:hidden}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.player{display:grid;grid-template-rows:auto auto;align-self:start;justify-self:center;width:fit-content;max-width:100%}.video-wrap{display:block;background:#0b1220;padding:18px;overflow:hidden}.video-wrap video{display:block;width:auto;height:min(72vh,760px);max-width:calc(100vw - 72px);object-fit:contain;border-radius:12px;background:#000}.video-meta{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}.video-meta h2{font-size:16px;line-height:1.45}.stats{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.stats span{height:24px;display:inline-flex;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:#fff}
.analysis{display:grid;grid-template-rows:minmax(270px,42%) minmax(0,1fr);gap:16px;overflow:hidden}.section{display:grid;grid-template-rows:auto minmax(0,1fr)}.section-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff}.section-head h2{font-size:14px}.timecode{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.content{padding:16px 18px;overflow:auto;color:#263244;font-size:14px;white-space:pre-wrap}.content strong{font-weight:850;color:#0f172a}.segment-title{font-size:15px;font-weight:850;margin-bottom:10px}.current-card{border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:12px;background:linear-gradient(180deg,#eff6ff,#fff);padding:14px 15px;box-shadow:0 10px 24px rgba(37,99,235,.08)}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:28px}.timeline-list{display:grid;gap:10px}.timeline-item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;transition:.15s ease}.timeline-item.active{border-color:#93c5fd;background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.10) inset}.timeline-item b{display:block;margin-bottom:5px;font-size:12px;color:var(--blue)}
@media(max-width:980px){.layout{height:auto;overflow:visible;grid-template-columns:1fr}.player{width:fit-content;max-width:100%}.video-wrap video{height:auto;max-height:78vh;max-width:calc(100vw - 68px)}.analysis{grid-template-rows:auto auto}.section{min-height:320px}}
</style>
</head>
<body>
<header>
  <div class="brand"><a id="backLink" href="/report">返回日报</a><h1 id="pageTitle">爆款视频播放分析</h1></div>
  <div class="meta"><span id="datePill" class="pill">-</span><a id="originLink" target="_blank" rel="noopener noreferrer"></a></div>
</header>
<main class="layout">
  <section class="panel player">
    <div class="video-wrap"><video id="video" controls playsinline></video></div>
    <div class="video-meta">
      <h2 id="videoTitle">加载中...</h2>
      <div id="stats" class="stats"></div>
    </div>
  </section>
  <aside class="analysis">
    <section class="panel section">
      <div class="section-head"><h2>当前时间段解析</h2><span id="timecode" class="timecode">00:00</span></div>
      <div id="currentSegment" class="content"><div class="empty">等待视频加载。</div></div>
    </section>
    <section class="panel section">
      <div class="section-head"><h2>总体爆款拆解</h2><span id="rankPill" class="timecode"></span></div>
      <div id="deepDive" class="content"><div class="empty">暂无拆解内容。</div></div>
    </section>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtMd(v){return esc(v).replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")}
function fmtNum(n){n=Number(n||0);if(n>=1e8)return (n/1e8).toFixed(1)+"亿";if(n>=1e4)return (n/1e4).toFixed(1)+"万";return String(n||0)}
function fmtClock(s){s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=Math.floor(s%60);return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`}
const KEY_LABELS={index:"序号",time_range:"时间段",timeRange:"时间段",timestamp:"时间点",time:"时间",visual:"画面解析",audio:"声音/台词",transcript:"字幕/转写",summary:"摘要",video_description:"视频描述",description:"描述",scene:"场景",title:"标题"};
const LINE_LABELS={"Frame":"帧","Setting/Scene":"场景/环境","Action/Movement":"动作/运动","New Information":"新增信息","Continuity Points":"连贯信息","Key continuation points":"后续关注点","Visual":"画面","Audio":"声音","Text":"画面文字","Objects":"关键物体","People":"人物","Camera":"镜头","Mood":"情绪氛围"};
function labelOf(k){return KEY_LABELS[k]||k}
function localizeText(v){let s=String(v||"").replace(/^```[a-zA-Z]*\s*/,"").replace(/\s*```$/,"").trim();for(const [en,zh] of Object.entries(LINE_LABELS)){s=s.replace(new RegExp(`(^|\\n)${en}:`,"g"),`$1${zh}：`)}return s.replace(/(^|\n)Frame\s+(\d+)\s+\(([^)]+)\)/g,"$1帧 $2（$3）").replace(/\bseconds?\b/g,"秒")}
function parseTime(v){const s=String(v||"").trim();let m=s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m){const a=Number(m[1]),b=Number(m[2]),c=m[3]==null?null:Number(m[3]);return c==null?a*60+b:a*3600+b*60+c}m=s.match(/(\d+(?:\.\d+)?)\s*s/i);if(m)return Number(m[1]);m=s.match(/^\d+(?:\.\d+)?$/);return m?Number(m[0]):null}
function rangeOf(item,index){const raw=item?.time_range||item?.timeRange||item?.timestamp||item?.time||"";const parts=String(raw).split(/\s*(?:-|–|—|~|至|到)\s*/);let start=parseTime(parts[0]),end=parseTime(parts[1]);if(start==null)start=index*5;if(end==null||end<=start)end=start+5;return {start,end,label:raw||`${fmtClock(start)}-${fmtClock(end)}`}}
function textOf(value){if(value==null)return "";if(typeof value==="string")return localizeText(value);if(Array.isArray(value))return value.map(textOf).filter(Boolean).join("\n");if(typeof value==="object"){return Object.entries(value).filter(([k,v])=>!["start","end"].includes(k)&&v!=null&&v!==""&&k!=="time_range").map(([k,v])=>`${labelOf(k)}：${textOf(v)}`).join("\n")}return String(value)}
function timelineFromAnalysis(analysis){const items=[];const raw=analysis?.timeline||analysis?.segments||analysis?.frame_analyses||[];if(Array.isArray(raw)){raw.forEach((item,i)=>{const r=rangeOf(item,i);items.push({...r,title:item?.title||item?.scene||item?.time_range||item?.timestamp||`片段 ${i+1}`,body:textOf(item)})})}return items.filter(x=>x.body)}
function deepDiveFor(report,video,index){const dives=report?.video_deep_dives||[];if(!dives.length)return "";const rank=Number(video?.report_rank||index+1);const title=String(video?.title||"").slice(0,24);return dives.find(x=>String(x).includes(`视频 ${rank}`))||dives.find(x=>title&&String(x).includes(title))||dives[index]||dives[0]||""}
function renderSegment(segment,all,currentTime){$("timecode").textContent=fmtClock(currentTime);if(!all.length){$("currentSegment").innerHTML='<div class="empty">暂无时间轴解析，展示解析摘要。</div>';return}const html=`<div class="current-card"><div class="segment-title">${esc(segment.label||segment.title)}</div>${fmtMd(segment.body)}</div><div class="timeline-list" style="margin-top:16px">${all.map((x,i)=>`<div class="timeline-item ${x===segment?'active':''}" data-i="${i}"><b>${esc(x.label)}</b>${fmtMd(String(x.body).slice(0,260))}</div>`).join("")}</div>`;$("currentSegment").innerHTML=html;document.querySelectorAll(".timeline-item").forEach(el=>el.onclick=()=>{const item=all[Number(el.dataset.i)];if(item){$("video").currentTime=item.start;$("video").play().catch(()=>{});renderSegment(item,all,item.start)}});document.querySelector(".timeline-item.active")?.scrollIntoView({block:"nearest"})}
async function main(){const date=params.get("date")||"",platform=params.get("platform")||"",videoId=params.get("video_id")||"";const url=`/api/report?raw=1${date?`&date=${encodeURIComponent(date)}`:""}`;const data=await (await fetch(url)).json();const videos=Array.isArray(data.videos)?data.videos:[];const video=videos.find(v=>String(v.platform)===platform&&String(v.video_id)===videoId)||videos[0];if(!video){$("videoTitle").textContent="未找到视频";return}const idx=videos.indexOf(video),m=video.metrics||{};$("pageTitle").textContent=video.title||"爆款视频播放分析";$("videoTitle").textContent=video.title||"无标题";$("datePill").textContent=data.report_date||date||"-";$("backLink").href=`/report${data.report_date?`?date=${encodeURIComponent(data.report_date)}`:""}`;$("rankPill").textContent=`排名 ${video.report_rank||idx+1}`;$("stats").innerHTML=[["播放",m.play_count],["点赞",m.like_count],["评论",m.comment_count],["分享",m.share_count],["热度",video.hot_score]].map(x=>`<span>${x[0]} ${fmtNum(x[1])}</span>`).join("");if(video.source_url){$("originLink").textContent="原视频链接";$("originLink").href=video.source_url}else $("originLink").style.display="none";if(video.local_filename)$("video").src=`/video/${encodeURIComponent(video.local_filename)}`;const timeline=timelineFromAnalysis(video.analysis);const fallback=textOf(video.analysis?.summary||video.analysis?.video_description||video.analysis?.transcript?.text);if(!timeline.length&&fallback){timeline.push({start:0,end:999999,label:"解析摘要",title:"解析摘要",body:fallback})}const deep=deepDiveFor(data.report,video,idx);$("deepDive").innerHTML=deep?fmtMd(deep):'<div class="empty">暂无该视频总体拆解。</div>';const vid=$("video");function update(){const t=vid.currentTime||0;const seg=timeline.find(x=>t>=x.start&&t<x.end)||timeline[0];renderSegment(seg,timeline,t)}vid.addEventListener("timeupdate",update);vid.addEventListener("loadedmetadata",update);update()}
main().catch(err=>{$("videoTitle").textContent=err.message;$("currentSegment").innerHTML=`<div class="empty">${esc(err.message)}</div>`});
</script>
</body>
</html>
