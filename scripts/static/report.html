<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日热点视频报告</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--border2:#f1f5f9;--brand:#2563eb;--brand2:#1d4ed8;--brand-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;--radius:10px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
button{border:1px solid transparent;border-radius:8px;min-height:36px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
button:hover{background:var(--brand2)}button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#fff;color:var(--brand);border-color:var(--border)}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3;backdrop-filter:blur(16px)}
h1{font-size:18px}.app-nav{height:48px;display:flex;align-items:center;gap:4px;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;padding:4px;border:1px solid #e5e7eb;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.03);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-x:auto;scrollbar-width:none}.app-nav::-webkit-scrollbar{display:none}.app-nav__item{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid transparent;border-radius:10px;color:#64748b;text-decoration:none;font-size:13px;font-weight:650;line-height:1;white-space:nowrap;transition:background-color .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease}.app-nav__item svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:0 0 18px;transition:stroke .16s ease}.app-nav__item:hover{background:#f8fafc;color:#334155;border-color:#eef2f7}.app-nav__item:hover svg{stroke:#64748b}.app-nav__item:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.14)}.app-nav__item.active{background:#eff6ff;color:#2563eb;border-color:#bfdbfe;box-shadow:inset 0 0 0 1px rgba(37,99,235,.05)}.app-nav__item.active svg{stroke:#2563eb}.app-nav__label{line-height:1}@media(max-width:760px){.app-nav{height:46px;max-width:100%;gap:3px}.app-nav__item{height:36px;padding:0 11px}.app-nav__label{display:none}}@media(prefers-color-scheme:dark){.app-nav{background:rgba(15,23,42,.88);border-color:#1f2937;box-shadow:0 1px 2px rgba(0,0,0,.18)}.app-nav__item{color:#94a3b8}.app-nav__item svg{stroke:#64748b}.app-nav__item:hover{background:#111827;color:#e5e7eb;border-color:#243042}.app-nav__item:hover svg{stroke:#cbd5e1}.app-nav__item.active{background:#1d4ed8;color:#fff;border-color:#2563eb}.app-nav__item.active svg{stroke:#fff}}
main{padding:20px;display:grid;gap:16px;max-width:1280px;margin:0 auto}
.hero,.panel,.video{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.hero{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.hero h2{font-size:22px;margin-bottom:6px}.muted{color:var(--text2);font-size:13px}.status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--border2);color:var(--text2)}.status.complete{background:var(--green-soft);color:var(--green)}.status.failed{background:var(--red-soft);color:var(--red)}.status.missing{background:var(--amber-soft);color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.metric{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fff}.metric span{display:block;color:var(--text2);font-size:12px;font-weight:700}.metric b{display:block;margin-top:4px;font-size:16px}
.panel{padding:16px}.panel h3{font-size:15px;margin-bottom:10px}.sources{display:flex;flex-wrap:wrap;gap:8px}.source{border:1px solid var(--border);border-radius:999px;background:var(--border2);padding:5px 9px;color:var(--text2);font-size:12px;font-weight:700}
.videos{display:grid;gap:10px}.video{padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start}.rank{width:40px;height:40px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900}.video h3{font-size:15px;margin-bottom:5px;word-break:break-word}.video-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--text2);font-size:12px}.video-meta span{border:1px solid var(--border);border-radius:999px;padding:3px 7px;background:#fff}.score{text-align:right;font-weight:900;color:var(--brand)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.raw{display:none;grid-column:1/-1;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;overflow:auto;white-space:pre-wrap;font:12px/1.55 Consolas,monospace}.raw.show{display:block}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;color:var(--text2);background:#fff}
@media(max-width:760px){.hero{display:grid}.video{grid-template-columns:40px minmax(0,1fr)}.score{grid-column:1/-1;text-align:left}.actions{justify-content:flex-start}header{padding:0 14px}.app-nav__item{padding:6px 8px}.app-nav__label{display:none}}
</style>
</head>
<body>
<header><h1>每日热点视频报告</h1><nav class="app-nav" aria-label="主导航"><a class="app-nav__item" href="/" title="AI 聊天"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span class="app-nav__label">首页</span></a><a class="app-nav__item active" href="/report" title="每日报告"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M10 12h6"/><path d="M10 16h4"/></svg><span class="app-nav__label">日报</span></a><a class="app-nav__item" href="/amazon" title="Amazon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/></svg><span class="app-nav__label">Amazon</span></a><a class="app-nav__item" href="/shop" title="Shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M5 11h14"/></svg><span class="app-nav__label">Shop</span></a><a class="app-nav__item" href="/metrics" title="数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M20 19H4"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-7"/></svg><span class="app-nav__label">数据</span></a><a class="app-nav__item" href="/extract" title="视频分析"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m10 9 5 3-5 3z"/><path d="M8 21h8"/><path d="M12 19v2"/></svg><span class="app-nav__label">分析</span></a></nav></header>
<main>
  <section class="hero">
    <div>
      <h2 id="title">今日热点报告</h2>
      <div id="summary" class="muted">正在加载...</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="status" class="status">loading</span>
      <button id="run">生成今日报告</button>
    </div>
  </section>
  <section class="stats" id="stats"></section>
  <section class="panel">
    <h3>采集来源</h3>
    <div id="sources" class="sources"></div>
  </section>
  <section class="videos" id="videos"></section>
</main>
<script>
const $=id=>document.getElementById(id);
let current=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtTime(ts){return ts?new Date(ts*1000).toLocaleString("zh-CN",{hour12:false}):"-"}
function metric(label,value){return `<div class="metric"><span>${esc(label)}</span><b>${esc(value??"-")}</b></div>`}
function statusLabel(s){return {complete:"已生成",failed:"生成失败",missing:"待生成",running:"生成中"}[s]||s}
function render(data){
  current=data;
  const exists=!!data.exists;
  const status=data.status||"missing";
  $("status").className="status "+status;
  $("status").textContent=statusLabel(status);
  $("title").textContent=`${data.report_date||""} 热点视频报告`;
  $("run").disabled=status==="running";
  $("summary").textContent=exists?`更新时间：${fmtTime(data.updated_at)}，区域：${data.region||"-"}，视频数：${data.video_count||0}${data.error?"，错误："+data.error:""}`:"今日还没有生成热点报告。";
  const videos=Array.isArray(data.videos)?data.videos:[];
  $("stats").innerHTML=[
    metric("状态",statusLabel(status)),
    metric("视频数",videos.length),
    metric("区域",data.region||"-"),
    metric("更新时间",fmtTime(data.updated_at))
  ].join("");
  const sources=Array.isArray(data.sources)?data.sources:[];
  $("sources").innerHTML=sources.length?sources.map(s=>`<span class="source">${esc(s.label||s.endpoint)} ${esc(s.params?JSON.stringify(s.params):"")}</span>`).join(""):`<span class="muted">暂无采集来源</span>`;
  if(!videos.length){
    $("videos").innerHTML=`<div class="empty">${status==="failed"?"报告生成失败，请检查 SociaVault 配置或日志。":"暂无热点视频，点击生成今日报告。"}</div>`;
    return;
  }
  $("videos").innerHTML=videos.map((v,i)=>{
    const m=v.metrics||{};
    return `<article class="video">
      <div class="rank">${i+1}</div>
      <div>
        <h3>${esc(v.title||"(无标题)")}</h3>
        <div class="video-meta">
          ${v.author?`<span>@${esc(v.author)}</span>`:""}
          <span>播放 ${esc(m.play_count||0)}</span><span>赞 ${esc(m.like_count||0)}</span><span>评 ${esc(m.comment_count||0)}</span><span>转 ${esc(m.share_count||0)}</span><span>藏 ${esc(m.favorite_count||0)}</span>
          <span>${esc(v.source_label||v.source_endpoint||"")}</span>
        </div>
        <div class="actions">
          ${v.source_url?`<a href="${esc(v.source_url)}" target="_blank" rel="noopener noreferrer"><button class="secondary">原始链接</button></a>`:""}
          <button class="secondary" onclick="toggleRaw(${i})">原始 JSON</button>
        </div>
      </div>
      <div class="score">热度分<br>${esc(v.hot_score||0)}</div>
      <pre class="raw" id="raw-${i}">${esc(JSON.stringify(v.raw||{},null,2))}</pre>
    </article>`;
  }).join("");
}
function toggleRaw(i){$("raw-"+i)?.classList.toggle("show")}
async function loadToday(){const r=await fetch("/api/report/today?raw=1");const data=await r.json();render(data)}
async function runReport(){
  $("run").disabled=true;
  $("status").className="status running";
  $("status").textContent="生成中";
  try{
    const r=await fetch("/api/report/run",{method:"POST"});
    const data=await r.json();
    render(data);
  }catch(e){
    $("summary").textContent=e.message;
  }finally{
    $("run").disabled=false;
  }
}
$("run").onclick=runReport;
loadToday().catch(e=>{$("summary").textContent=e.message;$("status").textContent="加载失败"});
</script>
</body>
</html>
