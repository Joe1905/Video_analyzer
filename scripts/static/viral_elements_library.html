<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已审核元素 · 内置表格</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#172033;background:#f5f7fb;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:white;padding:16px 24px;border-bottom:1px solid #e4e9f2}h1{font-size:20px;margin:0}header p{margin:3px 0;color:#6b778c;font-size:12px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}a,button{color:#2563eb;text-decoration:none;border:1px solid #dce4f0;background:white;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}a[aria-disabled=true]{color:#8491a6;cursor:not-allowed}main{padding:20px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:9px 12px;border:1px solid #dce4f0;border-radius:8px;background:white;font:inherit;max-width:100%}input{width:340px}#count{color:#6b778c}.grid{overflow:auto;max-height:calc(100vh - 205px);border:1px solid #e4e9f2;border-radius:10px;background:white}table{width:100%;min-width:1050px;border-collapse:separate;border-spacing:0;table-layout:fixed}th{position:sticky;top:0;background:#edf2f9;z-index:1;text-align:left;color:#46546b;font-size:12px}td,th{padding:12px;border-bottom:1px solid #e4e9f2;vertical-align:top}td{overflow-wrap:anywhere;white-space:pre-wrap}tbody tr:hover{background:#f8fbff}td a{display:inline;border:0;padding:0;word-break:break-all}#notice{color:#6b778c;margin:12px 0}#error{color:#bd3344}[hidden]{display:none!important}@media(max-width:600px){header{padding:14px}main{padding:12px}.actions{margin-left:0}.grid{max-height:65vh}input{width:100%}}
</style></head><body><header><div><h1>已审核元素 · 内置表格</h1><p>同一份审核数据，独立浏览；不改变飞书同步状态。</p></div><div class="actions"><a href="/viral-elements">返回视频审核</a><a id="feishuTableLink" target="_blank" rel="noopener noreferrer" aria-disabled="true">打开飞书多维表</a><button id="refresh">刷新表格</button></div></header>
<main><div class="toolbar"><input id="search" aria-label="搜索元素" placeholder="搜索文件名、元素或内容"><select id="group" aria-label="筛选分组"><option value="">全部分组</option></select><span id="count" role="status">正在加载…</span></div><div id="error" role="alert"></div><div class="grid"><table><thead><tr><th style="width:200px">来源视频</th><th style="width:75px">分组</th><th style="width:125px">元素</th><th style="width:420px">已审核内容</th><th style="width:85px">置信度</th><th style="width:130px">证据时间</th><th style="width:170px">更新时间</th></tr></thead><tbody id="rows"></tbody></table></div><p id="notice"></p></main>
<script>
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let items=[];
function render(){const q=el('search').value.trim().toLowerCase(),group=el('group').value;const shown=items.filter(x=>(!group||x.group_label===group)&&(!q||[x.filename,x.label,x.value].join(' ').toLowerCase().includes(q)));el('rows').innerHTML=shown.map(x=>`<tr><td><a href="/viral-elements?filename=${encodeURIComponent(x.filename)}">${esc(x.filename)}</a></td><td>${esc(x.group_label)}</td><td>${esc(x.label)}</td><td>${esc(x.value)}</td><td>${Math.round((Number(x.confidence)||0)*100)}%</td><td>${esc(x.time_range||'—')}</td><td>${esc(x.updated_at?new Date(x.updated_at).toLocaleString():'—')}</td></tr>`).join('');el('count').textContent=`${shown.length} 项已审核元素 · ${new Set(shown.map(x=>x.filename)).size} 个视频`;el('notice').textContent=!items.length?'暂无已审核元素，请在视频审核页勾选通过并保存。':!shown.length?'没有匹配结果。':items.length>=1000?'当前展示最近 1000 项已审核元素。':'点击来源视频可返回对应审核记录。';}
async function load(){el('refresh').disabled=true;el('error').textContent='';try{const r=await fetch('/api/viral-elements/library?approved_only=1&limit=1000');if(!r.ok)throw Error('元素表加载失败，请刷新重试');const data=await r.json();items=data.items||[];const previous=el('group').value;el('group').innerHTML='<option value="">全部分组</option>'+[...new Set(items.map(x=>x.group_label).filter(Boolean))].map(g=>`<option>${esc(g)}</option>`).join('');el('group').value=previous;render();}catch(e){el('error').textContent=e.message;el('count').textContent='加载失败';}finally{el('refresh').disabled=false}}
el('refresh').onclick=load;el('search').oninput=render;el('group').onchange=render;load();
</script><script src="/assets/viral_feishu_link.js?v=1"></script></body></html>
