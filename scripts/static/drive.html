<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>云盘 · 我的文件</title>
<link rel="stylesheet" href="/assets/user-drive.css?v=__UI_ASSET_VERSION__">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#263548;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}
.drive-header{height:68px;display:flex;align-items:center;gap:20px;padding:0 24px;background:#fff;border-bottom:1px solid #e9edf0}.drive-header strong{font-size:18px;white-space:nowrap}.drive-header .app-nav{margin-left:auto;min-width:0}.drive-account{border:1px solid #e3e7eb;border-radius:10px;background:#fff;padding:8px 12px;white-space:nowrap}
#driveMount{height:calc(var(--app-height,100dvh) - 68px);padding:24px;min-height:0}
.drive-login{border:0;border-radius:20px;padding:0;width:min(480px,calc(100vw - 28px));max-height:calc(var(--app-height,100dvh) - 28px);color:#263548;box-shadow:0 28px 100px #14233630}.drive-login[open]{display:flex;flex-direction:column}.drive-login::backdrop{background:#18283870;backdrop-filter:blur(5px)}
.drive-login-head{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid #e9edf0;flex-shrink:0}.drive-login-head h2{font-size:18px;margin:0;flex:1}.drive-login-body{padding:20px;overflow:auto;min-height:0;overscroll-behavior:contain}.drive-login p{font-size:12px;color:#7a8695;margin:0 0 14px}.drive-login button{border:1px solid #e9edf0;border-radius:10px;background:#fff;padding:10px 12px;color:inherit}.drive-login [hidden]{display:none!important}.drive-login-list{display:grid;gap:8px}.drive-login-list button{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.drive-login-list button:hover{background:#fff2ec;border-color:#dfb9a9}.drive-login-list small{color:#7a8695}.drive-create{display:grid;gap:10px;margin-top:18px;border-top:1px solid #e9edf0;padding-top:18px}.drive-create input{width:100%;padding:10px 12px;border:1px solid #e9edf0;border-radius:10px}.drive-login .drive-primary{background:#db674b;color:#fff;border-color:#db674b}#driveLoginError{color:#b95842;margin:14px 0 0;overflow-wrap:anywhere}
@media(max-width:780px){.drive-header{height:58px;padding:0 12px;gap:8px}.drive-header strong{font-size:16px}.drive-account{padding:7px;font-size:12px}#driveMount{height:calc(var(--app-height,100dvh) - 58px);padding:0}.drive-header .app-nav{flex:1}}
</style>
</head>
<body>
<header class="drive-header"><strong>云盘</strong><nav class="app-nav" aria-label="主导航"></nav><button class="drive-account" id="driveAccount">选择账户</button></header>
<main id="driveMount" aria-label="我的云盘"></main>
<dialog class="drive-login" id="driveLogin" aria-labelledby="driveLoginTitle">
  <div class="drive-login-head"><button id="driveLoginBack" aria-label="返回飞书用户" hidden>返回</button><h2 id="driveLoginTitle">选择云盘账户</h2><button id="driveLoginClose" aria-label="关闭账户选择" hidden>关闭</button></div>
  <div class="drive-login-body"><p id="driveLoginNote">与邻聊共用账户，已上传的文件会在这里显示。</p><div class="drive-login-list" id="driveLoginList"></div>
    <form class="drive-create" id="driveCreate" hidden><label for="driveNickname">新建设备账户</label><input id="driveNickname" maxlength="24" required placeholder="例如：我的手机" autocomplete="nickname"><button class="drive-primary">创建并进入云盘</button></form>
    <p id="driveLoginError" role="status"></p>
  </div>
</dialog>
<script src="/assets/user-drive.js?v=__UI_ASSET_VERSION__"></script>
<script src="/assets/drive-page.js?v=__UI_ASSET_VERSION__"></script>
</body>
</html>
