<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>淘宝采集 · 2.0</title>
  <style>
    :root { --ink:#15201e; --muted:#64716c; --line:#d9e0da; --paper:#f7f8f5; --accent:#d94d27; --accent-dark:#a8371d; --green:#20724e; --warning:#9c5117; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
    button,input { font:inherit; } .tb-main { min-height:100vh; max-width:1540px; padding:clamp(28px,4vw,58px) clamp(20px,5vw,76px) 64px max(92px,calc(var(--ui-nav-width, 66px) + 28px)); }
    .tb-eyebrow { margin:0 0 8px; color:var(--accent); font:700 11px/1.2 "Segoe UI",sans-serif; letter-spacing:.18em; } .tb-heading { max-width:1320px; display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,430px); gap:28px; align-items:end; padding-bottom:25px; border-bottom:1px solid var(--ink); }
    h1 { margin:0; font-family:"Noto Serif SC","Songti SC",serif; font-size:clamp(32px,4vw,52px); line-height:1; letter-spacing:-.06em; font-weight:800; } .tb-heading p { max-width:430px; margin:0; color:var(--muted); font:14px/1.75 "Microsoft YaHei",sans-serif; }
    .identity { display:inline-flex; gap:9px; align-items:center; margin-top:18px; padding:7px 10px; border:1px solid var(--line); background:#fff; color:var(--muted); font:12px/1.3 "Microsoft YaHei",sans-serif; } .identity b { color:var(--ink); }
    .layout { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); max-width:1320px; align-items:stretch; gap:18px; margin-top:42px; } .panel { background:#fff; border:1px solid var(--line); border-radius:18px; }
    .session { padding:26px; border-top:5px solid var(--ink); } .session-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; } h2 { margin:0; font-family:"Noto Serif SC","Songti SC",serif; font-size:18px; letter-spacing:-.03em; } .tag { white-space:nowrap; padding:4px 7px; border:1px solid var(--line); color:var(--muted); font:11px/1.2 "Microsoft YaHei",sans-serif; } .tag.ready { border-color:#a5d3ba; color:var(--green); background:#eff9f2; } .tag.issue { border-color:#efc3b6; color:var(--accent-dark); background:#fff3ef; }
    .session-copy { margin:12px 0 21px; color:var(--muted); font:13px/1.7 "Microsoft YaHei",sans-serif; } .button-row { display:flex; flex-wrap:wrap; gap:10px; } button { border:1px solid var(--ink); padding:10px 14px; background:var(--ink); color:#fff; cursor:pointer; font:700 13px/1.2 "Microsoft YaHei",sans-serif; } button:hover { background:#2a3935; } button:disabled { cursor:not-allowed; opacity:.48; } button.secondary { background:#fff; color:var(--ink); } button.secondary:hover { background:#eef1ed; } button.warn { border-color:var(--accent); color:var(--accent-dark); } button.warn:hover { background:#fff4ef; }
    .collector { padding:26px; } .collector label { display:block; margin:18px 0 8px; color:var(--muted); font:700 12px/1.2 "Microsoft YaHei",sans-serif; letter-spacing:.04em; } .url-row { display:flex; gap:10px; } input { min-width:0; flex:1; padding:12px; border:1px solid #aeb9b1; background:#fbfcfa; outline:none; font:14px/1.4 "Microsoft YaHei",sans-serif; } input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #ffe3d9; } .notice { min-height:24px; margin:12px 0 0; color:var(--muted); font:13px/1.55 "Microsoft YaHei",sans-serif; } .notice.error { color:var(--accent-dark); } .notice.ok { color:var(--green); }
    .archive { grid-column:1 / -1; overflow:hidden; } .archive-title { display:flex; justify-content:space-between; align-items:center; padding:20px 24px 15px; border-bottom:1px solid var(--line); } .text-button { padding:0; border:0; background:transparent; color:var(--accent-dark); font-size:12px; } .text-button:hover { color:var(--accent); background:transparent; }
    table { width:100%; border-collapse:collapse; font:12px/1.45 "Microsoft YaHei",sans-serif; } th,td { padding:13px 14px; text-align:left; border-bottom:1px solid #e7ebe7; vertical-align:middle; } th { color:var(--muted); background:#fafbf9; font-size:11px; } tr:last-child td { border-bottom:0; } .product { max-width:270px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .status { display:inline-block; padding:3px 6px; font-size:11px; background:#eef2ee; color:var(--muted); } .status.ok { color:var(--green); background:#eef8f1; } .status.risk { color:var(--warning); background:#fff6e9; } .actions { display:flex; flex-wrap:wrap; gap:7px; } .actions button { padding:0; color:var(--accent-dark); border:0; background:transparent; font-size:12px; } .actions button:hover { color:var(--accent); background:transparent; text-decoration:underline; }
    .evidence { grid-column:1 / -1; padding:22px 24px; display:none; } .evidence.show { display:block; } .evidence h3 { margin:0; font-size:16px; } .evidence p { color:var(--muted); font:12px/1.65 "Microsoft YaHei",sans-serif; } .evidence img { display:block; width:100%; max-height:420px; object-fit:cover; object-position:top; border:1px solid var(--line); } .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-top:10px; } .gallery img { height:92px; object-fit:contain; background:#f7f8f5; }
    @media (max-width:1000px) { .tb-main { padding-left:24px; } .tb-heading,.layout { grid-template-columns:1fr; } .archive,.evidence { grid-column:auto; } } @media (max-width:640px) { .tb-heading,.url-row { display:block; } .tb-heading p { margin-top:14px; } .url-row button { width:100%; margin-top:10px; } .session,.collector { padding:19px; } th:nth-child(1),td:nth-child(1),th:nth-child(4),td:nth-child(4) { display:none; } }
  </style>
</head>
<body>
  <!-- UI_APP_NAV -->
  <main class="tb-main">
    <header class="tb-heading"><div><p class="tb-eyebrow">TAOBAO / EVIDENCE DESK</p><h1>淘宝采集</h1><div class="identity" id="identity">正在读取全局身份</div></div><p>每位飞书用户使用独立的浏览器 Profile 与专用代理出口。登录、验证码和风控均在独立浏览器页签内人工处理。</p></header>
    <div class="layout"><article class="panel session"><div class="session-head"><div><h2>账号浏览器</h2><p class="session-copy">首次启动会分配并固定一套独立设备环境。它只属于当前飞书用户，关闭浏览器不会清除淘宝登录态。</p></div><span class="tag" id="sessionTag">未启动</span></div><div class="button-row"><button id="startBrowser" type="button">启动并打开登录页</button><button id="openBrowser" class="secondary" type="button" disabled>在新页签观测</button><button id="stopBrowser" class="secondary warn" type="button" disabled>关闭浏览器</button></div></article>
      <article class="panel collector"><h2>采集商品证据</h2><label for="productUrl">淘宝 / 天猫商品详情链接</label><div class="url-row"><input id="productUrl" type="url" autocomplete="off" placeholder="https://detail.tmall.com/item.htm?id=…"><button id="collect" type="button" disabled>采集并留档</button></div><p class="notice" id="notice">请先启动独立浏览器，并在新页签中登录淘宝。</p></article>
      <article class="panel archive"><div class="archive-title"><h2>我的归档</h2><button id="refresh" class="text-button" type="button">刷新</button></div><div style="overflow:auto"><table><thead><tr><th>时间</th><th>商品</th><th>状态</th><th>图片</th><th>操作</th></tr></thead><tbody id="archives"><tr><td colspan="5" style="text-align:center;color:#64716c">正在读取归档…</td></tr></tbody></table></div></article>
      <article class="panel evidence" id="evidence"><h3 id="evidenceTitle">归档预览</h3><p id="evidenceInfo"></p><img id="evidenceShot" alt="商品页面截图"><div class="gallery" id="gallery"></div></article></div>
  </main>
  <script>
  (() => {
    const $ = selector => document.querySelector(selector); let latestOpenUrl = ''; let currentUser = null;
    const notice = (message, type = '') => { const node = $('#notice'); node.textContent = message; node.className = `notice ${type}`; };
    const popup = () => {
      const target = window.open('about:blank', '_blank');
      if (!target) return null;
      target.document.title = '正在启动淘宝浏览器';
      target.document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;margin:0;background:#f7f8f5;color:#15201e;font:16px Microsoft YaHei,sans-serif"><section style="padding:30px 34px;border:1px solid #d9e0da;background:#fff;text-align:center"><strong style="display:block;margin-bottom:10px">正在启动隔离浏览器</strong><span style="color:#64716c;font-size:13px">noVNC 就绪后将自动跳转，请勿关闭此页。</span></section></main>';
      return target;
    };
    const request = async (url, options) => { const response = await fetch(url, options); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || '请求失败'); return data; };
    const setState = data => { const session = data.session || {}; const active = Boolean(session.active); const tag = $('#sessionTag'); tag.textContent = active ? '浏览器已就绪' : (session.status === 'failed' ? '启动失败' : '未启动'); tag.className = `tag ${active ? 'ready' : session.status === 'failed' ? 'issue' : ''}`; $('#openBrowser').disabled = !active; $('#stopBrowser').disabled = !active; $('#collect').disabled = !active; if (session.lastError && !active) notice(session.lastError, 'error'); };
    const openUrl = (value, target) => { if (!value) return; latestOpenUrl = value; if (target && !target.closed) { target.location.href = value; } else { window.open(value, '_blank', 'noopener'); } };
    const loadState = async () => { try { setState(await request('/api/taobao/state')); } catch (error) { notice(error.message, 'error'); } };
    const archiveFile = (id, filename) => `/api/taobao/archives/${encodeURIComponent(id)}/${encodeURIComponent(filename)}`;
    const label = item => item.humanReviewRequired ? '需要人工处理' : item.status === 'archived' ? '已归档' : item.status || '未知';
    const preview = item => { const files = item.files || {}; $('#evidence').classList.add('show'); $('#evidenceTitle').textContent = item.detail?.title || item.requestedUrl || item.id; $('#evidenceInfo').textContent = `${label(item)} · ${item.detail?.shopName || '未识别店铺'}${item.detail?.price ? ` · ¥${item.detail.price}` : ''}`; const shot = $('#evidenceShot'); shot.hidden = !files.screenshot; if (files.screenshot) shot.src = archiveFile(item.id, files.screenshot); const gallery = $('#gallery'); gallery.replaceChildren(); (files.images || []).filter(image => image.filename).forEach(image => { const link = document.createElement('a'); link.href = archiveFile(item.id, image.filename); link.target = '_blank'; link.rel = 'noopener'; const img = document.createElement('img'); img.src = link.href; img.alt = '产品留档图片'; link.append(img); gallery.append(link); }); };
    const renderArchives = archives => { const body = $('#archives'); body.replaceChildren(); if (!archives.length) { body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64716c">当前飞书用户还没有归档。</td></tr>'; return; } archives.forEach(item => { const row = document.createElement('tr'); const time = document.createElement('td'); time.textContent = String(item.createdAt || item.id).replace('T',' ').replace('Z',''); const product = document.createElement('td'); product.className = 'product'; product.textContent = item.detail?.title || item.requestedUrl || item.id; const status = document.createElement('td'); const pill = document.createElement('span'); pill.className = `status ${item.ok ? 'ok' : item.humanReviewRequired ? 'risk' : ''}`; pill.textContent = label(item); status.append(pill); const images = document.createElement('td'); images.textContent = String(item.imageCount || 0); const actions = document.createElement('td'); actions.className = 'actions'; [['查看', () => preview(item)], ['JSON', () => location.href = `/api/taobao/archives/${item.id}/export?format=json`], ['MD', () => location.href = `/api/taobao/archives/${item.id}/export?format=md`]].forEach(([text, handler]) => { const button = document.createElement('button'); button.type = 'button'; button.textContent = text; button.addEventListener('click', handler); actions.append(button); }); row.append(time,product,status,images,actions); body.append(row); }); };
    const loadArchives = async () => { try { renderArchives((await request('/api/taobao/archives')).archives || []); } catch (error) { notice(error.message, 'error'); } };
    $('#startBrowser').addEventListener('click', async () => { const target = popup(); $('#startBrowser').disabled = true; notice('正在启动隔离浏览器，noVNC 就绪后将自动跳转…'); try { const data = await request('/api/taobao/session/start', {method:'POST', headers:{'content-type':'application/json'}, body:'{}'}); setState(data); if (!data.openUrl) throw new Error('noVNC 尚未就绪，请稍后重试'); openUrl(data.openUrl, target); notice('浏览器已在新页签打开，请完成淘宝登录。', 'ok'); } catch (error) { target?.close(); notice(error.message, 'error'); } finally { $('#startBrowser').disabled = false; } });
    $('#openBrowser').addEventListener('click', async () => { const target = popup(); try { const data = await request('/api/taobao/session/open-login', {method:'POST', headers:{'content-type':'application/json'}, body:'{}'}); setState(data); const url = data.openUrl || latestOpenUrl; if (!url) throw new Error('noVNC 尚未就绪，请稍后重试'); openUrl(url, target); } catch (error) { target?.close(); notice(error.message, 'error'); } });
    $('#stopBrowser').addEventListener('click', async () => { try { setState(await request('/api/taobao/session/stop', {method:'POST', headers:{'content-type':'application/json'}, body:'{}'})); notice('浏览器已关闭；登录态已保留。'); } catch (error) { notice(error.message, 'error'); } });
    $('#collect').addEventListener('click', async () => { const url = $('#productUrl').value.trim(); if (!url) return notice('请输入商品详情链接。', 'error'); $('#collect').disabled = true; notice('正在采集 DOM、页面截图和产品图片；如需人工处理会停止。'); try { const result = await request('/api/taobao/collect', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({url})}); if (result.humanReviewRequired) notice('检测到登录或验证，请在新页签处理后重新采集。', 'error'); else if (result.ok) { notice('采集完成，已生成 DOM、截图和图片留档。', 'ok'); preview(result); } else notice(result.error || '采集失败。', 'error'); await loadArchives(); } catch (error) { notice(error.message, 'error'); } finally { $('#collect').disabled = false; } });
    $('#refresh').addEventListener('click', loadArchives);
    (window.VideoAnalyzerGlobalUser || Promise.resolve({currentUser:{id:'public',name:'公共账户'}})).then(data => { currentUser = data.currentUser; $('#identity').innerHTML = `<span>当前身份</span><b>${String(currentUser.name || '公共账户')}</b><span>· ${currentUser.kind === 'feishu' ? '飞书用户' : '公共账户'}</span>`; if (currentUser.kind !== 'feishu') notice('请选择飞书用户后再使用淘宝独立浏览器。'); return loadState(); }); loadArchives();
  })();
  </script>
</body>
</html>
