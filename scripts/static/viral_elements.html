<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆款元素库 · Short Video Analyzer</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--line:#e4e9f2;--text:#172033;--muted:#6b778c;--blue:#2563eb;--blue-soft:#eff6ff;--green:#168454;--red:#c33a4a;--amber:#a5640a;--radius:12px;--shadow:0 8px 30px rgba(22,32,51,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}.top{height:64px;padding:0 20px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{font-size:18px;font-weight:800;white-space:nowrap}.top .app-nav{margin-left:auto}.shell{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:calc(100vh - 64px)}.rail{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;justify-content:space-between}.steps{display:grid;gap:28px}.step{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;color:var(--muted)}.step b{display:grid;place-items:center;width:30px;height:30px;border:1px solid #ccd4e2;border-radius:50%;font-size:13px}.step strong{display:block;margin:4px 0 3px;color:#38445a}.step small{font-size:12px}.step.active b{background:var(--blue);border-color:var(--blue);color:#fff}.step.active strong{color:var(--blue)}.guide{border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:12px;line-height:1.6}.main{padding:16px;display:grid;gap:14px}.grid{display:grid;grid-template-columns:370px minmax(620px,1fr);gap:14px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-head{height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-head h2,.panel-head h3{margin:0;font-size:15px}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}button{height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#364156;padding:0 13px;font-weight:700;cursor:pointer}button:hover{border-color:#b8c5d8}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}.input-panel{padding:14px}.source-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px}.source-tabs button{border-radius:8px 0 0 8px}.source-tabs button+button{border-radius:0 8px 8px 0;border-left:0}.source-tabs .active{background:var(--blue-soft);color:var(--blue);border-color:#bfd3ff}.drop{height:178px;border:1px dashed #aab6c8;border-radius:10px;display:grid;place-items:center;text-align:center;background:#fbfcfe;cursor:pointer}.drop.drag{border-color:var(--blue);background:var(--blue-soft)}.drop-icon{width:48px;height:48px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-size:24px}.drop strong{font-size:16px}.drop small{display:block;color:var(--muted);margin-top:6px}.or{display:flex;align-items:center;gap:10px;color:#9aa5b5;margin:12px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:12px;font-weight:700;color:#566176}.field input,.field textarea,.field select{width:100%;border:1px solid #dbe2ed;border-radius:8px;padding:10px 11px;outline:none;background:#fff;color:var(--text)}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7aa6ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.input-panel>.primary{width:100%;margin-top:12px}.status{min-height:38px;margin-top:10px;padding:9px 10px;border-radius:8px;background:#f6f8fb;color:var(--muted);font-size:12px}.status.ok{color:var(--green);background:#eefaf4}.status.bad{color:var(--red);background:#fff2f3}.recent{margin-top:14px}.recent-list{max-height:248px;overflow:auto}.video-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px 14px;border-bottom:1px solid #eef1f5;cursor:pointer}.video-row:hover,.video-row.active{background:#f7faff}.video-row.active{box-shadow:inset 3px 0 var(--blue)}.video-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.video-row small{display:block;color:var(--muted);margin-top:4px}.tag{align-self:center;font-size:11px;color:var(--green);background:#eefaf4;border-radius:999px;padding:4px 8px}.workspace{overflow:hidden}.workspace-bar{height:58px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.workspace-bar .title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.workspace-bar .meta{margin-left:auto;color:var(--muted);font-size:12px}.review{display:grid;grid-template-columns:minmax(520px,1fr) 244px;min-height:590px}.table-wrap{overflow:auto;border-right:1px solid var(--line)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;background:#f8fafc;text-align:left;color:#5f6b80;font-size:12px;padding:10px 9px;border-bottom:1px solid var(--line);z-index:1}td{padding:8px 9px;border-bottom:1px solid #edf0f5;vertical-align:middle}.group{width:56px;font-weight:800;text-align:center}.group.positioning{background:#eff6ff}.group.content{background:#eefbf5}.group.structure{background:#fff8e8}.group.expression{background:#f7f2ff}.el-label{width:112px;font-weight:700}.value-input{width:100%;border:0;background:transparent;padding:6px;border-radius:5px;color:var(--text)}.value-input:focus{outline:1px solid #8db2ff;background:#fff}.confidence{width:68px;font-variant-numeric:tabular-nums}.evidence-cell{font-size:12px;color:#556176}.toggle{width:34px;height:20px;border-radius:999px;padding:0;background:#cbd3df;border:0;position:relative}.toggle:after{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.16s}.toggle.on{background:var(--blue)}.toggle.on:after{left:17px}.evidence{padding:12px;overflow:auto;max-height:590px}.evidence h3{font-size:14px;margin:2px 0 12px}.evidence-card{padding:10px 0;border-bottom:1px solid var(--line)}.evidence-card b{display:block;color:var(--blue);font-size:12px;margin-bottom:5px}.evidence-card span{font-size:12px;line-height:1.55;color:#536078}.empty{display:grid;place-items:center;min-height:480px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#344055;margin-bottom:6px}.brief{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 180px 220px;gap:12px;padding:14px;align-items:end}.brief .field{margin:0}.brief .primary{height:42px}.scripts{padding:0 14px 14px;display:none}.scripts.show{display:block}.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.version{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfe}.version h4{margin:0 0 8px;font-size:14px}.version p{margin:5px 0;color:#566176;font-size:12px;line-height:1.5}.shot{padding:7px 0;border-top:1px solid #edf0f5}@media(max-width:1100px){.shell{grid-template-columns:1fr}.rail{display:none}.grid{grid-template-columns:1fr}.review{grid-template-columns:1fr}.table-wrap{border-right:0}.evidence{border-top:1px solid var(--line);max-height:none}.brief{grid-template-columns:1fr 1fr}.versions{grid-template-columns:1fr}}@media(max-width:680px){.top{padding:0 10px}.brand{font-size:15px}.main{padding:8px}.grid,.brief{grid-template-columns:1fr}.review{min-height:0}.workspace-bar .meta{display:none}.table-wrap{max-width:calc(100vw - 18px)}table{min-width:780px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Short Video Analyzer</div><nav class="app-nav"></nav></header>
<div class="shell"><aside class="rail"><div><h2 style="margin:0 0 26px;font-size:17px">爆款元素库</h2><div class="steps"><div class="step active"><b>1</b><div><strong>视频输入</strong><small>上传或粘贴链接</small></div></div><div class="step"><b>2</b><div><strong>元素审核</strong><small>18 个元素审核</small></div></div><div class="step"><b>3</b><div><strong>脚本生成</strong><small>生成三版脚本</small></div></div></div></div><div class="guide"><strong style="color:#344055">使用指南</strong><br>先在“分析”完成视频内容提取，再回到这里拆解和审核元素。</div></aside>
<main class="main"><div class="grid"><div><section class="panel"><div class="panel-head"><h2>视频输入</h2></div><div class="input-panel"><div class="source-tabs"><button class="active">上传视频</button><button id="linkTab">粘贴链接</button></div><label class="drop" id="drop" for="videoFile"><input id="videoFile" type="file" accept="video/*" hidden><div><div class="drop-icon">↑</div><strong>上传视频</strong><small>支持 MP4、MOV、MKV，单文件不超过 2GB</small></div></label><div class="or">或</div><div class="field"><label>TikTok / 抖音链接</label><input id="url" placeholder="粘贴视频链接"></div><button id="start" class="primary">开始拆解</button><div id="status" class="status">请选择已有视频，或上传后开始拆解。</div></div></section><section class="panel recent"><div class="panel-head"><h3>最近拆解</h3><button id="refresh">刷新</button></div><div id="recent" class="recent-list"></div></section></div>
<section class="panel workspace"><div class="workspace-bar"><span class="title" id="current">尚未选择视频</span><span class="meta"><b id="approvedCount">0</b> / 18 审核通过</span><button id="approveAll">全部通过</button><button id="saveReview" class="primary">保存审核</button></div><div id="empty" class="empty"><div><strong>选择视频开始元素拆解</strong><span>系统会从已有分析结果中提取 18 个爆款元素及证据。</span></div></div><div id="review" class="review" hidden><div class="table-wrap"><table><thead><tr><th style="width:58px">分组</th><th style="width:118px">元素</th><th>识别结果（可编辑）</th><th style="width:72px">置信度</th><th style="width:120px">证据时间轴</th><th style="width:74px">审核通过</th></tr></thead><tbody id="elementRows"></tbody></table></div><aside class="evidence"><h3>证据时间轴</h3><div id="evidenceList"></div></aside></div></section></div>
<section class="panel"><div class="panel-head"><div><h3>脚本生成 Brief</h3><span class="muted" style="font-size:12px">仅使用已审核通过的元素</span></div><button id="toggleScripts">查看最新脚本</button></div><div class="brief"><div class="field"><label>产品名称</label><input id="product" placeholder="例如：办公室腰部舒缓器"></div><div class="field"><label>核心卖点</label><textarea id="sellingPoints" placeholder="每行一个卖点"></textarea></div><div class="field"><label>目标人群</label><input id="audience" placeholder="例如：久坐办公白领"></div><div class="field"><label>视频时长</label><select id="duration"><option>00:15-00:30</option><option selected>00:30-00:60</option><option>01:00-01:30</option></select></div><button id="generate" class="primary">生成三版脚本</button></div><div id="scripts" class="scripts"><div id="versions" class="versions"></div></div></section></main></div>
<script>
const $=id=>document.getElementById(id);const S={file:"",files:[],review:null,scripts:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(text,type=""){const el=$("status");el.className="status "+type;el.textContent=text}
function bytes(n){return n?`${(n/1048576).toFixed(1)} MB`:""}
async function request(url,options){const r=await fetch(url,options);let p={};try{p=await r.json()}catch{}if(!r.ok)throw new Error(p.error||`请求失败 (${r.status})`);return p}
async function loadFiles(){S.files=await request("/api/files");$("recent").innerHTML=S.files.length?S.files.slice(0,20).map(f=>`<div class="video-row ${f.name===S.file?'active':''}" data-name="${esc(f.name)}"><div><b>${esc(f.title||f.name)}</b><small>${bytes(f.size)} · ${esc(f.status_label||'等待拆解')}</small></div><span class="tag">${esc(f.status_label||'待处理')}</span></div>`).join(""):'<div class="empty" style="min-height:120px">暂无视频</div>';document.querySelectorAll('.video-row').forEach(row=>row.onclick=()=>selectFile(row.dataset.name))}
async function selectFile(name){S.file=name;$("current").textContent=name;await loadFiles();try{const p=await request('/api/viral-elements?filename='+encodeURIComponent(name));if(p.review){S.review=p.review;renderReview();message('已加载元素审核记录。','ok')}else{S.review=null;showEmpty('该视频尚未拆解','点击“开始拆解”生成 18 个元素。')}S.scripts=p.latest_scripts||null;renderScripts()}catch(e){message(e.message,'bad')}}
function showEmpty(title,sub){$("review").hidden=true;$("empty").hidden=false;$("empty").innerHTML=`<div><strong>${esc(title)}</strong><span>${esc(sub)}</span></div>`;updateApproved()}
function renderReview(){const items=S.review?.elements||[];$("empty").hidden=true;$("review").hidden=false;const spans={};items.forEach(x=>spans[x.group]=(spans[x.group]||0)+1);let seen={};$("elementRows").innerHTML=items.map((x,i)=>`<tr>${!seen[x.group]?(seen[x.group]=1,`<td class="group ${esc(x.group)}" rowspan="${spans[x.group]}">${esc(x.group_label)}</td>`):''}<td class="el-label">${i+1}. ${esc(x.label)}</td><td><input class="value-input" data-i="${i}" value="${esc(x.value)}"></td><td class="confidence">${Math.round((x.confidence||0)*100)}%</td><td class="evidence-cell">${esc(x.time_range||'—')}</td><td><button class="toggle ${x.approved?'on':''}" data-toggle="${i}" aria-label="审核通过"></button></td></tr>`).join('');$("evidenceList").innerHTML=items.filter(x=>x.evidence).map(x=>`<div class="evidence-card"><b>${esc(x.time_range||x.label)}</b><span>${esc(x.evidence)}</span></div>`).join('')||'<span class="muted">暂无时间轴证据</span>';document.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>S.review.elements[+el.dataset.i].value=el.value);document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const x=S.review.elements[+el.dataset.toggle];x.approved=!x.approved;el.classList.toggle('on',x.approved);updateApproved()});updateApproved()}
function updateApproved(){$("approvedCount").textContent=(S.review?.elements||[]).filter(x=>x.approved).length}
async function upload(){const file=$("videoFile").files[0];if(!file)return;const fd=new FormData();fd.append('video',file);message('正在上传视频…');const p=await request('/api/upload',{method:'POST',body:fd});const ok=p.files||[];if(!ok.length)throw new Error((p.errors?.[0]?.error)||'上传失败');await loadFiles();await selectFile(ok[0].filename);message('上传完成。请先在“分析”页完成内容提取，再开始拆解。','ok')}
async function download(){const url=$("url").value.trim();if(!url)return;message('正在提交下载任务…');const p=await request('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const es=new EventSource('/api/download-events?id='+encodeURIComponent(p.id));es.onmessage=async e=>{const job=JSON.parse(e.data);message('视频下载：'+job.status);if(['complete','failed'].includes(job.status)){es.close();if(job.status==='failed')return message(job.error||'下载失败','bad');await loadFiles();await selectFile(job.filename);message('下载完成。','ok')}}}
async function analyze(){if(!S.file){if($("videoFile").files[0])await upload();else if($("url").value.trim())return download();else return message('请先选择、上传或粘贴视频链接。','bad')}message('正在根据现有视频分析提取 18 个元素，通常需要几十秒…');$("start").disabled=true;try{const p=await request('/api/viral-elements/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:S.file})});S.review=p.review;renderReview();message('18 个元素拆解完成，请审核后保存。','ok')}catch(e){message(e.message,'bad')}finally{$("start").disabled=false}}
async function save(){if(!S.review)return message('没有可保存的审核记录。','bad');try{const p=await request('/api/viral-elements/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.review)});S.review=p.review;renderReview();message('审核记录已保存。','ok')}catch(e){message(e.message,'bad')}}
function renderScripts(){const versions=S.scripts?.scripts?.versions||S.scripts?.versions||[];$("versions").innerHTML=versions.map(v=>`<article class="version"><h4>${esc(v.id)} · ${esc(v.name)}</h4><p><b>策略：</b>${esc(v.strategy)}</p><p><b>Hook：</b>${esc(v.hook)}</p>${(v.shots||[]).map(s=>`<div class="shot"><p><b>${esc(s.time_range)}</b> ${esc(s.visual)}</p><p>${esc(s.voiceover)}</p></div>`).join('')}<p><b>CTA：</b>${esc(v.cta)}</p></article>`).join('')||'<div class="muted">暂无脚本</div>';$("scripts").classList.toggle('show',!!versions.length)}
async function generate(){if(!S.file||!S.review)return message('请先完成元素拆解与审核。','bad');await save();const brief={product:$("product").value,selling_points:$("sellingPoints").value,audience:$("audience").value,duration:$("duration").value};$("generate").disabled=true;message('正在生成三版脚本…');try{const p=await request('/api/viral-elements/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:S.file,brief})});S.scripts=p;renderScripts();message('三版脚本生成完成。','ok')}catch(e){message(e.message,'bad')}finally{$("generate").disabled=false}}
$("videoFile").onchange=()=>upload().catch(e=>message(e.message,'bad'));$("start").onclick=()=>analyze().catch(e=>message(e.message,'bad'));$("refresh").onclick=loadFiles;$("saveReview").onclick=save;$("approveAll").onclick=()=>{if(!S.review)return;S.review.elements.forEach(x=>x.approved=true);renderReview()};$("generate").onclick=generate;$("toggleScripts").onclick=()=>$("scripts").classList.toggle('show');$("linkTab").onclick=()=>$("url").focus();const drop=$("drop");['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{if(e.dataTransfer.files.length){$("videoFile").files=e.dataTransfer.files;upload().catch(x=>message(x.message,'bad'))}});loadFiles().catch(e=>message(e.message,'bad'));
</script>
</body></html>
