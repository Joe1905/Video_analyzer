<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>分镜提取 · Short Video Analyzer</title>
<style>
:root{--ink:#19273b;--muted:#68788b;--line:#dce3ec;--blue:#2563eb;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:24px;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:15px;font-weight:750;white-space:nowrap}header nav{margin-left:auto;min-width:0}main{max-width:1500px;margin:auto;padding:32px 24px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.eyebrow{font:11px Consolas,monospace;letter-spacing:2px;color:var(--muted)}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}.tag{border:1px solid var(--line);border-radius:24px;padding:8px 14px;color:var(--muted);font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}.panel h2{font-size:15px;margin:0 0 20px}.step{font:12px Consolas,monospace;color:var(--blue);margin-right:10px}label{display:block;font-size:13px;margin-bottom:9px}input,select,button,.action{font:inherit;border:1px solid var(--line);border-radius:7px}input,select{width:100%;padding:10px;background:white;color:var(--ink)}input[type=file]{font-size:12px;padding:14px 8px;background:#f8fafc;border-style:dashed}button,.action{cursor:pointer;padding:10px 14px;color:var(--ink);background:white;text-decoration:none;font-size:13px;display:inline-block}button:hover,.action:hover{border-color:var(--blue);color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b4ff;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--blue);color:white;border-color:var(--blue);width:100%;font-weight:650;padding:12px}.primary:hover{color:white;background:#1d4ed8}.field{margin-bottom:20px}.divider{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.hint{font-size:12px;margin-top:8px}.status{font-size:13px;line-height:1.7;margin-top:14px;overflow-wrap:anywhere}.status.error{color:#b42318}.history{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}.history h2{margin-bottom:12px}.history button{display:block;width:100%;text-align:left;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}.toolbar h2{margin:0 auto 0 0;font-size:15px;overflow-wrap:anywhere}.toolbar .action[hidden]{display:none}.summary{font-size:12px;margin:14px 0;color:var(--muted)}.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.frame{margin:0;min-width:0}.frame a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#162030}.frame img{display:block;width:100%;height:220px;object-fit:contain}.frame figcaption{display:flex;justify-content:space-between;padding:9px 2px;font:12px Consolas,monospace;color:var(--muted)}.empty{min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px}.empty svg{width:88px;height:64px;stroke:#b7c3d3;stroke-width:1;fill:none;margin-bottom:22px}.empty strong{font-size:16px;font-weight:550;margin-bottom:10px}.empty p{max-width:300px;font-size:13px}[hidden]{display:none!important}@media(max-width:800px){header{padding:10px 12px;gap:10px;flex-wrap:wrap}header nav{width:100%}main{padding:20px 12px}.layout{grid-template-columns:1fr}.intro .tag{display:none}.panel{padding:18px}.empty{min-height:280px}.frame img{height:200px}.frames{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>
<header><div class="brand">Short Video Analyzer</div><nav class="app-nav"></nav></header>
<main>
<div class="intro"><div><div class="eyebrow">VIDEO / STORYBOARD</div><h1>分镜提取</h1><p>把视频中变化明显的画面，整理成一张可浏览、可下载的分镜板。</p></div><span class="tag">本地提取 · 无需 AI 分析</span></div>
<div class="layout">
<aside class="panel"><h2><span class="step">01</span>选择视频</h2>
<div class="field"><label for="upload">上传本地视频</label><input type="file" id="upload" accept=".mp4,.mov,.m4v,.webm"><p class="hint">支持 MP4 / MOV / M4V / WebM<br>最大 512 MB · 5 分钟 · 4K</p></div>
<div class="divider">或使用站内视频</div>
<div class="field"><label for="existing">已有视频</label><select id="existing"><option value="">请选择视频</option></select></div>
<div class="field"><label for="count">最多提取画面数</label><input id="count" type="number" min="1" max="40" value="20"><p class="hint">按画面差异筛选，结果按时间排列；实际数量可能少于设置值。</p></div>
<button class="primary" id="start">开始提取</button><div class="status" id="status" role="status" aria-live="polite"></div>
<div class="history"><h2>最近提取</h2><div id="history"><p class="hint">暂无任务</p></div></div>
</aside>
<section class="panel"><div class="toolbar"><h2 id="title">分镜预览</h2><a class="action" id="png" hidden>下载拼图</a><a class="action" id="zip" hidden>下载全部图片</a></div><div class="summary" id="summary">选择视频后开始提取，点击画面可查看原图。</div>
<div class="empty" id="empty"><svg viewBox="0 0 88 64" aria-hidden="true"><rect x="2" y="8" width="84" height="48" rx="5"/><path d="M30 8v48M58 8v48M2 16h84M2 48h84"/></svg><strong>让视频的画面顺序一目了然</strong><p>提取完成后，关键画面和对应时间点会显示在这里。</p></div><div class="frames" id="frames"></div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);let timer=null,selected=null,busy=false;
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data}
function stamp(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${(seconds%60).toFixed(2).padStart(5,'0')}`}
function render(job){$('title').textContent=job.filename;$('frames').replaceChildren();const complete=job.status==='complete';$('png').hidden=$('zip').hidden=!complete;$('empty').hidden=complete;
if(!complete){$('summary').textContent=job.status==='failed'?'本次提取未完成，请重新提取。':'正在提取画面，完成后自动显示。';return}
$('summary').textContent=`${job.frames.length} 张画面 · 视频 ${stamp(job.duration)}${job.fallback?' · 画面变化较小，已保留第一帧':''}`;
for(const [index,item] of job.frames.entries()){const figure=document.createElement('figure');figure.className='frame';const link=document.createElement('a');link.href=`/api/storyboard/image?id=${job.id}&frame=${encodeURIComponent(item.name)}`;link.target='_blank';link.rel='noopener';const img=document.createElement('img');img.src=link.href;img.alt=`画面 ${index+1}，${stamp(item.timestamp)}`;img.loading='lazy';link.append(img);const caption=document.createElement('figcaption');const number=document.createElement('span');number.textContent=String(index+1).padStart(2,'0');const time=document.createElement('span');time.textContent=stamp(item.timestamp);caption.append(number,time);figure.append(link,caption);$('frames').append(figure)}
$('png').href=`/api/storyboard/export?id=${job.id}&format=png`;$('zip').href=`/api/storyboard/export?id=${job.id}&format=zip`}
async function history(){const data=await api('/api/storyboard/jobs');$('history').replaceChildren();for(const job of data.jobs){const button=document.createElement('button');button.textContent=`${job.status==='complete'?'✓':job.status==='failed'?'×':'…'} ${job.filename}`;button.title=job.filename;button.onclick=()=>select(job.id);$('history').append(button)}if(!data.jobs.length)$('history').textContent='暂无任务'}
async function select(id){clearTimeout(timer);selected=id;location.hash=id;await poll(id)}
async function poll(id){try{const job=await api('/api/storyboard/jobs?id='+id);if(selected!==id)return;render(job);status(job.status==='complete'?'提取完成，可查看和下载画面。':job.status==='failed'?job.error:'正在提取画面，请稍候…',job.status==='failed');if(job.status==='running')timer=setTimeout(()=>poll(id),1200);else await history()}catch(error){if(selected===id)status(error.message,true)}}
$('upload').onchange=()=>{if($('upload').files.length)$('existing').value=''};$('existing').onchange=()=>{if($('existing').value)$('upload').value=''};
$('start').onclick=async()=>{if(busy)return;const file=$('upload').files[0],name=file?file.name:$('existing').value,count=Number($('count').value);if(!name)return status('请先上传或选择一个视频。',true);if(!Number.isInteger(count)||count<1||count>40)return status('提取数量须为 1–40。',true);if(file&&file.size>512*1024*1024)return status('视频不得超过 512 MB。',true);busy=true;$('start').disabled=true;status(file?'正在上传视频…':'正在创建提取任务…');try{const query=new URLSearchParams({filename:name,max_frames:String(count),source:file?'upload':'existing'});const job=await api('/api/storyboard/jobs?'+query,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file||null});await select(job.id);await history()}catch(error){status(error.message,true)}finally{busy=false;$('start').disabled=false}};
(async()=>{try{const data=await api('/api/storyboard/videos');for(const name of data.files){const option=document.createElement('option');option.value=option.textContent=name;$('existing').append(option)}await history();const id=location.hash.slice(1);if(/^[0-9a-f]{32}$/.test(id))await select(id)}catch(error){status(error.message,true)}})();
</script>
</body>
</html>
