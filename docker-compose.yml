services:
  analyzer:
    build:
      context: .
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    image: short-video-analyzer:latest
    environment:
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_URL: ${VISION_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-flash}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-analyzer}
      DIRECT_VIDEO_MODEL: ${DIRECT_VIDEO_MODEL:-qwen3-vl-flash}
      DIRECT_VIDEO_FPS: ${DIRECT_VIDEO_FPS:-2}
      DIRECT_VIDEO_AUDIO_MODE: ${DIRECT_VIDEO_AUDIO_MODE:-whisper}
      DIRECT_VIDEO_UPLOAD_MODE: ${DIRECT_VIDEO_UPLOAD_MODE:-auto}
      TIKTOK_MAX_BYTES: ${TIKTOK_MAX_BYTES:-2147483648}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MAX_FRAMES: ${MAX_FRAMES:-20}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      LANGUAGE: ${LANGUAGE:-zh}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
    working_dir: /workspace
    volumes:
      - ./videos:/workspace/videos
      - ./output:/workspace/output
      - ./scripts:/workspace/scripts:ro
    networks:
      - analyzer

  web:
    build:
      context: .
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    image: short-video-analyzer:latest
    command: python scripts/web_app.py
    environment:
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_URL: ${VISION_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-flash}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-analyzer}
      DIRECT_VIDEO_MODEL: ${DIRECT_VIDEO_MODEL:-qwen3-vl-flash}
      DIRECT_VIDEO_FPS: ${DIRECT_VIDEO_FPS:-2}
      DIRECT_VIDEO_AUDIO_MODE: ${DIRECT_VIDEO_AUDIO_MODE:-whisper}
      DIRECT_VIDEO_UPLOAD_MODE: ${DIRECT_VIDEO_UPLOAD_MODE:-auto}
      TIKTOK_MAX_BYTES: ${TIKTOK_MAX_BYTES:-2147483648}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MAX_FRAMES: ${MAX_FRAMES:-20}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      LANGUAGE: ${LANGUAGE:-zh}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      WEB_PORT: "4000"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
    working_dir: /workspace
    volumes:
      - ./videos:/workspace/videos
      - ./output:/workspace/output
      - ./scripts:/workspace/scripts:ro
    ports:
      - "${WEB_PORT:-4000}:4000"
    networks:
      - analyzer

networks:
  analyzer:
