services:
  analyzer:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ALL_PROXY: ${ALL_PROXY:-}
        all_proxy: ${all_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
        no_proxy: ${no_proxy:-}
    image: short-video-analyzer:latest
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TIKTOK_BROWSER_MAX_SLOTS: ${TIKTOK_BROWSER_MAX_SLOTS:-2}
      TIKTOK_PENDING_LOGIN_TTL_SECONDS: ${TIKTOK_PENDING_LOGIN_TTL_SECONDS:-900}
      TIKTOK_BROWSER_LOCALE: ${TIKTOK_BROWSER_LOCALE:-en-US}
      TIKTOK_BROWSER_ACCEPT_LANGUAGE: ${TIKTOK_BROWSER_ACCEPT_LANGUAGE:-en-US,en}
      TIKTOK_CDP_PORT_START: ${TIKTOK_CDP_PORT_START:-19220}
      TIKTOK_PUBLISH_MAX_BYTES: ${TIKTOK_PUBLISH_MAX_BYTES:-2147483648}
      TIKTOK_NATIVE_SCHEDULE_LEAD_SECONDS: ${TIKTOK_NATIVE_SCHEDULE_LEAD_SECONDS:-1800}
      TIKTOK_NATIVE_SCHEDULE_MIN_MINUTES: ${TIKTOK_NATIVE_SCHEDULE_MIN_MINUTES:-20}
      TIKTOK_PUBLISH_DRY_RUN: ${TIKTOK_PUBLISH_DRY_RUN:-0}
      TIKTOK_PUBLISH_FINAL_CLICK_ENABLED: ${TIKTOK_PUBLISH_FINAL_CLICK_ENABLED:-1}
      TIKTOK_PUBLISH_UPLOAD_TIMEOUT_SECONDS: ${TIKTOK_PUBLISH_UPLOAD_TIMEOUT_SECONDS:-1800}
      PROXY_POOL_ENABLED: ${PROXY_POOL_ENABLED:-1}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      NOVNC_MANUAL_PORTS: ${NOVNC_MANUAL_PORTS:-1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_URL: ${VISION_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-flash}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-analyzer}
      DIRECT_VIDEO_MODEL: ${DIRECT_VIDEO_MODEL:-qwen3-vl-flash}
      DIRECT_VIDEO_FPS: ${DIRECT_VIDEO_FPS:-2}
      DIRECT_VIDEO_AUDIO_MODE: ${DIRECT_VIDEO_AUDIO_MODE:-whisper}
      DIRECT_VIDEO_UPLOAD_MODE: ${DIRECT_VIDEO_UPLOAD_MODE:-auto}
      TIKTOK_MAX_BYTES: ${TIKTOK_MAX_BYTES:-2147483648}
      TIKTOK_MEDIA_URL_TIMEOUT: ${TIKTOK_MEDIA_URL_TIMEOUT:-60}
      TIKTOK_PROXY_URL: ${TIKTOK_PROXY_URL:-}
      DOUYIN_PROXY_URL: ${DOUYIN_PROXY_URL:-}
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-}
      SOCIAVAULT_API_KEY: ${SOCIAVAULT_API_KEY:-}
      SOCIAVAULT_API_BASE: ${SOCIAVAULT_API_BASE:-https://api.sociavault.com}
      SOCIAVAULT_REGION: ${SOCIAVAULT_REGION:-US}
      SOCIAVAULT_MAX_PAGES: ${SOCIAVAULT_MAX_PAGES:-1}
      SOCIAVAULT_REVIEW_PAGES: ${SOCIAVAULT_REVIEW_PAGES:-1}
      REPORT_DOWNLOAD_TIMEOUT: ${REPORT_DOWNLOAD_TIMEOUT:-180}
      REPORT_DOWNLOAD_MAX_WORKERS: ${REPORT_DOWNLOAD_MAX_WORKERS:-3}
      REPORT_ANALYSIS_TIMEOUT: ${REPORT_ANALYSIS_TIMEOUT:-2400}
      REPORT_ANALYSIS_MAX_WORKERS: ${REPORT_ANALYSIS_MAX_WORKERS:-2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_V4_PRO_MODEL: ${DEEPSEEK_V4_PRO_MODEL:-deepseek-v4-flash}
      SELLERSPRITE_SECRET_KEY: ${SELLERSPRITE_SECRET_KEY:-}
      SELLERSPRITE_MCP_URL: ${SELLERSPRITE_MCP_URL:-https://mcp.sellersprite.com/mcp}
      SELLERSPRITE_CHAT_PORT: ${SELLERSPRITE_CHAT_PORT:-4101}
      SELLERSPRITE_CACHE_TTL_SECONDS: ${SELLERSPRITE_CACHE_TTL_SECONDS:-86400}
      FASTMOSS_MCP_API_KEY: ${FASTMOSS_MCP_API_KEY:-}
      FASTMOSS_MCP_URL: ${FASTMOSS_MCP_URL:-https://mcp.fastmoss.com/mcp}
      FASTMOSS_CHAT_PORT: ${FASTMOSS_CHAT_PORT:-4102}
      FASTMOSS_CACHE_TTL_SECONDS: ${FASTMOSS_CACHE_TTL_SECONDS:-86400}
      SELLERSPRITE_REDIRECT_PORT: "0"
      API_CACHE_ENABLED: ${API_CACHE_ENABLED:-1}
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-604800}
      OCR_API_URL: ${OCR_API_URL:-http://127.0.0.1:4000/v1/ocr/extract}
      FEISHU_CAPABILITY_API_URL: ${FEISHU_CAPABILITY_API_URL:-http://127.0.0.1:4000}
      FEISHU_CAPABILITY_TIMEOUT_SECONDS: ${FEISHU_CAPABILITY_TIMEOUT_SECONDS:-15}
      OCR_SHARED_DIR: ${OCR_SHARED_DIR:-/home/openclaw/ocr-shared}
      OCR_SERVER_SHARED_DIR: ${OCR_SERVER_SHARED_DIR:-/home/openclaw/ocr-shared}
      CHAT_IMAGE_MAX_BYTES: ${CHAT_IMAGE_MAX_BYTES:-6291456}
      CHAT_IMAGE_MAX_COUNT: ${CHAT_IMAGE_MAX_COUNT:-6}
      MAX_FRAMES: ${MAX_FRAMES:-20}
      FRAME_ANALYSIS_MAX_TOKENS: ${FRAME_ANALYSIS_MAX_TOKENS:-1200}
      FRAME_ANALYSIS_RETRY_MAX_TOKENS: ${FRAME_ANALYSIS_RETRY_MAX_TOKENS:-2400}
      FRAME_CONTEXT_WINDOW: ${FRAME_CONTEXT_WINDOW:-3}
      VIDEO_RECONSTRUCTION_MAX_TOKENS: ${VIDEO_RECONSTRUCTION_MAX_TOKENS:-8192}
      VIDEO_RECONSTRUCTION_RETRY_MAX_TOKENS: ${VIDEO_RECONSTRUCTION_RETRY_MAX_TOKENS:-12000}
      LONG_VIDEO_FRAME_INTERVAL_SECONDS: ${LONG_VIDEO_FRAME_INTERVAL_SECONDS:-10}
      LONG_VIDEO_MAX_FRAMES: ${LONG_VIDEO_MAX_FRAMES:-60}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      LANGUAGE: ${LANGUAGE:-zh}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: ${HF_HOME:-/workspace/data/model_cache/huggingface}
      HF_HUB_CACHE: ${HF_HUB_CACHE:-/workspace/data/model_cache/huggingface/hub}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/workspace/data/model_cache/huggingface/hub}
      TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE:-/workspace/data/model_cache/huggingface/transformers}
      XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/workspace/data/model_cache}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/root/.cache/ms-playwright}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
    working_dir: /workspace
    volumes:
      - ./videos:/workspace/videos
      - ./output:/workspace/output
      - ${DATA_DIR:-./data}:/workspace/data
      - ./scripts:/workspace/scripts:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - analyzer

  web:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ALL_PROXY: ${ALL_PROXY:-}
        all_proxy: ${all_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
        no_proxy: ${no_proxy:-}
    image: short-video-analyzer:latest
    init: true
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    command: python scripts/web_app.py
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TIKTOK_BROWSER_MAX_SLOTS: ${TIKTOK_BROWSER_MAX_SLOTS:-2}
      TIKTOK_PENDING_LOGIN_TTL_SECONDS: ${TIKTOK_PENDING_LOGIN_TTL_SECONDS:-900}
      TIKTOK_BROWSER_LOCALE: ${TIKTOK_BROWSER_LOCALE:-en-US}
      TIKTOK_BROWSER_ACCEPT_LANGUAGE: ${TIKTOK_BROWSER_ACCEPT_LANGUAGE:-en-US,en}
      TIKTOK_CDP_PORT_START: ${TIKTOK_CDP_PORT_START:-19220}
      TIKTOK_PUBLISH_MAX_BYTES: ${TIKTOK_PUBLISH_MAX_BYTES:-2147483648}
      TIKTOK_NATIVE_SCHEDULE_LEAD_SECONDS: ${TIKTOK_NATIVE_SCHEDULE_LEAD_SECONDS:-1800}
      TIKTOK_NATIVE_SCHEDULE_MIN_MINUTES: ${TIKTOK_NATIVE_SCHEDULE_MIN_MINUTES:-20}
      TIKTOK_PUBLISH_DRY_RUN: ${TIKTOK_PUBLISH_DRY_RUN:-0}
      TIKTOK_PUBLISH_FINAL_CLICK_ENABLED: ${TIKTOK_PUBLISH_FINAL_CLICK_ENABLED:-1}
      TIKTOK_PUBLISH_UPLOAD_TIMEOUT_SECONDS: ${TIKTOK_PUBLISH_UPLOAD_TIMEOUT_SECONDS:-1800}
      PROXY_POOL_ENABLED: ${PROXY_POOL_ENABLED:-1}
      PROXY_REALITY_CORE: ${PROXY_REALITY_CORE:-sing-box}
      PROXY_REALITY_DEFAULT_FINGERPRINT: ${PROXY_REALITY_DEFAULT_FINGERPRINT:-safari}
      SING_BOX_CONFIG_PATH: ${SING_BOX_CONFIG_PATH:-/workspace/data/sing-box/config.json}
      SING_BOX_COMPOSE_PROJECT: short-video-analyzer
      MIHOMO_CONFIG_PATH: ${MIHOMO_CONFIG_PATH:-/host/etc/mihomo/config.yaml}
      MIHOMO_RELOAD_PATH: ${MIHOMO_RELOAD_PATH:-/etc/mihomo/config.yaml}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      NOVNC_MANUAL_PORTS: ${NOVNC_MANUAL_PORTS:-1}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_API_URL: ${VISION_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-flash}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-analyzer}
      DIRECT_VIDEO_MODEL: ${DIRECT_VIDEO_MODEL:-qwen3-vl-flash}
      DIRECT_VIDEO_FPS: ${DIRECT_VIDEO_FPS:-2}
      DIRECT_VIDEO_AUDIO_MODE: ${DIRECT_VIDEO_AUDIO_MODE:-whisper}
      DIRECT_VIDEO_UPLOAD_MODE: ${DIRECT_VIDEO_UPLOAD_MODE:-auto}
      TIKTOK_MAX_BYTES: ${TIKTOK_MAX_BYTES:-2147483648}
      TIKTOK_MEDIA_URL_TIMEOUT: ${TIKTOK_MEDIA_URL_TIMEOUT:-60}
      TIKTOK_PROXY_URL: ${TIKTOK_PROXY_URL:-}
      DOUYIN_PROXY_URL: ${DOUYIN_PROXY_URL:-}
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-}
      SOCIAVAULT_API_KEY: ${SOCIAVAULT_API_KEY:-}
      SOCIAVAULT_API_BASE: ${SOCIAVAULT_API_BASE:-https://api.sociavault.com}
      SOCIAVAULT_REGION: ${SOCIAVAULT_REGION:-US}
      SOCIAVAULT_MAX_PAGES: ${SOCIAVAULT_MAX_PAGES:-1}
      SOCIAVAULT_REVIEW_PAGES: ${SOCIAVAULT_REVIEW_PAGES:-1}
      REPORT_DOWNLOAD_TIMEOUT: ${REPORT_DOWNLOAD_TIMEOUT:-180}
      REPORT_DOWNLOAD_MAX_WORKERS: ${REPORT_DOWNLOAD_MAX_WORKERS:-3}
      REPORT_ANALYSIS_TIMEOUT: ${REPORT_ANALYSIS_TIMEOUT:-2400}
      REPORT_ANALYSIS_MAX_WORKERS: ${REPORT_ANALYSIS_MAX_WORKERS:-2}
      AMAZON_PROXY: ${AMAZON_PROXY:-}
      AMAZON_PROXIES: ${AMAZON_PROXIES:-}
      AMAZON_MAX_PAGES: ${AMAZON_MAX_PAGES:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_V4_PRO_MODEL: ${DEEPSEEK_V4_PRO_MODEL:-deepseek-v4-flash}
      SELLERSPRITE_SECRET_KEY: ${SELLERSPRITE_SECRET_KEY:-}
      SELLERSPRITE_MCP_URL: ${SELLERSPRITE_MCP_URL:-https://mcp.sellersprite.com/mcp}
      SELLERSPRITE_CHAT_PORT: ${SELLERSPRITE_CHAT_PORT:-4101}
      SELLERSPRITE_CACHE_TTL_SECONDS: ${SELLERSPRITE_CACHE_TTL_SECONDS:-86400}
      FASTMOSS_MCP_API_KEY: ${FASTMOSS_MCP_API_KEY:-}
      FASTMOSS_MCP_URL: ${FASTMOSS_MCP_URL:-https://mcp.fastmoss.com/mcp}
      FASTMOSS_CHAT_PORT: ${FASTMOSS_CHAT_PORT:-4102}
      FASTMOSS_CACHE_TTL_SECONDS: ${FASTMOSS_CACHE_TTL_SECONDS:-86400}
      SELLERSPRITE_REDIRECT_PORT: "0"
      API_CACHE_ENABLED: ${API_CACHE_ENABLED:-1}
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-604800}
      CHAT_CONTEXT_MAX_TOKENS: ${CHAT_CONTEXT_MAX_TOKENS:-120000}
      CHAT_HISTORY_MESSAGE_LIMIT: ${CHAT_HISTORY_MESSAGE_LIMIT:-20}
      CHAT_HISTORY_TEXT_MAX_CHARS: ${CHAT_HISTORY_TEXT_MAX_CHARS:-8000}
      CHAT_HISTORY_COMPACT_CHARS: ${CHAT_HISTORY_COMPACT_CHARS:-3000}
      CHAT_TOOL_EVIDENCE_MAX_CHARS: ${CHAT_TOOL_EVIDENCE_MAX_CHARS:-6000}
      CHAT_RECOVERY_EVIDENCE_MAX_CHARS: ${CHAT_RECOVERY_EVIDENCE_MAX_CHARS:-32000}
      CHAT_INTENT_ROUTER_ENABLED: ${CHAT_INTENT_ROUTER_ENABLED:-1}
      CHAT_INTENT_ROUTER_CONFIDENCE: ${CHAT_INTENT_ROUTER_CONFIDENCE:-0.65}
      CHAT_INTENT_ROUTER_TIMEOUT_SECONDS: ${CHAT_INTENT_ROUTER_TIMEOUT_SECONDS:-15}
      FEISHU_CAPABILITY_API_URL: ${FEISHU_CAPABILITY_API_URL:-http://127.0.0.1:4000}
      FEISHU_CAPABILITY_TIMEOUT_SECONDS: ${FEISHU_CAPABILITY_TIMEOUT_SECONDS:-15}
      HOT_VIDEO_REPORT_SCHEDULER_ENABLED: ${HOT_VIDEO_REPORT_SCHEDULER_ENABLED:-1}
      VIDEO_DAILY_REPORT_COMPLETED_URL: ${VIDEO_DAILY_REPORT_COMPLETED_URL:-}
      VIDEO_DAILY_REPORT_TOKEN: ${VIDEO_DAILY_REPORT_TOKEN:-}
      VIDEO_DAILY_REPORT_CALLBACK_TIMEOUT: ${VIDEO_DAILY_REPORT_CALLBACK_TIMEOUT:-10}
      MAX_FRAMES: ${MAX_FRAMES:-20}
      FRAME_ANALYSIS_MAX_TOKENS: ${FRAME_ANALYSIS_MAX_TOKENS:-1200}
      FRAME_ANALYSIS_RETRY_MAX_TOKENS: ${FRAME_ANALYSIS_RETRY_MAX_TOKENS:-2400}
      FRAME_CONTEXT_WINDOW: ${FRAME_CONTEXT_WINDOW:-3}
      VIDEO_RECONSTRUCTION_MAX_TOKENS: ${VIDEO_RECONSTRUCTION_MAX_TOKENS:-8192}
      VIDEO_RECONSTRUCTION_RETRY_MAX_TOKENS: ${VIDEO_RECONSTRUCTION_RETRY_MAX_TOKENS:-12000}
      LONG_VIDEO_FRAME_INTERVAL_SECONDS: ${LONG_VIDEO_FRAME_INTERVAL_SECONDS:-10}
      LONG_VIDEO_MAX_FRAMES: ${LONG_VIDEO_MAX_FRAMES:-60}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      LANGUAGE: ${LANGUAGE:-zh}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: ${HF_HOME:-/workspace/data/model_cache/huggingface}
      HF_HUB_CACHE: ${HF_HUB_CACHE:-/workspace/data/model_cache/huggingface/hub}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/workspace/data/model_cache/huggingface/hub}
      TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE:-/workspace/data/model_cache/huggingface/transformers}
      XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/workspace/data/model_cache}
      PLAYWRIGHT_BROWSERS_PATH: ${PLAYWRIGHT_BROWSERS_PATH:-/root/.cache/ms-playwright}
      WEB_PORT: ${WEB_PORT:-4002}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
    working_dir: /workspace
    volumes:
      - ./videos:/workspace/videos
      - ./output:/workspace/output
      - ${DATA_DIR:-./data}:/workspace/data
      - ./scripts:/workspace/scripts:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${OCR_SHARED_DIR:-/home/openclaw/ocr-shared}:${OCR_SERVER_SHARED_DIR:-/home/openclaw/ocr-shared}
      - ${MIHOMO_CONFIG_DIR:-/etc/mihomo}:/host/etc/mihomo
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('WEB_PORT', '4002') + '/healthz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  sing-box:
    image: short-video-analyzer-sing-box:1.13.14
    build:
      context: .
      dockerfile: Dockerfile.sing-box
      network: host
      args:
        HTTP_PROXY: ${SING_BOX_DOWNLOAD_PROXY:-http://127.0.0.1:7890}
        HTTPS_PROXY: ${SING_BOX_DOWNLOAD_PROXY:-http://127.0.0.1:7890}
    command: -D /var/lib/sing-box -C /etc/sing-box run
    volumes:
      - ${DATA_DIR:-./data}/sing-box:/etc/sing-box
    network_mode: host
    restart: unless-stopped

  sellersprite-redirect:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ALL_PROXY: ${ALL_PROXY:-}
        all_proxy: ${all_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
        no_proxy: ${no_proxy:-}
    image: short-video-analyzer:latest
    command: python scripts/sellersprite_redirect.py
    environment:
      WEB_PORT: ${WEB_PORT:-4002}
      SELLERSPRITE_REDIRECT_PORT: ${SELLERSPRITE_REDIRECT_PORT:-3001}
    ports:
      - "${SELLERSPRITE_REDIRECT_PORT:-3001}:${SELLERSPRITE_REDIRECT_PORT:-3001}"
    restart: unless-stopped
    depends_on:
      - web

networks:
  analyzer:
