<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--border2:#f1f5f9;--brand:#2563eb;--brand2:#1d4ed8;--brand-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;--radius-sm:8px;--radius:12px;--radius-lg:16px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid transparent;border-radius:var(--radius-sm);padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s ease;white-space:nowrap}
button.primary{background:var(--brand);color:#fff}button.primary:hover{background:var(--brand2)}
button.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}button.secondary:hover{background:var(--brand-soft);border-color:var(--brand)}
button.ghost{background:transparent;color:var(--text2)}button.ghost:hover{background:var(--border2)}
button.sm{min-height:28px;padding:3px 8px;font-size:11px;border-radius:6px}button.danger{color:var(--red)}button.danger:hover{background:var(--red-soft)}

textarea{width:100%;border:1px solid var(--border);border-radius:20px;background:var(--surface);padding:10px 14px;font-size:13px;outline:none;resize:none;min-height:42px;max-height:120px}

header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header h1{font-size:18px;font-weight:700}
.app-nav{height:48px;display:flex;align-items:center;gap:4px;padding:4px;border:1px solid #e5e7eb;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.03);overflow-x:auto;scrollbar-width:none}.app-nav::-webkit-scrollbar{display:none}
.app-nav__item{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid transparent;border-radius:10px;color:#64748b;text-decoration:none;font-size:13px;font-weight:650;line-height:1;white-space:nowrap;transition:.16s ease}
.app-nav__item svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:0 0 18px}
.app-nav__item:hover{background:#f8fafc;color:#334155;border-color:#eef2f7}.app-nav__item:hover svg{stroke:#64748b}
.app-nav__item.active{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}.app-nav__item.active svg{stroke:#2563eb}
.chat-shell{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 60px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);display:grid;gap:10px}
.session-list{overflow-y:auto}
.session-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:8px;transition:.1s ease}
.session-item:hover{background:var(--border2)}.session-item.active{background:var(--brand-soft);border-left:3px solid var(--brand);padding-left:13px}
.session-item .info{min-width:0;flex:1}.session-item .title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item .meta{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item .del-btn{display:none;color:var(--text3);min-height:auto;padding:4px 6px;font-size:14px}.session-item:hover .del-btn{display:inline-flex}
.chat-main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.messages{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;max-width:80%}.msg.user{align-self:flex-end;align-items:flex-end}.msg.assistant{align-self:flex-start}
.msg .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.6;font-size:14px;word-break:break-word}.msg .time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.msg.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.assistant .bubble h1,.msg.assistant .bubble h2,.msg.assistant .bubble h3{margin:4px 0 10px;font-size:16px;line-height:1.4}
.msg.assistant .bubble h1{font-size:18px}.msg.assistant .bubble h2{font-size:17px}.msg.assistant .bubble p{margin:8px 0}.msg.assistant .bubble hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.msg.assistant .bubble code{background:var(--border2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px}.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:8px 0;padding-left:22px}.msg.assistant .bubble li{margin:3px 0}
.msg.assistant .bubble a{color:var(--brand);font-weight:600;text-decoration:none;word-break:break-all}.msg.assistant .bubble a:hover{text-decoration:underline}
.msg-actions{display:flex;align-items:center;gap:6px;margin-top:6px;padding-left:4px}.msg-actions button{color:var(--text3)}.msg-actions button:hover{color:var(--brand)}.msg-action-status{font-size:11px;color:var(--text3);min-height:18px}.msg-action-status.err{color:var(--red)}.msg-action-status.ok{color:var(--green)}
.md-table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:8px;background:#fff}.md-table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}.md-table th,.md-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}.md-table th:last-child,.md-table td:last-child{border-right:0}.md-table tr:last-child td{border-bottom:0}.md-table th{background:var(--border2);font-weight:800;color:var(--text)}
.tool-log{margin:4px 0}.tool-log summary{cursor:pointer;color:var(--text2);font-size:12px;font-weight:700;margin:4px 0 6px}.tool-card{margin:4px 0;background:var(--border2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px}.tool-card .tool-name{font-weight:700;color:var(--brand);margin-bottom:4px}.tool-card .tool-args{color:var(--text2);word-break:break-word}.tool-card .tool-status{font-size:11px;margin-top:4px}.tool-card .tool-status.ok{color:var(--green)}.tool-card .tool-status.err{color:var(--red)}
.cache-tag{display:inline-flex;align-items:center;margin-left:6px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;background:#fff;color:var(--text2);font-size:10px;font-weight:700}.cache-tag.hit{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.cache-tag.live{border-color:#bbf7d0;background:#f0fdf4;color:#047857}
.input-bar{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);align-items:flex-end}.composer{flex:1;display:flex;flex-direction:column;gap:6px}.file-input{display:none}.attachment-preview{display:flex;flex-wrap:wrap;gap:8px}.attachment-chip{position:relative;width:56px;height:56px;overflow:hidden;border:1px solid var(--border);border-radius:8px}.attachment-chip img{width:100%;height:100%;object-fit:cover}.attachment-chip button{position:absolute;top:3px;right:3px;min-height:20px;width:20px;padding:0;border-radius:999px;background:rgba(15,23,42,.72);color:#fff;font-size:11px}
.quote-preview{display:none;border:1px solid var(--border);border-left:3px solid var(--brand);background:var(--border2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--text2)}.quote-preview.show{display:block}.quote-preview .quote-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;color:var(--text);font-weight:700}.quote-preview .quote-text{max-height:72px;overflow:auto;white-space:pre-wrap;line-height:1.45}.quote-toolbar{position:fixed;z-index:60;display:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 30px rgba(15,23,42,.16);border-radius:10px;padding:5px}.quote-toolbar.show{display:flex}
.empty-chat{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:15px;text-align:center;flex-direction:column;gap:8px}.empty-chat b{color:var(--text);font-size:20px}.load-more{text-align:center;padding:8px;color:var(--text3);font-size:12px;cursor:pointer}.load-more:hover{color:var(--brand)}
@media(max-width:800px){.chat-shell{grid-template-columns:1fr}.sidebar{display:none}.msg{max-width:100%}.app-nav__label{display:none}}
</style>

<script>
const S={sessionId:"",sessions:[],messages:[],sse:null,loading:false,nextBefore:null,hasMore:false,attachments:[],quote:null,selectionText:""};
const BASE_PATH=location.pathname.startsWith("/fastmoss")?"/fastmoss":"/amazon";
const PROVIDER_TYPE=BASE_PATH==="/fastmoss"?"fastmoss":"sellersprite";
const PROVIDER_LABEL=PROVIDER_TYPE==="fastmoss"?"FastMoss":"SellerSprite";
const PROVIDER_EMPTY=PROVIDER_TYPE==="fastmoss"?"输入 TikTok Shop 选品、店铺、达人、内容或竞品问题":"输入 Amazon 选品、ASIN、关键词或类目问题";
const $=id=>document.getElementById(id),msgBox=$("messages"),emptyChat=$("emptyChat"),input=$("input");
const quoteToolbar=$("quoteToolbar"),quotePreview=$("quotePreview"),quotePreviewText=$("quotePreviewText");
const SESSION_KEY=`videoAnalyzer.${PROVIDER_TYPE}.sessionId`;
function makeId(){return crypto.randomUUID?crypto.randomUUID():`session-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`}
function initSession(){const url=new URL(location.href);S.sessionId=url.searchParams.get("session")||localStorage.getItem(SESSION_KEY)||makeId();rememberSession(S.sessionId)}
function rememberSession(id){S.sessionId=id;try{localStorage.setItem(SESSION_KEY,id)}catch(e){}const url=new URL(location.href);url.searchParams.set("session",id);history.replaceState(null,"",url)}
function api(path,params={}){const u=new URL(`${BASE_PATH}${path}`,location.origin);u.searchParams.set("session",S.sessionId);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});return u.pathname+u.search}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatTime(v){if(!v)return"";const d=typeof v==="number"?new Date(v*1000):new Date(v);return d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false})}
function inlineMd(v){let s=esc(v);const tokens=[];const keep=html=>{const k=`\u0000${tokens.length}\u0000`;tokens.push(html);return k};s=s.replace(/`([^`]+)`/g,(_,code)=>keep(`<code>${code}</code>`));s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(_,text,url){const safe=esc(url);return keep(`<a href="${safe}" target="_blank" rel="noopener noreferrer">${text}</a>`)});s=s.replace(/https?:\/\/[^\s<]+/g,function(url){let tail="";while(/[),.;:!?，。；：！？）]$/.test(url)){tail=url.slice(-1)+tail;url=url.slice(0,-1)}const safe=esc(url);return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`});s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');s=s.replace(/(^|[^\*])\*([^\*]+)\*/g,'$1<i>$2</i>');return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[Number(i)]||"")}
function splitTableRow(line){let t=String(line||"").trim();if(t.startsWith("|"))t=t.slice(1);if(t.endsWith("|"))t=t.slice(0,-1);return t.split("|").map(c=>c.trim())}
function isTableSeparator(line){const cells=splitTableRow(line);return cells.length>1&&cells.every(c=>/^:?-{3,}:?$/.test(c))}
function renderTable(lines,start){const headers=splitTableRow(lines[start]);let i=start+2,rows=[];while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()){rows.push(splitTableRow(lines[i]));i++}let html='<div class="md-table-wrap"><table class="md-table"><thead><tr>'+headers.map(h=>'<th>'+inlineMd(h)+'</th>').join("")+'</tr></thead><tbody>';rows.forEach(r=>{html+='<tr>'+headers.map((_,idx)=>'<td>'+inlineMd(r[idx]||"")+'</td>').join("")+'</tr>'});return {html:html+"</tbody></table></div>",next:i}}
function md(v){const lines=String(v||"").replace(/\r\n/g,"\n").split("\n");let out=[],i=0;while(i<lines.length){let line=lines[i],trim=line.trim();if(!trim){i++;continue}if(i+1<lines.length&&line.includes("|")&&isTableSeparator(lines[i+1])){const t=renderTable(lines,i);out.push(t.html);i=t.next;continue}let h=trim.match(/^(#{1,3})\s+(.+)$/);if(h){out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`);i++;continue}if(/^---+$/.test(trim)){out.push("<hr>");i++;continue}if(/^[-*]\s+/.test(trim)){let items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^[-*]\s+/,""))+"</li>");i++}out.push("<ul>"+items.join("")+"</ul>");continue}if(/^\d+[.)]\s+/.test(trim)){let items=[];while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^\d+[.)]\s+/,""))+"</li>");i++}out.push("<ol>"+items.join("")+"</ol>");continue}let p=[trim];i++;while(i<lines.length&&lines[i].trim()&&!lines[i].match(/^(#{1,3})\s+/)&&!(i+1<lines.length&&lines[i].includes("|")&&isTableSeparator(lines[i+1]))&&!/^[-*]\s+/.test(lines[i].trim())&&!/^\d+[.)]\s+/.test(lines[i].trim())){p.push(lines[i].trim());i++}out.push("<p>"+inlineMd(p.join("<br>"))+"</p>")}return out.join("")}
function cacheTag(result){const c=result?.cache||result?.data?._cache;if(!c||typeof c.hit==="undefined")return"";return `<span class="cache-tag ${c.hit?"hit":"live"}">${c.hit?"缓存命中":"实时调用"}</span>`}
function toolArgs(t,fallback){if(fallback&&typeof fallback==="object")return fallback;try{const raw=t?.function?.arguments;return typeof raw==="string"?JSON.parse(raw):(raw||{})}catch(e){return{}}}
function firstArg(args,names){for(const n of names){const v=args&&args[n];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim()}return""}
function shortValue(v){v=String(v||"").trim();if(!v)return"";if(v.length>80)v=v.slice(0,77)+"...";return v}
function normalizedToolArgs(args){const out={...(args||{})};if(typeof out.request==="string"){try{const parsed=JSON.parse(out.request);if(parsed&&typeof parsed==="object")Object.assign(out,parsed)}catch(e){}}return out}
function toolLabel(name){return {aba_research_monthly:"ABA 月度关键词",aba_research_trend:"ABA 关键词趋势",aba_research_weekly:"ABA 周度关键词",asin_coupon_trend:"ASIN 优惠券趋势",asin_detail:"ASIN 查询",asin_detail_with_coupon_trend:"ASIN 查询含优惠券趋势",asin_prediction:"ASIN 销量预测",asin_sales_trend:"ASIN 销量趋势",bsr_prediction:"BSR 销量预测",competitor_lookup:"竞品查询",google_trend:"Google 趋势",keepa_info:"Keepa 价格/排名历史",keyword_miner:"关键词挖掘",keyword_order:"关键词排序",keyword_research:"关键词调研",keyword_research_trends:"关键词趋势查询",market_brand_concentration:"品牌集中度",market_ebc_distribution:"EBC/A+ 分布",market_listing_date_distribution:"上架时间分布",market_listing_trend_distribution:"上架趋势分布",market_price_distribution:"价格分布",market_product_concentration:"商品集中度",market_product_demand_trend:"商品需求趋势",market_rating_distribution:"评分分布",market_ratings_count_distribution:"评论数分布",market_research:"市场调研",market_research_statistics:"市场调研统计",market_seller_concentration:"卖家集中度",market_seller_country_distribution:"卖家国家分布",market_seller_type_concentration:"卖家类型集中度",product_node:"商品节点查询",product_research:"商品调研",review:"评论查询",trademark_country_list:"商标国家列表",trademark_detail:"商标详情",trademark_list:"商标列表",trademark_stats:"商标统计",traffic_extend:"流量拓展",traffic_keyword:"流量关键词",traffic_keyword_stat:"流量关键词统计",traffic_listing:"关联流量商品",traffic_listing_stat:"关联流量统计",traffic_source:"流量来源"}[name]||name}
function toolParamSummary(args){const a=normalizedToolArgs(args);const pairs=[["marketplace","站点"],["market","站点"],["country","国家"],["keyword","关键词"],["query","关键词"],["nodeId","节点"],["node_id","节点"],["nodeIdPath","节点路径"],["asin","ASIN"],["brand","品牌"],["category","类目"],["department","类目"],["minPrice","最低价"],["maxPrice","最高价"],["startDate","开始"],["endDate","结束"]];const parts=[];for(const [key,label] of pairs){if(a[key]!==undefined&&a[key]!==null&&String(a[key]).trim())parts.push(`${label}: ${shortValue(a[key])}`)}if(!parts.length&&a.request)parts.push(`请求: ${shortValue(a.request)}`);return parts.join(" · ")}
function toolDisplayName(name,args,running=false){const a=normalizedToolArgs(args);const keyword=shortValue(firstArg(a,["keyword","query","q","search_query","term"]));const node=shortValue(firstArg(a,["nodeId","node_id","nodeIdPath","category","department"]));const asin=shortValue(firstArg(a,["asin","product_id"]));const target=keyword||node||asin;const doing=running?"正在":"";const label=toolLabel(name);return `${doing}${label}${target?`：${target}`:""}`}
function renderToolLog(m){const results=Array.isArray(m?.raw?.toolResults)?m.raw.toolResults:[];if(!results.length)return"";const cards=results.map(item=>{const name=item?.toolCall?.function?.name||item?.result?.request?.apiPath||"unknown_tool";const args=toolArgs(item?.toolCall,item?.args);const ok=!!item?.result?.ok;const err=item?.result?.error?.message||item?.result?.error?.code||"";const title=toolDisplayName(name,args,false);const params=toolParamSummary(args);return `<div class="tool-card"><div class="tool-name">🔧 ${esc(title)}</div>${params?`<div class="tool-args">参数：${esc(params)}</div>`:""}<div class="tool-status ${ok?"ok":"err"}">${ok?"✓":"✗"} ${esc(toolLabel(name))}: ${ok?"成功":"失败"}${cacheTag(item?.result)}</div>${err?`<div class="tool-args">${esc(err)}</div>`:""}</div>`}).join("");const done=m.status==="done"&&String(m.content||"").trim();return done?`<details class="tool-log"><summary>工具调用记录 (${results.length})</summary>${cards}</details>`:`<div class="tool-log">${cards}</div>`}
function showEmpty(show){if(show&&!emptyChat.parentNode)msgBox.appendChild(emptyChat);emptyChat.style.display=show?"flex":"none"}
function hideQuoteToolbar(){quoteToolbar.classList.remove("show")}
function currentAssistantSelection(){const sel=window.getSelection();if(!sel||sel.rangeCount===0||sel.isCollapsed)return null;const text=sel.toString().replace(/\s+/g," ").trim();if(text.length<2)return null;const range=sel.getRangeAt(0);let node=range.commonAncestorContainer;if(node.nodeType===3)node=node.parentElement;const bubble=node&&node.closest?node.closest(".msg.assistant .bubble"):null;if(!bubble||!msgBox.contains(bubble))return null;return {text,rect:range.getBoundingClientRect()}}
function showQuoteToolbar(){setTimeout(()=>{const picked=currentAssistantSelection();if(!picked){hideQuoteToolbar();return}S.selectionText=picked.text.slice(0,2000);const left=Math.min(window.innerWidth-130,Math.max(8,picked.rect.left));const top=Math.max(8,picked.rect.top-42);quoteToolbar.style.left=left+"px";quoteToolbar.style.top=top+"px";quoteToolbar.classList.add("show")},0)}
function setQuote(text){S.quote=String(text||"").trim().slice(0,2000);if(!S.quote){clearQuote();return}quotePreviewText.textContent=S.quote;quotePreview.classList.add("show")}
function clearQuote(){S.quote=null;quotePreviewText.textContent="";quotePreview.classList.remove("show")}
function isFinishedAssistant(m){const status=String(m&&m.status||"done").toLowerCase();return m&&m.role==="assistant"&&String(m.content||"").trim()&&status!=="pending"&&status!=="error"&&m.id!=="guide"}
function chatPdfName(){const d=new Date(),pad=n=>String(n).padStart(2,"0");return `${PROVIDER_TYPE}-reply-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.pdf`}
async function copyChatReply(text,statusEl){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}statusEl.textContent="已复制";statusEl.className="msg-action-status ok"}catch(e){statusEl.textContent="复制失败";statusEl.className="msg-action-status err"}}
async function exportChatReplyPdf(messageId,button,statusEl){if(!messageId)return;const original=button.textContent;button.disabled=true;button.textContent="生成中";statusEl.textContent="";statusEl.className="msg-action-status";try{const r=await fetch(`${BASE_PATH}/api/chat/export-pdf`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:S.sessionId,messageId})});if(!r.ok){let msg="PDF 导出失败";try{const p=await r.json();msg=p.error||msg}catch(e){}throw new Error(msg)}const blob=await r.blob();const href=URL.createObjectURL(blob),link=document.createElement("a");link.href=href;link.download=chatPdfName();document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(href);statusEl.textContent="已下载";statusEl.className="msg-action-status ok"}catch(e){statusEl.textContent=e.message||"PDF 导出失败";statusEl.className="msg-action-status err"}finally{button.disabled=false;button.textContent=original}}
function bindMessageActions(div,m){const actions=div.querySelector(".msg-actions");if(!actions)return;const statusEl=actions.querySelector(".msg-action-status");const copyBtn=actions.querySelector(".copy-reply");const pdfBtn=actions.querySelector(".export-reply-pdf");if(copyBtn)copyBtn.onclick=()=>copyChatReply(String(m.content||""),statusEl);if(pdfBtn)pdfBtn.onclick=()=>exportChatReplyPdf(String(m.id||""),pdfBtn,statusEl)}
function renderMsg(m,scroll=true){let div=msgBox.querySelector(`[data-id="${CSS.escape(String(m.id||""))}"]`);if(!div){div=document.createElement("div");msgBox.appendChild(div)}div.dataset.id=m.id||"";div.className="msg "+(m.role==="user"?"user":"assistant");let body=m.role==="user"?`<div class="bubble">${esc(m.content)}</div>`:renderToolLog(m)+`<div class="bubble">${m.status==="pending"?"思考中...":md(m.content||"")}</div>`;if(isFinishedAssistant(m))body+='<div class="msg-actions"><button type="button" class="ghost sm export-reply-pdf">导出 PDF</button><button type="button" class="ghost sm copy-reply">复制</button><span class="msg-action-status" aria-live="polite"></span></div>';if(m.createdAt)body+=`<div class="time">${formatTime(m.createdAt)}</div>`;div.innerHTML=body;bindMessageActions(div,m);if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
function renderMessages(scroll=true){msgBox.innerHTML="";if(S.hasMore){const more=document.createElement("div");more.className="load-more";more.textContent="加载更早消息";more.onclick=loadOlder;msgBox.appendChild(more)}S.messages.forEach(m=>renderMsg(m,false));showEmpty(!S.messages.length);if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
async function loadSessions(){const r=await fetch(`${BASE_PATH}/api/sessions`);const d=await r.json();S.sessions=d.sessions||[];renderSessions()}
function renderSessions(){const list=$("sessionList");list.innerHTML="";const items=S.sessions.some(s=>s.id===S.sessionId)?S.sessions:[{id:S.sessionId,title:"新对话",messageCount:0,lastMessage:"未开始对话"},...S.sessions];items.forEach(s=>{const el=document.createElement("div");el.className="session-item"+(s.id===S.sessionId?" active":"");el.innerHTML=`<div class="info"><div class="title">${esc(s.title||s.id)}</div><div class="meta">${esc(s.lastMessage||((s.messageCount||0)+" 条消息"))}</div></div>${s.messageCount?'<button class="ghost del-btn">×</button>':""}`;el.onclick=e=>{if(e.target.closest("button"))return;switchSession(s.id)};const del=el.querySelector("button");if(del)del.onclick=e=>{e.stopPropagation();deleteSession(s.id)};list.appendChild(el)})}
async function loadMessages(){const r=await fetch(api("/api/messages",{maxChars:20000}));const d=await r.json();S.messages=d.messages||[];S.nextBefore=d.nextBefore||null;S.hasMore=!!d.hasMore;renderMessages(true);if(!S.messages.length)showGuide()}
async function loadOlder(){if(!S.hasMore||!S.nextBefore)return;const oldHeight=msgBox.scrollHeight;const r=await fetch(api("/api/messages",{before:S.nextBefore,maxChars:20000}));const d=await r.json();S.messages=[...(d.messages||[]),...S.messages];S.nextBefore=d.nextBefore||null;S.hasMore=!!d.hasMore;renderMessages(false);msgBox.scrollTop=msgBox.scrollHeight-oldHeight}
async function showGuide(){const r=await fetch(api("/api/guide"));const d=await r.json();if(d.guide)renderMsg({...d.guide,id:"guide"},true)}
function pendingTooLong(){const now=Date.now();return S.messages.some(m=>m&&m.role==="assistant"&&m.status==="pending"&&now-(Date.parse(m.createdAt)||now)>12000)}
async function refreshCurrentMessages(scroll=false){if(S.refreshing)return;S.refreshing=true;try{const r=await fetch(api("/api/messages",{maxChars:20000}));const d=await r.json();S.messages=d.messages||[];S.nextBefore=d.nextBefore||null;S.hasMore=!!d.hasMore;renderMessages(scroll);loadSessions().catch(()=>{})}finally{S.refreshing=false}}
function closeSSE(){if(S.sse){S.sse.close();S.sse=null}}
function connectEvents(){closeSSE();const es=new EventSource(api("/api/events"));S.sse=es;es.addEventListener("message",e=>{const m=JSON.parse(e.data);const idx=S.messages.findIndex(x=>x.id===m.id);if(idx>=0){S.messages[idx]=m}else{const pendingIdx=S.messages.findIndex(x=>x.role==="assistant"&&x.status==="pending");if(pendingIdx>=0&&m.role==="assistant")S.messages[pendingIdx]=m;else S.messages.push(m)}showEmpty(false);renderMessages(true);loadSessions().catch(()=>{})});es.addEventListener("clear",()=>{S.messages=[];renderMessages();loadSessions().catch(()=>{})})}
async function switchSession(id){rememberSession(id);closeSSE();await loadMessages();await loadSessions();connectEvents()}
async function deleteSession(id){if(!confirm("删除此对话？"))return;await fetch(apiForSession("/api/session",id),{method:"DELETE"});if(id===S.sessionId){rememberSession(makeId());S.messages=[];renderMessages()}await loadSessions()}
function apiForSession(path,id){const u=new URL(`${BASE_PATH}${path}`,location.origin);u.searchParams.set("session",id);return u.pathname+u.search}
async function send(){const rawText=input.value.trim();if((!rawText&&!S.attachments.length)||S.loading)return;const quoteText=S.quote?String(S.quote).trim():"";const text=quoteText?`引用内容：\n> ${quoteText.replace(/\n/g,"\n> ")}\n\n我的问题：${rawText}`:rawText;S.loading=true;input.value="";clearQuote();const attachments=S.attachments.splice(0);renderAttachments();showEmpty(false);const started=new Date().toISOString();const user={id:"u-"+Date.now(),role:"user",content:text,createdAt:started,status:"done"};S.messages.push(user);renderMsg(user);const pending={id:"a-"+Date.now(),role:"assistant",content:"思考中...",createdAt:started,status:"pending"};S.messages.push(pending);renderMsg(pending);try{const r=await fetch(api("/api/ask"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:S.sessionId,message:text,attachments})});let d={};try{d=await r.json()}catch(e){}if(!r.ok&&r.status!==202){throw new Error(d?.data?.message||d?.error||"请求失败")}if(d?.message?.id){pending.id=d.message.id;pending.content=d.message.content||pending.content;pending.createdAt=d.message.createdAt||pending.createdAt;pending.status=d.message.status||pending.status;renderMessages(true)}connectEvents();setTimeout(()=>loadMessages().catch(()=>{}),700);loadSessions().catch(()=>{})}catch(e){pending.status="error";pending.content=e.message||"请求失败";renderMessages(true)}finally{S.loading=false}}
function fileToAttachment(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/"))return resolve(null);if(file.size>6*1024*1024)return reject(new Error("image exceeds 6MB"));const reader=new FileReader();reader.onload=()=>resolve({name:file.name||"image",type:file.type,size:file.size,dataUrl:reader.result});reader.onerror=()=>reject(new Error("image read failed"));reader.readAsDataURL(file)})}
async function addFiles(files){const items=(await Promise.all(Array.from(files||[]).filter(f=>f.type.startsWith("image/")).map(fileToAttachment))).filter(Boolean);S.attachments.push(...items);S.attachments.splice(6);renderAttachments()}
function renderAttachments(){const box=$("attachmentPreview");box.innerHTML="";S.attachments.forEach((a,i)=>{const chip=document.createElement("div");chip.className="attachment-chip";chip.innerHTML=`<img src="${esc(a.dataUrl)}" alt=""><button type="button">×</button>`;chip.querySelector("button").onclick=()=>{S.attachments.splice(i,1);renderAttachments()};box.appendChild(chip)})}
$("sendBtn").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("newSession").onclick=()=>switchSession(makeId());$("guideBtn").onclick=showGuide;$("uploadBtn").onclick=()=>$("imageInput").click();$("imageInput").onchange=e=>addFiles(e.target.files).catch(err=>alert(err.message));
msgBox.addEventListener("mouseup",showQuoteToolbar);msgBox.addEventListener("keyup",showQuoteToolbar);$("quoteAskBtn").onclick=()=>{if(S.selectionText)setQuote(S.selectionText);hideQuoteToolbar();window.getSelection()?.removeAllRanges();input.focus()};$("clearQuote").onclick=clearQuote;document.addEventListener("mousedown",e=>{if(!quoteToolbar.contains(e.target))hideQuoteToolbar()});
function applyProviderChrome(){document.title=`${PROVIDER_LABEL} 对话`;const h=document.querySelector("header h1");if(h)h.textContent=`${PROVIDER_LABEL} 对话`;if(emptyChat){const b=emptyChat.querySelector("b"),span=emptyChat.querySelector("span");if(b)b.textContent=`${PROVIDER_LABEL} MCP`;if(span)span.textContent=PROVIDER_EMPTY}document.querySelectorAll(".app-nav__item").forEach(a=>a.classList.remove("active"));const current=document.querySelector(`.app-nav__item[href="${BASE_PATH}"]`);if(current)current.classList.add("active");if(!document.querySelector('.app-nav__item[href="/fastmoss"]')){const amazon=document.querySelector('.app-nav__item[href="/amazon"]');if(amazon){const fast=amazon.cloneNode(true);fast.href="/fastmoss";fast.title="FastMoss";const label=fast.querySelector(".app-nav__label");if(label)label.textContent="FastMoss";fast.classList.toggle("active",BASE_PATH==="/fastmoss");amazon.after(fast)}}}
applyProviderChrome();initSession();loadSessions().then(loadMessages).then(connectEvents).catch(e=>{msgBox.innerHTML=`<div class="empty-chat"><b>加载失败</b><span>${esc(e.message)}</span></div>`});setInterval(()=>{if(pendingTooLong())refreshCurrentMessages(false)},5000);addEventListener("focus",()=>{if(pendingTooLong())refreshCurrentMessages(false)});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pendingTooLong())refreshCurrentMessages(false)});
</script>
</body>
