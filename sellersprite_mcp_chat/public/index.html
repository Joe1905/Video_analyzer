<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SellerSprite 对话</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--border:#e2e8f0;--border2:#f1f5f9;--brand:#2563eb;--brand2:#1d4ed8;--brand-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;--radius-sm:8px;--radius:12px;--radius-lg:16px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid transparent;border-radius:var(--radius-sm);padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s ease;white-space:nowrap}
button.primary{background:var(--brand);color:#fff}button.primary:hover{background:var(--brand2)}
button.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}button.secondary:hover{background:var(--brand-soft);border-color:var(--brand)}
button.ghost{background:transparent;color:var(--text2)}button.ghost:hover{background:var(--border2)}
button.sm{min-height:28px;padding:3px 8px;font-size:11px;border-radius:6px}button.danger{color:var(--red)}button.danger:hover{background:var(--red-soft)}
button:disabled{opacity:.55;cursor:not-allowed}
textarea{width:100%;border:1px solid var(--border);border-radius:20px;background:var(--surface);padding:10px 14px;font-size:13px;outline:none;resize:none;min-height:42px;max-height:120px}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.8);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header h1{font-size:18px;font-weight:700}
.app-nav{height:48px;display:flex;align-items:center;gap:4px;padding:4px;border:1px solid #e5e7eb;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.03);overflow-x:auto;scrollbar-width:none}.app-nav::-webkit-scrollbar{display:none}
.app-nav__item{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid transparent;border-radius:10px;color:#64748b;text-decoration:none;font-size:13px;font-weight:650;line-height:1;white-space:nowrap;transition:.16s ease}
.app-nav__item svg{width:18px;height:18px;stroke:#94a3b8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:0 0 18px}
.app-nav__item:hover{background:#f8fafc;color:#334155;border-color:#eef2f7}.app-nav__item:hover svg{stroke:#64748b}
.app-nav__item.active{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}.app-nav__item.active svg{stroke:#2563eb}
.chat-shell{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100vh - 60px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);display:grid;gap:10px}
.session-list{overflow-y:auto}
.session-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;gap:8px;transition:.1s ease}
.session-item:hover{background:var(--border2)}.session-item.active{background:var(--brand-soft);border-left:3px solid var(--brand);padding-left:13px}
.session-item .info{min-width:0;flex:1}.session-item .title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item .meta{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item .del-btn{display:none;color:var(--text3);min-height:auto;padding:4px 6px;font-size:14px}.session-item:hover .del-btn{display:inline-flex}
.chat-main{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.messages{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;max-width:80%}.msg.user{align-self:flex-end;align-items:flex-end}.msg.assistant{align-self:flex-start}
.msg .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.6;font-size:14px;word-break:break-word}.msg .time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.msg.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.assistant .bubble h1,.msg.assistant .bubble h2,.msg.assistant .bubble h3{margin:4px 0 10px;font-size:16px;line-height:1.4}
.msg.assistant .bubble h1{font-size:18px}.msg.assistant .bubble h2{font-size:17px}.msg.assistant .bubble p{margin:8px 0}.msg.assistant .bubble hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.msg.assistant .bubble code{background:var(--border2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px}.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:8px 0;padding-left:22px}.msg.assistant .bubble li{margin:3px 0}
.md-table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--border);border-radius:8px;background:#fff}.md-table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}.md-table th,.md-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}.md-table th:last-child,.md-table td:last-child{border-right:0}.md-table tr:last-child td{border-bottom:0}.md-table th{background:var(--border2);font-weight:800;color:var(--text)}
.tool-log{margin:4px 0}.tool-log summary{cursor:pointer;color:var(--text2);font-size:12px;font-weight:700;margin:4px 0 6px}.tool-card{margin:4px 0;background:var(--border2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px}.tool-card .tool-name{font-weight:700;color:var(--brand);margin-bottom:4px}.tool-card .tool-args{color:var(--text2);word-break:break-word}.tool-card .tool-status{font-size:11px;margin-top:4px}.tool-card .tool-status.ok{color:var(--green)}.tool-card .tool-status.err{color:var(--red)}
.cache-tag{display:inline-flex;align-items:center;margin-left:6px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;background:#fff;color:var(--text2);font-size:10px;font-weight:700}.cache-tag.hit{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.cache-tag.live{border-color:#bbf7d0;background:#f0fdf4;color:#047857}
.input-bar{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);align-items:flex-end}.composer{flex:1;display:flex;flex-direction:column;gap:6px}.file-input{display:none}.attachment-preview{display:flex;flex-wrap:wrap;gap:8px}.attachment-chip{position:relative;width:56px;height:56px;overflow:hidden;border:1px solid var(--border);border-radius:8px}.attachment-chip img{width:100%;height:100%;object-fit:cover}.attachment-chip button{position:absolute;top:3px;right:3px;min-height:20px;width:20px;padding:0;border-radius:999px;background:rgba(15,23,42,.72);color:#fff;font-size:11px}
.empty-chat{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:15px;text-align:center;flex-direction:column;gap:8px}.empty-chat b{color:var(--text);font-size:20px}.load-more{text-align:center;padding:8px;color:var(--text3);font-size:12px;cursor:pointer}.load-more:hover{color:var(--brand)}
@media(max-width:800px){.chat-shell{grid-template-columns:1fr}.sidebar{display:none}.msg{max-width:100%}.app-nav__label{display:none}}
</style>
</head>
<body>
<header>
  <h1>SellerSprite 对话</h1>
  <nav class="app-nav" aria-label="主导航">
    <a class="app-nav__item" href="/" title="AI 聊天"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span class="app-nav__label">首页</span></a>
    <a class="app-nav__item" href="/report" title="每日报告"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M10 12h6"/><path d="M10 16h4"/></svg><span class="app-nav__label">日报</span></a>
    <a class="app-nav__item active" href="/amazon" title="Amazon"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/></svg><span class="app-nav__label">Amazon</span></a>
    <a class="app-nav__item" href="/shop" title="Shop"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M5 11h14"/></svg><span class="app-nav__label">Shop</span></a>
    <a class="app-nav__item" href="/metrics" title="数据"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M20 19H4"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-7"/></svg><span class="app-nav__label">数据</span></a>
    <a class="app-nav__item" href="/extract" title="视频分析"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m10 9 5 3-5 3z"/><path d="M8 21h8"/><path d="M12 19v2"/></svg><span class="app-nav__label">分析</span></a>
  </nav>
</header>
<div class="chat-shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <button class="primary" style="width:100%" id="newSession">+ 新建对话</button>
      <button class="secondary sm" id="guideBtn">使用手册</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>
  <main class="chat-main">
    <div class="messages" id="messages"><div class="empty-chat" id="emptyChat"><b>SellerSprite MCP</b><span>输入 Amazon 选品、ASIN、关键词或类目问题</span></div></div>
    <div class="input-bar">
      <input id="imageInput" class="file-input" type="file" accept="image/*" multiple>
      <button id="uploadBtn" class="secondary" title="上传图片">+</button>
      <div class="composer">
        <div id="attachmentPreview" class="attachment-preview"></div>
        <textarea id="input" rows="1" placeholder="输入自然语言问题，Enter 发送，Shift+Enter 换行"></textarea>
      </div>
      <button id="sendBtn" class="primary">发送</button>
    </div>
  </main>
</div>
<script>
const S={sessionId:"",sessions:[],messages:[],sse:null,loading:false,nextBefore:null,hasMore:false,attachments:[]};
const $=id=>document.getElementById(id),msgBox=$("messages"),emptyChat=$("emptyChat"),input=$("input");
const SESSION_KEY="videoAnalyzer.sellersprite.sessionId";
function makeId(){return crypto.randomUUID?crypto.randomUUID():`session-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`}
function initSession(){const url=new URL(location.href);S.sessionId=url.searchParams.get("session")||localStorage.getItem(SESSION_KEY)||makeId();rememberSession(S.sessionId)}
function rememberSession(id){S.sessionId=id;try{localStorage.setItem(SESSION_KEY,id)}catch(e){}const url=new URL(location.href);url.searchParams.set("session",id);history.replaceState(null,"",url)}
function api(path,params={}){const u=new URL(`/amazon${path}`,location.origin);u.searchParams.set("session",S.sessionId);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});return u.pathname+u.search}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function formatTime(v){if(!v)return"";const d=typeof v==="number"?new Date(v*1000):new Date(v);return d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false})}
function inlineMd(v){let s=esc(v);const keep=[];s=s.replace(/`([^`]+)`/g,(_,c)=>{const k=`\0${keep.length}\0`;keep.push(`<code>${c}</code>`);return k});s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(_,t,u)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`);s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");s=s.replace(/\0(\d+)\0/g,(_,i)=>keep[Number(i)]||"");return s}
function splitTableRow(line){let t=String(line||"").trim();if(t.startsWith("|"))t=t.slice(1);if(t.endsWith("|"))t=t.slice(0,-1);return t.split("|").map(c=>c.trim())}
function isTableSeparator(line){const cells=splitTableRow(line);return cells.length>1&&cells.every(c=>/^:?-{3,}:?$/.test(c))}
function renderTable(lines,start){const headers=splitTableRow(lines[start]);let i=start+2,rows=[];while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()){rows.push(splitTableRow(lines[i]));i++}let html='<div class="md-table-wrap"><table class="md-table"><thead><tr>'+headers.map(h=>'<th>'+inlineMd(h)+'</th>').join("")+'</tr></thead><tbody>';rows.forEach(r=>{html+='<tr>'+headers.map((_,idx)=>'<td>'+inlineMd(r[idx]||"")+'</td>').join("")+'</tr>'});return {html:html+"</tbody></table></div>",next:i}}
function md(v){const lines=String(v||"").replace(/\r\n/g,"\n").split("\n");let out=[],i=0;while(i<lines.length){let line=lines[i],trim=line.trim();if(!trim){i++;continue}if(i+1<lines.length&&line.includes("|")&&isTableSeparator(lines[i+1])){const t=renderTable(lines,i);out.push(t.html);i=t.next;continue}let h=trim.match(/^(#{1,3})\s+(.+)$/);if(h){out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`);i++;continue}if(/^---+$/.test(trim)){out.push("<hr>");i++;continue}if(/^[-*]\s+/.test(trim)){let items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^[-*]\s+/,""))+"</li>");i++}out.push("<ul>"+items.join("")+"</ul>");continue}if(/^\d+[.)]\s+/.test(trim)){let items=[];while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i].trim())){items.push("<li>"+inlineMd(lines[i].trim().replace(/^\d+[.)]\s+/,""))+"</li>");i++}out.push("<ol>"+items.join("")+"</ol>");continue}let p=[trim];i++;while(i<lines.length&&lines[i].trim()&&!lines[i].match(/^(#{1,3})\s+/)&&!(i+1<lines.length&&lines[i].includes("|")&&isTableSeparator(lines[i+1]))&&!/^[-*]\s+/.test(lines[i].trim())&&!/^\d+[.)]\s+/.test(lines[i].trim())){p.push(lines[i].trim());i++}out.push("<p>"+inlineMd(p.join("<br>"))+"</p>")}return out.join("")}
function cacheTag(result){const c=result?.cache||result?.data?._cache;if(!c||typeof c.hit==="undefined")return"";return `<span class="cache-tag ${c.hit?"hit":"live"}">${c.hit?"缓存命中":"实时调用"}</span>`}
function toolArgs(t,fallback){if(fallback&&typeof fallback==="object")return fallback;try{const raw=t?.function?.arguments;return typeof raw==="string"?JSON.parse(raw):(raw||{})}catch(e){return{}}}
function shortJson(v){const s=JSON.stringify(v||{});return s.length>220?s.slice(0,217)+"...":s}
function renderToolLog(m){const results=Array.isArray(m?.raw?.toolResults)?m.raw.toolResults:[];if(!results.length)return"";const cards=results.map(item=>{const name=item?.toolCall?.function?.name||item?.result?.request?.apiPath||"unknown_tool";const ok=!!item?.result?.ok;const args=toolArgs(item?.toolCall,item?.args);const err=item?.result?.error?.message||item?.result?.error?.code||"";return `<div class="tool-card"><div class="tool-name">${esc(name)}</div><div class="tool-args">${esc(shortJson(args))}</div><div class="tool-status ${ok?"ok":"err"}">${ok?"成功":"失败"}${cacheTag(item?.result)}</div>${err?`<div class="tool-args">${esc(err)}</div>`:""}</div>`}).join("");return `<details class="tool-log" ${m.status==="pending"?"open":""}><summary>工具调用记录 (${results.length})</summary>${cards}</details>`}
function showEmpty(show){if(show&&!emptyChat.parentNode)msgBox.appendChild(emptyChat);emptyChat.style.display=show?"flex":"none"}
function renderMsg(m,scroll=true){let div=msgBox.querySelector(`[data-id="${CSS.escape(String(m.id||""))}"]`);if(!div){div=document.createElement("div");msgBox.appendChild(div)}div.dataset.id=m.id||"";div.className="msg "+(m.role==="user"?"user":"assistant");let body=m.role==="user"?`<div class="bubble">${esc(m.content)}</div>`:renderToolLog(m)+`<div class="bubble">${m.status==="pending"?"思考中...":md(m.content||"")}</div>`;if(m.createdAt)body+=`<div class="time">${formatTime(m.createdAt)}</div>`;div.innerHTML=body;if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
function renderMessages(scroll=true){msgBox.innerHTML="";if(S.hasMore){const more=document.createElement("div");more.className="load-more";more.textContent="加载更早消息";more.onclick=loadOlder;msgBox.appendChild(more)}S.messages.forEach(m=>renderMsg(m,false));showEmpty(!S.messages.length);if(scroll)msgBox.scrollTop=msgBox.scrollHeight}
async function loadSessions(){const r=await fetch("/amazon/api/sessions");const d=await r.json();S.sessions=d.sessions||[];renderSessions()}
function renderSessions(){const list=$("sessionList");list.innerHTML="";const items=S.sessions.some(s=>s.id===S.sessionId)?S.sessions:[{id:S.sessionId,title:"新对话",messageCount:0,lastMessage:"未开始对话"},...S.sessions];items.forEach(s=>{const el=document.createElement("div");el.className="session-item"+(s.id===S.sessionId?" active":"");el.innerHTML=`<div class="info"><div class="title">${esc(s.title||s.id)}</div><div class="meta">${esc(s.lastMessage||((s.messageCount||0)+" 条消息"))}</div></div>${s.messageCount?'<button class="ghost del-btn">×</button>':""}`;el.onclick=e=>{if(e.target.closest("button"))return;switchSession(s.id)};const del=el.querySelector("button");if(del)del.onclick=e=>{e.stopPropagation();deleteSession(s.id)};list.appendChild(el)})}
async function loadMessages(){const r=await fetch(api("/api/messages",{maxChars:20000}));const d=await r.json();S.messages=d.messages||[];S.nextBefore=d.nextBefore||null;S.hasMore=!!d.hasMore;renderMessages(true);if(!S.messages.length)showGuide()}
async function loadOlder(){if(!S.hasMore||!S.nextBefore)return;const oldHeight=msgBox.scrollHeight;const r=await fetch(api("/api/messages",{before:S.nextBefore,maxChars:20000}));const d=await r.json();S.messages=[...(d.messages||[]),...S.messages];S.nextBefore=d.nextBefore||null;S.hasMore=!!d.hasMore;renderMessages(false);msgBox.scrollTop=msgBox.scrollHeight-oldHeight}
async function showGuide(){const r=await fetch(api("/api/guide"));const d=await r.json();if(d.guide)renderMsg({...d.guide,id:"guide"},true)}
function closeSSE(){if(S.sse){S.sse.close();S.sse=null}}
function connectEvents(){closeSSE();const es=new EventSource(api("/api/events"));S.sse=es;es.addEventListener("message",e=>{const m=JSON.parse(e.data);const idx=S.messages.findIndex(x=>x.id===m.id);if(idx>=0)S.messages[idx]=m;else S.messages.push(m);showEmpty(false);renderMsg(m);loadSessions().catch(()=>{})});es.addEventListener("clear",()=>{S.messages=[];renderMessages();loadSessions().catch(()=>{})})}
async function switchSession(id){rememberSession(id);closeSSE();await loadMessages();await loadSessions();connectEvents()}
async function deleteSession(id){if(!confirm("删除此对话？"))return;await fetch(apiForSession("/api/session",id),{method:"DELETE"});if(id===S.sessionId){rememberSession(makeId());S.messages=[];renderMessages()}await loadSessions()}
function apiForSession(path,id){const u=new URL(`/amazon${path}`,location.origin);u.searchParams.set("session",id);return u.pathname+u.search}
async function send(){const text=input.value.trim();if((!text&&!S.attachments.length)||S.loading)return;S.loading=true;input.value="";const attachments=S.attachments.splice(0);renderAttachments();showEmpty(false);const started=new Date().toISOString();const user={id:"u-"+Date.now(),role:"user",content:text,createdAt:started,status:"done"};S.messages.push(user);renderMsg(user);const pending={id:"a-"+Date.now(),role:"assistant",content:"思考中...",createdAt:started,status:"pending"};S.messages.push(pending);renderMsg(pending);try{const r=await fetch(api("/api/ask"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:S.sessionId,message:text,attachments})});if(!r.ok&&r.status!==202){let d={};try{d=await r.json()}catch(e){}throw new Error(d?.data?.message||d?.error||"请求失败")}connectEvents();setTimeout(()=>loadMessages().catch(()=>{}),700);loadSessions().catch(()=>{})}catch(e){pending.status="error";pending.content=e.message||"请求失败";renderMsg(pending,false)}finally{S.loading=false}}
function fileToAttachment(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/"))return resolve(null);if(file.size>6*1024*1024)return reject(new Error("image exceeds 6MB"));const reader=new FileReader();reader.onload=()=>resolve({name:file.name||"image",type:file.type,size:file.size,dataUrl:reader.result});reader.onerror=()=>reject(new Error("image read failed"));reader.readAsDataURL(file)})}
async function addFiles(files){const items=(await Promise.all(Array.from(files||[]).filter(f=>f.type.startsWith("image/")).map(fileToAttachment))).filter(Boolean);S.attachments.push(...items);S.attachments.splice(6);renderAttachments()}
function renderAttachments(){const box=$("attachmentPreview");box.innerHTML="";S.attachments.forEach((a,i)=>{const chip=document.createElement("div");chip.className="attachment-chip";chip.innerHTML=`<img src="${esc(a.dataUrl)}" alt=""><button type="button">×</button>`;chip.querySelector("button").onclick=()=>{S.attachments.splice(i,1);renderAttachments()};box.appendChild(chip)})}
$("sendBtn").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("newSession").onclick=()=>switchSession(makeId());$("guideBtn").onclick=showGuide;$("uploadBtn").onclick=()=>$("imageInput").click();$("imageInput").onchange=e=>addFiles(e.target.files).catch(err=>alert(err.message));
initSession();loadSessions().then(loadMessages).then(connectEvents).catch(e=>{msgBox.innerHTML=`<div class="empty-chat"><b>加载失败</b><span>${esc(e.message)}</span></div>`});
</script>
</body>
</html>
